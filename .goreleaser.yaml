version: 2

project_name: ptah

before:
  hooks:
    - go mod tidy

builds:
  - id: ptah
    main: ./cmd/ptah
    binary: ptah
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    mod_timestamp: "{{ .CommitTimestamp }}"
    flags:
      - -trimpath
    ldflags:
      - >-
        -s -w
        -X go.5x5.cz/ptah/internal/buildinfo.Version={{ .Version }}
        -X go.5x5.cz/ptah/internal/buildinfo.Commit={{ .Commit }}
        -X go.5x5.cz/ptah/internal/buildinfo.Date={{ .CommitDate }}
  - id: ptah-ls
    main: ./cmd/ptah-ls
    binary: ptah-ls
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    mod_timestamp: "{{ .CommitTimestamp }}"
    flags:
      - -trimpath
    ldflags:
      - >-
        -s -w
        -X go.5x5.cz/ptah/internal/buildinfo.Version={{ .Version }}
        -X go.5x5.cz/ptah/internal/buildinfo.Commit={{ .Commit }}
        -X go.5x5.cz/ptah/internal/buildinfo.Date={{ .CommitDate }}
  - id: ptah-compat
    main: ./cmd/ptah-compat
    binary: ptah-compat
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    mod_timestamp: "{{ .CommitTimestamp }}"
    flags:
      - -trimpath
    ldflags:
      - >-
        -s -w
        -X go.5x5.cz/ptah/internal/buildinfo.Version={{ .Version }}
        -X go.5x5.cz/ptah/internal/buildinfo.Commit={{ .Commit }}
        -X go.5x5.cz/ptah/internal/buildinfo.Date={{ .CommitDate }}

# A snapshot is not a release, and naming one after whatever tag happens to be
# reachable ties every branch's build to a marker somebody pushed for reasons of
# their own. goreleaser's default derives the snapshot version from `git
# describe`, so a repository tag containing a slash -- `prototype/canonical-core`
# is the one that did it -- puts a path separator in every artifact name, and
# the source archive then fails to open a directory nothing created.
#
# A short commit is what a snapshot actually identifies.
# scripts/check-goreleaser-artifact-names.sh keeps this from drifting back.
snapshot:
  version_template: "0.0.0-SNAPSHOT-{{ .ShortCommit }}"

archives:
  - id: ptah
    ids:
      - ptah
      - ptah-ls
      - ptah-compat
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - README.md
      - LICENSE

checksum:
  name_template: checksums.txt

source:
  enabled: true

sboms:
  - id: archive
    artifacts: archive
  - id: source
    artifacts: source

# cosign v3 writes a single Sigstore bundle per artifact (the v2-era
# --output-signature/--output-certificate pair is no longer the default
# contract). Verify with:
#   cosign verify-blob --bundle <artifact>.sigstore.json <artifact> \
#     --certificate-identity-regexp 'github.com/stokaro/ptah' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com
signs:
  - id: checksums
    cmd: cosign
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - "--yes"
      - "--bundle=${signature}"
      - "${artifact}"
    artifacts: checksum
    output: true
  - id: sboms
    cmd: cosign
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - "--yes"
      - "--bundle=${signature}"
      - "${artifact}"
    artifacts: sbom
    output: true

release:
  # A re-run of a tag must reach the Docker steps.
  #
  # GoReleaser uploads the release assets before it builds and pushes images.
  # On a re-run every asset is already on the release, GitHub answers the
  # upload with `422 Validation Failed [Resource:ReleaseAsset
  # Field:name Code:already_exists]`, and GoReleaser aborts -- so `dockers:`
  # and `docker_manifests:` below never run at all. Measured on the four tag
  # runs of 2026-08-27: all four failed on that upload, and the published
  # image is still the one an earlier release pushed (stokaro/ptah#2362).
  #
  # This makes the 422 recoverable: GoReleaser deletes the asset that is in
  # the way and retries the upload. It costs an extra API call per collision
  # and only on a collision, which is exactly the case that is broken today.
  replace_existing_artifacts: true

dockers:
  - id: ptah-linux-amd64
    ids:
      - ptah
    goos: linux
    goarch: amd64
    dockerfile: Dockerfile
    use: buildx
    image_templates:
      - "ghcr.io/stokaro/ptah:{{ .Version }}-amd64"
    build_flag_templates:
      - "--platform=linux/amd64"
  - id: ptah-linux-arm64
    ids:
      - ptah
    goos: linux
    goarch: arm64
    dockerfile: Dockerfile
    use: buildx
    image_templates:
      - "ghcr.io/stokaro/ptah:{{ .Version }}-arm64"
    build_flag_templates:
      - "--platform=linux/arm64"

docker_manifests:
  - name_template: "ghcr.io/stokaro/ptah:{{ .Version }}"
    image_templates:
      - "ghcr.io/stokaro/ptah:{{ .Version }}-amd64"
      - "ghcr.io/stokaro/ptah:{{ .Version }}-arm64"
  - name_template: "ghcr.io/stokaro/ptah:latest"
    image_templates:
      - "ghcr.io/stokaro/ptah:{{ .Version }}-amd64"
      - "ghcr.io/stokaro/ptah:{{ .Version }}-arm64"

# Issue #174 requires `brew install stokaro/ptah/ptah`, which is still a
# Homebrew formula flow. GoReleaser's newer homebrew_casks replacement does not
# satisfy that command contract, so the release workflow pins GoReleaser 2.15.4
# while formula publishing remains required.
brews:
  - name: ptah
    ids:
      - ptah
      - ptah-ls
      - ptah-compat
    repository:
      owner: stokaro
      name: homebrew-ptah
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    # The upload is not optional, and this is stokaro/ptah#2361: a release that
    # drops a distribution channel reports the same result as one that
    # publishes it, so nothing ever complained while no tap existed.
    #
    # A missing token is a configuration error rather than a reason to ship one
    # fewer channel. The release workflow refuses it in a step of its own,
    # before anything is built, so this field never has to decide -- and it
    # refuses there rather than here because GoReleaser reaches the formula
    # only after the release assets and the images are already pushed, and a
    # half-published release is the expensive way to learn the secret is gone.
    #
    # Snapshots are unaffected: `--snapshot` implies `--skip=publish`, so the
    # publish phase -- this upload, and the `.Env.HOMEBREW_TAP_TOKEN` lookup
    # above with it -- does not run at all. Measured on v2.15.4 with the
    # variable explicitly unset: the run writes dist/homebrew/Formula/ptah.rb
    # and succeeds.
    skip_upload: false
    directory: Formula
    # Not conflicts_with. Homebrew loads the named formula to evaluate a
    # conflict, and `brew install <tap>/<formula>` trusts only the formula it
    # was given, so a conflict pointing at ptah-edge made the front door fail
    # the moment this file first reached the tap:
    #
    #   Error: stokaro/ptah/ptah: Refusing to load formula stokaro/ptah/ptah-edge
    #          from untrusted tap stokaro/ptah.
    #
    # Measured on Homebrew 6.0.20 against the published v0.3.0 formula, and it
    # broke both directions at once. A caveat is a string and loads nothing, so
    # it carries the same warning without that cost. It does not prevent the
    # state the conflict prevented; that trade is the wrong way round when the
    # price is every first-time install.
    caveats: |-
      ptah-edge installs the same three binaries from master. Install only one of
      the two: brew uninstall ptah-edge before installing this one.
    homepage: "https://github.com/stokaro/ptah"
    # The product sentence, not a Go-first framing: this is what `brew info
    # ptah` prints, and it is the first thing a reader meets. It is held to the
    # root command's own Short by TestFormulaDescription in cmd/root, so the two
    # cannot drift -- a description is a claim that was true when it was typed.
    description: "Ptah manages database change across schemas and persistent inference state"
    license: MIT
    commit_msg_template: "Brew formula update for {{ .ProjectName }} {{ .Tag }}"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
