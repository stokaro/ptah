version: 2

project_name: ptah

before:
  hooks:
    - go mod tidy

builds:
  - id: ptah
    main: ./cmd/ptah
    binary: ptah
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    mod_timestamp: "{{ .CommitTimestamp }}"
    flags:
      - -trimpath
    ldflags:
      - >-
        -s -w
        -X ptah.run/internal/buildinfo.Version={{ .Version }}
        -X ptah.run/internal/buildinfo.Commit={{ .Commit }}
        -X ptah.run/internal/buildinfo.Date={{ .CommitDate }}
  - id: ptah-ls
    main: ./cmd/ptah-ls
    binary: ptah-ls
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    mod_timestamp: "{{ .CommitTimestamp }}"
    flags:
      - -trimpath
    ldflags:
      - >-
        -s -w
        -X ptah.run/internal/buildinfo.Version={{ .Version }}
        -X ptah.run/internal/buildinfo.Commit={{ .Commit }}
        -X ptah.run/internal/buildinfo.Date={{ .CommitDate }}
  - id: ptah-compat
    main: ./cmd/ptah-compat
    binary: ptah-compat
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    mod_timestamp: "{{ .CommitTimestamp }}"
    flags:
      - -trimpath
    ldflags:
      - >-
        -s -w
        -X ptah.run/internal/buildinfo.Version={{ .Version }}
        -X ptah.run/internal/buildinfo.Commit={{ .Commit }}
        -X ptah.run/internal/buildinfo.Date={{ .CommitDate }}

# A snapshot is not a release, and naming one after whatever tag happens to be
# reachable ties every branch's build to a marker somebody pushed for reasons of
# their own. goreleaser's default derives the snapshot version from `git
# describe`, so a repository tag containing a slash -- `prototype/canonical-core`
# is the one that did it -- puts a path separator in every artifact name, and
# the source archive then fails to open a directory nothing created.
#
# A short commit is what a snapshot actually identifies.
# scripts/check-goreleaser-artifact-names.sh keeps this from drifting back.
snapshot:
  version_template: "0.0.0-SNAPSHOT-{{ .ShortCommit }}"

archives:
  - id: ptah
    ids:
      - ptah
      - ptah-ls
      - ptah-compat
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - README.md
      - LICENSE

checksum:
  name_template: checksums.txt

source:
  enabled: true

sboms:
  - id: archive
    artifacts: archive
  - id: source
    artifacts: source

# cosign v3 writes a single Sigstore bundle per artifact (the v2-era
# --output-signature/--output-certificate pair is no longer the default
# contract). Verify with:
#   cosign verify-blob --bundle <artifact>.sigstore.json <artifact> \
#     --certificate-identity-regexp 'github.com/stokaro/ptah' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com
signs:
  - id: checksums
    cmd: cosign
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - "--yes"
      - "--bundle=${signature}"
      - "${artifact}"
    artifacts: checksum
    output: true
  - id: sboms
    cmd: cosign
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - "--yes"
      - "--bundle=${signature}"
      - "${artifact}"
    artifacts: sbom
    output: true

release:
  # A re-run of a tag must finish.
  #
  # On a re-run every asset is already on the release, GitHub answers the
  # upload with `422 Validation Failed [Resource:ReleaseAsset
  # Field:name Code:already_exists]`, and GoReleaser aborts. Measured on the
  # four tag runs of 2026-08-27: each one pushed its images and manifest
  # lists, then died on the first archive upload, leaving a release with no
  # assets. Everything GoReleaser does after the upload -- the Homebrew
  # channel included -- is out of reach for the same reason
  # (stokaro/ptah#2362).
  #
  # This makes the 422 recoverable: GoReleaser deletes the asset that is in
  # the way and retries the upload. It costs an extra API call per collision
  # and only on a collision, which is exactly the case that is broken today.
  replace_existing_artifacts: true

# Two registries carry the same images, and GHCR is the documented default.
#
# Docker Hub is a MIRROR rather than a move: `images` names both hosts, so one
# buildx build carries a tag for each and one push reaches both. The digests
# match because the content does, which is what makes the pair verifiable after
# the fact rather than merely intended -- `.github/workflows/release.yml`
# resolves both manifests anonymously and fails when they differ.
#
# GHCR stays first in the documentation because Docker Hub rate-limits
# anonymous pulls and GHCR does not (stokaro/ptah#2362).
#
# Both or neither: a tag that lands in one registry and not the other is worse
# than a single registry, because a reader cannot tell which one is behind. The
# credential for each host is proven by a login step BEFORE anything is pushed,
# so the ordinary failure -- a bad or expired token -- stops the run before the
# first registry has the tag.
#
# A reader is given two tags per host, the version and `latest`, and each one
# resolves to a manifest list covering both architectures. buildx cannot write
# a manifest list without pushing it, so the list is the product of the push
# rather than something assembled afterwards from per-architecture tags, and a
# release publishes no `-amd64` or `-arm64` tag of its own.
dockers_v2:
  - id: ptah
    ids:
      - ptah
    dockerfile: Dockerfile
    images:
      - "ghcr.io/stokaro/ptah"
      - "docker.io/stokaro/ptah"
    tags:
      - "{{ .Version }}"
      # `latest` names a release, and a snapshot is not one. A snapshot build
      # cannot write a manifest list either, so it builds one image per
      # platform and suffixes each tag with it; an unconditional entry here
      # would leave a `latest-amd64` on the machine that ran the snapshot,
      # naming a release that does not exist. An empty tag is dropped.
      - "{{ if not .IsSnapshot }}latest{{ end }}"
    platforms:
      - linux/amd64
      - linux/arm64

# Homebrew publishes Ptah's binaries as a cask. GoReleaser hard-deprecates
# `brews` in 2.16, and `check` refuses a configuration that carries one.
#
# The install command stokaro/ptah#174 requires, `brew install
# stokaro/ptah/ptah`, keeps working across the change only while the tap holds
# no formula of that token. Homebrew tries the formula loader first, so a
# generated `Formula/ptah.rb` left beside the cask answers the command with
# whatever release wrote it: measured on the v0.6.0 release, where the tap
# carried both and `brew info stokaro/ptah/ptah` reported stable 0.5.0 until the
# formula was removed, after which the same token installed the 0.6.0 cask and
# linked all three binaries.
#
# `tap_migrations.json` cannot do this. Both loaders read it, and both stop when
# the migrated name equals the name they were given, so a tap cannot redirect a
# token to itself. Removing the file the earlier release generated is what moves
# the token, and it is a one-time edit in the tap rather than anything this
# configuration can write.
#
# It works on Linux as well. GoReleaser renders `on_linux` URLs beside the
# macOS ones, and Homebrew installs a cask that requires no macOS wherever it
# runs: measured on Homebrew 4.6.20 in the `homebrew/brew` image, which
# downloaded the v0.5.0 Linux archive and linked all three binaries.
homebrew_casks:
  - name: ptah
    ids:
      - ptah
      - ptah-ls
      - ptah-compat
    binaries:
      - ptah
      - ptah-compat
      - ptah-ls
    repository:
      owner: stokaro
      name: homebrew-ptah
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    # The upload is not optional, and this is stokaro/ptah#2361: a release that
    # drops a distribution channel reports the same result as one that
    # publishes it, so nothing ever complained while no tap existed.
    #
    # A missing token is a configuration error rather than a reason to ship one
    # fewer channel. The release workflow refuses it in a step of its own,
    # before anything is built, so this field never has to decide -- and it
    # refuses there rather than here because GoReleaser reaches the cask only
    # after the release assets and the images are already pushed, and a
    # half-published release is the expensive way to learn the secret is gone.
    #
    # Snapshots are unaffected: `--snapshot` implies `--skip=publish`, so the
    # publish phase -- this upload, and the `.Env.HOMEBREW_TAP_TOKEN` lookup
    # above with it -- does not run at all.
    skip_upload: false
    directory: Casks
    # Not a conflict stanza. Homebrew loads the named cask to evaluate a
    # conflict, and `brew install <tap>/<token>` trusts only the token it was
    # given, so a conflict pointing at ptah-edge made the front door fail the
    # moment this file first reached the tap:
    #
    #   Error: stokaro/ptah/ptah: Refusing to load formula stokaro/ptah/ptah-edge
    #          from untrusted tap stokaro/ptah.
    #
    # Measured on Homebrew 6.0.20 against the published v0.3.0 formula, and it
    # broke both directions at once. A caveat is a string and loads nothing, so
    # it carries the same warning without that cost.
    caveats: |-
      ptah-edge installs the same three binaries from master. Install only one of
      the two: brew uninstall ptah-edge before installing this one.
    homepage: "https://ptah.run"
    # The product sentence, not a Go-first framing: this is what `brew info
    # ptah` prints, and it is the first thing a reader meets. It is held to the
    # root command's own Short by TestFormulaDescription in internal/cli/root, so the two
    # cannot drift -- a description is a claim that was true when it was typed.
    description: "Ptah manages database change across schemas and persistent inference state"
    commit_msg_template: "Brew cask update for {{ .ProjectName }} {{ .Tag }}"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
