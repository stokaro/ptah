version: 2

project_name: ptah

before:
  hooks:
    - go mod tidy

builds:
  - id: ptah
    main: ./cmd/ptah
    binary: ptah
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    mod_timestamp: "{{ .CommitTimestamp }}"
    flags:
      - -trimpath
    ldflags:
      - >-
        -s -w
        -X go.5x5.cz/ptah/internal/buildinfo.Version={{ .Version }}
        -X go.5x5.cz/ptah/internal/buildinfo.Commit={{ .Commit }}
        -X go.5x5.cz/ptah/internal/buildinfo.Date={{ .CommitDate }}
  - id: ptah-ls
    main: ./cmd/ptah-ls
    binary: ptah-ls
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    mod_timestamp: "{{ .CommitTimestamp }}"
    flags:
      - -trimpath
    ldflags:
      - >-
        -s -w
        -X go.5x5.cz/ptah/internal/buildinfo.Version={{ .Version }}
        -X go.5x5.cz/ptah/internal/buildinfo.Commit={{ .Commit }}
        -X go.5x5.cz/ptah/internal/buildinfo.Date={{ .CommitDate }}
  - id: ptah-compat
    main: ./cmd/ptah-compat
    binary: ptah-compat
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    mod_timestamp: "{{ .CommitTimestamp }}"
    flags:
      - -trimpath
    ldflags:
      - >-
        -s -w
        -X go.5x5.cz/ptah/internal/buildinfo.Version={{ .Version }}
        -X go.5x5.cz/ptah/internal/buildinfo.Commit={{ .Commit }}
        -X go.5x5.cz/ptah/internal/buildinfo.Date={{ .CommitDate }}

# A snapshot is not a release, and naming one after whatever tag happens to be
# reachable ties every branch's build to a marker somebody pushed for reasons of
# their own. goreleaser's default derives the snapshot version from `git
# describe`, so a repository tag containing a slash -- `prototype/canonical-core`
# is the one that did it -- puts a path separator in every artifact name, and
# the source archive then fails to open a directory nothing created.
#
# A short commit is what a snapshot actually identifies.
# scripts/check-goreleaser-artifact-names.sh keeps this from drifting back.
snapshot:
  version_template: "0.0.0-SNAPSHOT-{{ .ShortCommit }}"

archives:
  - id: ptah
    ids:
      - ptah
      - ptah-ls
      - ptah-compat
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - README.md
      - LICENSE

checksum:
  name_template: checksums.txt

source:
  enabled: true

sboms:
  - id: archive
    artifacts: archive
  - id: source
    artifacts: source

# cosign v3 writes a single Sigstore bundle per artifact (the v2-era
# --output-signature/--output-certificate pair is no longer the default
# contract). Verify with:
#   cosign verify-blob --bundle <artifact>.sigstore.json <artifact> \
#     --certificate-identity-regexp 'github.com/stokaro/ptah' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com
signs:
  - id: checksums
    cmd: cosign
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - "--yes"
      - "--bundle=${signature}"
      - "${artifact}"
    artifacts: checksum
    output: true
  - id: sboms
    cmd: cosign
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - "--yes"
      - "--bundle=${signature}"
      - "${artifact}"
    artifacts: sbom
    output: true

release:
  # A re-run of a tag must reach the Docker steps.
  #
  # GoReleaser uploads the release assets before it builds and pushes images.
  # On a re-run every asset is already on the release, GitHub answers the
  # upload with `422 Validation Failed [Resource:ReleaseAsset
  # Field:name Code:already_exists]`, and GoReleaser aborts -- so `dockers:`
  # and `docker_manifests:` below never run at all. Measured on the four tag
  # runs of 2026-08-27: all four failed on that upload, and the published
  # image is still the one an earlier release pushed (stokaro/ptah#2362).
  #
  # This makes the 422 recoverable: GoReleaser deletes the asset that is in
  # the way and retries the upload. It costs an extra API call per collision
  # and only on a collision, which is exactly the case that is broken today.
  replace_existing_artifacts: true

dockers:
  - id: ptah-linux-amd64
    ids:
      - ptah
    goos: linux
    goarch: amd64
    dockerfile: Dockerfile
    use: buildx
    image_templates:
      - "ghcr.io/stokaro/ptah:{{ .Version }}-amd64"
    build_flag_templates:
      - "--platform=linux/amd64"
  - id: ptah-linux-arm64
    ids:
      - ptah
    goos: linux
    goarch: arm64
    dockerfile: Dockerfile
    use: buildx
    image_templates:
      - "ghcr.io/stokaro/ptah:{{ .Version }}-arm64"
    build_flag_templates:
      - "--platform=linux/arm64"

docker_manifests:
  - name_template: "ghcr.io/stokaro/ptah:{{ .Version }}"
    image_templates:
      - "ghcr.io/stokaro/ptah:{{ .Version }}-amd64"
      - "ghcr.io/stokaro/ptah:{{ .Version }}-arm64"
  - name_template: "ghcr.io/stokaro/ptah:latest"
    image_templates:
      - "ghcr.io/stokaro/ptah:{{ .Version }}-amd64"
      - "ghcr.io/stokaro/ptah:{{ .Version }}-arm64"

# Issue #174 requires `brew install stokaro/ptah/ptah`, which is still a
# Homebrew formula flow. GoReleaser's newer homebrew_casks replacement does not
# satisfy that command contract, so the release workflow pins GoReleaser 2.15.4
# while formula publishing remains required.
brews:
  - name: ptah
    ids:
      - ptah
      - ptah-ls
      - ptah-compat
    repository:
      owner: stokaro
      name: homebrew-ptah
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    # The formula is always generated, but publishing it needs the tap
    # repository and a token that can push to it. Without HOMEBREW_TAP_TOKEN
    # the upload is skipped instead of failing the whole release.
    # index, not .Env.X: the snapshot job does not define the variable at all,
    # and .Env.X errors on a missing key while index yields an empty string.
    skip_upload: '{{ if index .Env "HOMEBREW_TAP_TOKEN" }}false{{ else }}true{{ end }}'
    directory: Formula
    homepage: "https://github.com/stokaro/ptah"
    # The product sentence, not a Go-first framing: this is what `brew info
    # ptah` prints, and it is the first thing a reader meets. It is held to the
    # root command's own Short by TestFormulaDescription in cmd/root, so the two
    # cannot drift -- a description is a claim that was true when it was typed.
    description: "Ptah manages database change across schemas and persistent inference state"
    license: MIT
    commit_msg_template: "Brew formula update for {{ .ProjectName }} {{ .Tag }}"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
