 .edgeLabel{background-color:rgba(232,232,232, 0.8);}#ptahSchemaDiagram .edgeLabel .label rect{fill:rgba(232,232,232, 0.8);}#ptahSchemaDiagram .edgeLabel .label text{fill:#333;}#ptahSchemaDiagram .edgeLabel .label{fill:#9370DB;font-size:14px;}#ptahSchemaDiagram .label{font-family:"trebuchet ms",verdana,arial,sans-serif;color:#333;}#ptahSchemaDiagram .edge-pattern-dashed{stroke-dasharray:8,8;}#ptahSchemaDiagram .node rect,#ptahSchemaDiagram .node circle,#ptahSchemaDiagram .node ellipse,#ptahSchemaDiagram .node polygon{fill:#ECECFF;stroke:#9370DB;stroke-width:1px;}#ptahSchemaDiagram .relationshipLine{stroke:#333333;stroke-width:1px;fill:none;}#ptahSchemaDiagram .marker{fill:none!important;stroke:#333333!important;stroke-width:1;}#ptahSchemaDiagram [data-look=neo].labelBkg{background-color:rgba(248.6666666666, 255, 235.9999999999, 0.5);}#ptahSchemaDiagram .cluster rect{fill:#ffffde;stroke:#aaaa33;stroke-width:1px;}#ptahSchemaDiagram .cluster text{fill:#333;}#ptahSchemaDiagram .cluster-label text{fill:#333;}#ptahSchemaDiagram .node .neo-node{stroke:#9370DB;}#ptahSchemaDiagram [data-look="neo"].node rect,#ptahSchemaDiagram [data-look="neo"].cluster rect,#ptahSchemaDiagram [data-look="neo"].node polygon{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#ptahSchemaDiagram [data-look="neo"].swimlane.cluster rect{filter:none;}#ptahSchemaDiagram [data-look="neo"].node path{stroke:#9370DB;stroke-width:1px;}#ptahSchemaDiagram [data-look="neo"].node .outer-path{filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#ptahSchemaDiagram [data-look="neo"].node .neo-line path{stroke:#9370DB;filter:none;}#ptahSchemaDiagram [data-look="neo"].node circle{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#ptahSchemaDiagram [data-look="neo"].node circle .state-start{fill:#000000;}#ptahSchemaDiagram [data-look="neo"].icon-shape .icon{fill:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#ptahSchemaDiagram [data-look="neo"].icon-shap