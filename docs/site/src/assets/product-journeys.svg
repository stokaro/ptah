<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title description">
  <title id="title">Ptah product journeys</title>
  <desc id="description">Schema sources and a live database produce a reviewable plan that either becomes versioned migration files or is applied directly. Inference specifications and source rows produce a candidate generation that is verified before cutover, while the active generation remains available for rollback.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0284c7"/>
    </marker>
    <style>
      .lane { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 2; }
      .node { fill: #ffffff; stroke: #64748b; stroke-width: 2; }
      .decision { fill: #e0f2fe; stroke: #0284c7; stroke-width: 2; }
      .active { fill: #dcfce7; stroke: #15803d; stroke-width: 2; }
      .candidate { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
      .heading { fill: #0f172a; font: 700 25px system-ui, sans-serif; }
      .label { fill: #0f172a; font: 650 21px system-ui, sans-serif; }
      .detail { fill: #475569; font: 17px system-ui, sans-serif; }
      .flow { fill: none; stroke: #0284c7; stroke-width: 3; marker-end: url(#arrow); }
      .rollback { fill: none; stroke: #64748b; stroke-width: 2.5; stroke-dasharray: 8 7; marker-end: url(#arrow); }
      @media (prefers-color-scheme: dark) {
        .lane { fill: #111827; stroke: #475569; }
        .node { fill: #1f2937; stroke: #64748b; }
        .decision { fill: #0c4a6e; stroke: #38bdf8; }
        .active { fill: #14532d; stroke: #4ade80; }
        .candidate { fill: #78350f; stroke: #fbbf24; }
        .heading, .label { fill: #f8fafc; }
        .detail { fill: #cbd5e1; }
        .flow { stroke: #38bdf8; }
        .rollback { stroke: #94a3b8; }
        #arrow path { fill: #38bdf8; }
      }
    </style>
  </defs>

  <g id="schema-journey" aria-label="Schema change journeys">
    <rect class="lane" x="20" y="20" width="1160" height="290" rx="22"/>
    <text class="heading" x="50" y="62">Schema changes</text>

    <rect class="node" x="50" y="94" width="205" height="82" rx="14"/>
    <text class="label" x="152" y="127" text-anchor="middle">Schema sources</text>
    <text class="detail" x="152" y="153" text-anchor="middle">desired state</text>

    <rect class="node" x="50" y="204" width="205" height="70" rx="14"/>
    <text class="label" x="152" y="247" text-anchor="middle">Live database</text>

    <rect class="decision" x="335" y="137" width="210" height="96" rx="16"/>
    <text class="label" x="440" y="177" text-anchor="middle">Compare and plan</text>
    <text class="detail" x="440" y="205" text-anchor="middle">review before execution</text>

    <rect class="node" x="625" y="75" width="245" height="88" rx="14"/>
    <text class="label" x="747" y="110" text-anchor="middle">Versioned migrations</text>
    <text class="detail" x="747" y="137" text-anchor="middle">reviewed SQL files</text>

    <rect class="node" x="625" y="207" width="245" height="70" rx="14"/>
    <text class="label" x="747" y="250" text-anchor="middle">Direct apply</text>

    <rect class="active" x="950" y="137" width="190" height="96" rx="16"/>
    <text class="label" x="1045" y="177" text-anchor="middle">Target database</text>
    <text class="detail" x="1045" y="205" text-anchor="middle">verified state</text>

    <path class="flow" d="M255 135 H320"/>
    <path class="flow" d="M255 239 H300 Q320 239 320 219 V205 H335"/>
    <path class="flow" d="M545 170 Q585 170 585 119 H625"/>
    <path class="flow" d="M545 200 Q585 200 585 242 H625"/>
    <path class="flow" d="M870 119 Q915 119 915 165 H950"/>
    <path class="flow" d="M870 242 Q915 242 915 205 H950"/>
  </g>

  <g id="inference-journey" aria-label="Inference migration journey">
    <rect class="lane" x="20" y="335" width="1160" height="205" rx="22"/>
    <text class="heading" x="50" y="377">Persistent inference state</text>

    <rect class="node" x="50" y="407" width="205" height="92" rx="14"/>
    <text class="label" x="152" y="443" text-anchor="middle">Specification</text>
    <text class="detail" x="152" y="470" text-anchor="middle">model and source rows</text>

    <rect class="candidate" x="335" y="407" width="220" height="92" rx="14"/>
    <text class="label" x="445" y="443" text-anchor="middle">Candidate generation</text>
    <text class="detail" x="445" y="470" text-anchor="middle">backfill and catch-up</text>

    <rect class="decision" x="635" y="407" width="205" height="92" rx="14"/>
    <text class="label" x="737" y="443" text-anchor="middle">Verify and cut over</text>
    <text class="detail" x="737" y="470" text-anchor="middle">explicit decision</text>

    <rect class="active" x="950" y="407" width="190" height="92" rx="14"/>
    <text class="label" x="1045" y="443" text-anchor="middle">Active generation</text>
    <text class="detail" x="1045" y="470" text-anchor="middle">previous retained</text>

    <path class="flow" d="M255 453 H335"/>
    <path class="flow" d="M555 453 H635"/>
    <path class="flow" d="M840 453 H950"/>
    <path class="rollback" d="M1045 499 V520 H737 V502"/>
    <text class="detail" x="892" y="532" text-anchor="middle">rollback</text>
  </g>
</svg>
