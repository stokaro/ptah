openapi: 3.0.3
info:
  title: Library schema
  version: 1.0.0
servers:
  - url: /
paths: {}
components:
  schemas:
    authors:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: integer
          format: int32
        name:
          type: string
          maxLength: 120
    books:
      type: object
      required:
        - id
        - author_id
        - title
      properties:
        id:
          type: integer
          format: int32
        author_id:
          type: integer
          format: int32
        title:
          type: string
          maxLength: 240
        summary:
          type: string
          nullable: true
    tags:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: integer
          format: int32
        name:
          type: string
          maxLength: 80
    book_tags:
      type: object
      required:
        - id
        - book_id
        - tag_id
      properties:
        id:
          type: integer
          format: int32
        book_id:
          type: integer
          format: int32
        tag_id:
          type: integer
          format: int32
