openapi: 3.0.3
info:
  title: Shop schema
  version: 1.0.0
servers:
  - url: /
paths: {}
components:
  schemas:
    products:
      type: object
      required:
        - id
        - sku
        - name
        - price_cents
      properties:
        id:
          type: integer
          format: int32
        sku:
          type: string
        name:
          type: string
        price_cents:
          type: integer
          format: int32
