services:
  postgres:
    build:
      context: .
      dockerfile: Dockerfile.postgres
    environment:
      POSTGRES_DB: ptah
      POSTGRES_PASSWORD: ptah
      POSTGRES_USER: ptah
    ports:
      - "${PTAH_INFERENCE_POSTGRES_PORT:-}:5432"
    healthcheck:
      # -h forces TCP. Without it pg_isready asks over the Unix socket, and
      # the official image answers there while its temporary init server is
      # still running: measured on postgres:16, the socket reports "accepting
      # connections" for the first seconds while TCP reports "no response".
      # A client released by that healthcheck meets the temporary server
      # shutting down and reads "connection reset by peer".
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U ptah -d ptah"]
      interval: 1s
      timeout: 3s
      retries: 30

  embeddings:
    build:
      context: .
      dockerfile: Dockerfile.embeddings
    command: ["python", "/fixture/embed.py"]
    ports:
      - "${PTAH_INFERENCE_EMBED_PORT:-}:8080"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz')"
      interval: 1s
      timeout: 3s
      retries: 30
