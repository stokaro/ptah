syntax = "proto3";

package ptah.provider.experimental;

option go_package = "github.com/stokaro/ptah/provider-sdk/protocol/experimental;protocol";

// Provider is the experimental, local subprocess boundary. Each request is a
// whole semantic batch. The contract has a major and a minor version. A
// major changes only with an incompatible change and is matched exactly; a
// minor adds compatible RPCs, messages, fields, enum values and features.
// Anything a minor adds is used only when both sides advertise its feature.
// The contract does not serialize host ASTs or Go interface values.
service Provider {
  rpc Describe(DescribeRequest) returns (Description);
  rpc Open(OpenRequest) returns (Session);
  rpc ResolveDatabaseContext(DatabaseContextRequest) returns (DatabaseContext);
  rpc Close(CloseRequest) returns (Empty);
  rpc Inspect(InspectRequest) returns (Schema);
  rpc Render(RenderRequest) returns (RenderResult);
  rpc AnalyzeSQL(AnalyzeSQLRequest) returns (SQLAnalysis);
  rpc DecodeSource(DecodeSourceRequest) returns (DecodedSource);
  rpc ReadSQLSchema(ReadSQLSchemaRequest) returns (SQLSchema);
  rpc NormalizeValues(NormalizeValuesRequest) returns (NormalizedValues);
  rpc ConvertValues(ConvertValuesRequest) returns (NormalizedValues);
  rpc CompareModels(CompareModelsRequest) returns (ComparedModels);
  rpc PlanFeatures(PlanFeaturesRequest) returns (PlannedFeatures);
  rpc PlanDeclarations(PlanDeclarationsRequest) returns (PlannedDeclarations);
  rpc CompareColumns(CompareColumnsRequest) returns (ComparedColumns);
  rpc ReadColumnDefaults(ReadColumnDefaultsRequest) returns (ReadColumnDefaultsResult);
  rpc DescribeExecutionInputs(DescribeExecutionInputsRequest) returns (ExecutionInputs);
  rpc PrepareTables(PrepareTablesRequest) returns (PreparedTables);
  rpc ProjectTableCreations(ProjectTableCreationsRequest) returns (ProjectedTableCreations);
  rpc ValidateSchema(ValidateSchemaRequest) returns (SchemaValidation);
  rpc SplitLintStatements(SplitLintRequest) returns (SplitLint);
  rpc AnnotateLintStatements(AnnotateLintRequest) returns (AnnotatedLint);
  rpc CheckLintMigrations(CheckLintRequest) returns (CheckedLint);
  rpc ProvisionDevDatabase(ProvisionDevRequest) returns (DevDatabase);
  rpc ReleaseDevDatabase(ReleaseDevRequest) returns (Empty);
  // Contract 25.1. A host calls each of these only when the provider
  // advertises its feature.
  rpc ListDevObjects(ListDevObjectsRequest) returns (DevObjects);
  rpc CleanDevDatabase(CleanDevRequest) returns (DevCleanup);
  rpc GuardReplay(GuardReplayRequest) returns (GuardedReplay);
  rpc TypeRows(TypeRowsRequest) returns (TypedRows);
  rpc ReadRows(ReadRowsRequest) returns (RowPage);
  rpc RenderRowWrites(RenderRowWritesRequest) returns (RenderResult);
  rpc ListSeedTables(ListSeedTablesRequest) returns (SeedTables);
  rpc ApplySeed(ApplySeedRequest) returns (SeedResult);
  rpc RecordSeed(RecordSeedRequest) returns (SeedResult);
  rpc ReadSeedLedger(ReadSeedLedgerRequest) returns (SeedLedger);
  rpc Execute(ExecuteRequest) returns (Execution);
  rpc BeginTransaction(BeginTransactionRequest) returns (Transaction);
  rpc FinishTransaction(FinishTransactionRequest) returns (TransactionResult);
  rpc ReadHistory(ReadHistoryRequest) returns (HistorySnapshot);
  rpc PrepareHistory(PrepareHistoryRequest) returns (HistoryResult);
  rpc MutateHistory(MutateHistoryRequest) returns (HistoryResult);
  rpc PrepareMetadata(PrepareMetadataRequest) returns (MetadataResult);
  rpc MutateMetadata(MutateMetadataRequest) returns (MetadataResult);
  rpc LookupMetadataTag(LookupMetadataTagRequest) returns (MetadataTagResult);
  rpc OpenMetadataRead(MetadataReadRequest) returns (MetadataReadResult);
  rpc ReadMetadataPage(ReadMetadataPageRequest) returns (MetadataPage);
  rpc CloseMetadataRead(MetadataReadRequest) returns (MetadataReadResult);
  rpc TryLock(LockRequest) returns (LockResult);
  rpc CheckLock(LockRequest) returns (LockResult);
  rpc ReleaseLock(LockRequest) returns (LockResult);
  // Contract 25.2: the embedding store. Each call is used only when both
  // sides list the feature embeddings.store.
  rpc PrepareEmbeddingStore(PrepareEmbeddingStoreRequest) returns (EmbeddingWriteResult);
  rpc ReadEmbeddingState(ReadEmbeddingStateRequest) returns (EmbeddingState);
  rpc MutateEmbeddingState(MutateEmbeddingStateRequest) returns (EmbeddingWriteResult);
  rpc AppendEmbeddingEvent(AppendEmbeddingEventRequest) returns (EmbeddingWriteResult);
  rpc ReadEmbeddingEvents(ReadEmbeddingEventsRequest) returns (EmbeddingEventPage);
  rpc DescribeEmbeddingTarget(DescribeEmbeddingTargetRequest) returns (EmbeddingTargetObjects);
  rpc ResolveEmbeddingRelations(ResolveEmbeddingRelationsRequest) returns (EmbeddingRelations);
  rpc MeasureEmbedding(MeasureEmbeddingRequest) returns (EmbeddingMeasurement);
  rpc PrepareEmbeddingTarget(PrepareEmbeddingTargetRequest) returns (EmbeddingWriteResult);
  rpc BuildEmbeddingIndex(BuildEmbeddingIndexRequest) returns (EmbeddingWriteResult);
  rpc ReadEmbeddingStructure(ReadEmbeddingStructureRequest) returns (EmbeddingStructure);
  rpc DropEmbeddingGeneration(DropEmbeddingGenerationRequest) returns (EmbeddingWriteResult);
  rpc ScanEmbeddingSource(ScanEmbeddingSourceRequest) returns (EmbeddingSourcePage);
  rpc ReadEmbeddingSourceRows(ReadEmbeddingSourceRowsRequest) returns (EmbeddingSourceRows);
  rpc ReadEmbeddingBatchState(ReadEmbeddingBatchStateRequest) returns (EmbeddingBatchState);
  rpc CommitEmbeddingBatch(CommitEmbeddingBatchRequest) returns (EmbeddingWriteResult);
  rpc ReadEmbeddingVerification(ReadEmbeddingVerificationRequest) returns (EmbeddingVerificationPage);
  rpc SearchEmbeddings(SearchEmbeddingsRequest) returns (EmbeddingSearchResult);
  // Contract 25.3. PrepareCommonObjects is used only when both sides list
  // schema.common-objects; a host calls EncodeSource only when the provider
  // lists source.encode.
  rpc PrepareCommonObjects(PrepareCommonObjectsRequest) returns (PreparedCommonObjects);
  rpc EncodeSource(EncodeSourceRequest) returns (EncodedSource);
  // Contract 25.4. A host calls these only when the provider and the engine
  // list sessions.statements.
  rpc RunStatement(RunStatementRequest) returns (StatementResult);
  rpc ReadStatementRows(ReadStatementRowsRequest) returns (StatementRows);
  rpc CloseStatement(CloseStatementRequest) returns (Empty);
}

message Empty {}
// ContractVersion is a version of this contract. major is the revision both
// sides must share; minor counts the compatible additions within it.
message ContractVersion {
  uint32 major = 1;
  uint32 minor = 2;
}
message DescribeRequest {
  // The host's contract major. It equals host_contract.major when that is set.
  uint32 revision = 1;
  repeated string required_features = 2;
  // The host's contract version. Absent means the host speaks minor 0 of
  // revision.
  ContractVersion host_contract = 3;
  // The features the host understands. A provider uses an addition to an
  // existing message, such as a new enum value, reply field or request field,
  // only when the host lists its feature. Absent means none.
  repeated string host_features = 4;
}
message Description {
  // The provider's contract major.
  uint32 revision = 1;
  string provider_id = 2;
  string version = 3;
  string semantic_identity = 4;
  repeated Engine engines = 5;
  repeated string features = 6;
  // The oldest host contract the provider works with. Absent means minor 0
  // of revision. Its major is revision, and its minor is at most the minor of
  // the SDK the provider is built with.
  ContractVersion min_contract = 7;
}
// Engine contains transport-neutral registration data. An alias grants no
// implementation fallback and a feature is an explicit semantic promise.
message Engine {
  string id = 1;
  repeated string aliases = 2;
  string default_schema = 3;
  repeated string features = 4;
  IdentifierRules identifiers = 5;
  repeated ValueModel value_models = 6;
  repeated YAMLSourceKey yaml_source_keys = 7;
  repeated ModelComparison comparisons = 8;
  repeated ModelPlanning planning = 9;
  repeated LintRule lint_rules = 10;
  repeated ReleaseLine release_lines = 11;
  repeated GoSourceDirective go_source_directives = 12;
  // Absent means FRAGMENTS: the host reads SQL documents with the shared
  // grammar and sends the statements it does not model to DecodeSource.
  SQLSchemaDeclaration sql_schema = 13;
  // Absent means the engine declares no spelling for the host's query builder.
  // Sent only to a host that lists the feature query.dialect. Contract 25.1.
  QueryDialect query_dialect = 14;
  // Absent means the engine keeps no embedding store. Present exactly when the
  // engine lists embeddings.store, and sent only to a host that lists it.
  // Contract 25.2.
  EmbeddingEngine embeddings = 15;
  // Absent means the engine carries no common object beyond tables. Present
  // exactly when the engine lists schema.common-objects, and sent only to a
  // host that lists it. Contract 25.3.
  CommonObjectSupport common_objects = 16;
  // Absent means the engine claims no HCL syntax. Present exactly when the
  // engine lists source.hcl, and sent only to a host that lists it. Contract
  // 25.3.
  HCLSourceDeclaration hcl_source = 17;
  // How a command's scope names the engine's objects, and which grants name
  // them. Empty means a scope names none of them. Non-empty only when the
  // engine lists scope.selections, and sent only to a host that lists it.
  // Contract 25.4.
  repeated ScopeSelection scope_selections = 18;
  // Offline authored creation services, under schema.declarations (25.5).
  repeated ModelDeclarations declarations = 19;
  // Claimed ptah:not-described kinds in Go source, under source.limits.
  repeated string go_header_kinds = 20;
}
// ScopeSelection is how the --include, --exclude and --schema selectors name
// the engine's objects of one model kind. The host reads a selector's name
// with the naming the selection declares; the owner never parses a selector.
message ScopeSelection {
  // A model kind of the engine with a DESIRED and an OBSERVED value model.
  string kind = 1;
  // The selector type that names an object of the kind, such as "topic" in
  // `*[type=topic]`: lower-case letters, digits and underscores, starting
  // with a letter.
  string selector_type = 2;
  enum Naming {
    NAMING_UNSPECIFIED = 0;
    // Named by its schema and its name, as a table is. Its identity carries a
    // schema and a name, and no database, catalog or path.
    IN_SCHEMA = 1;
    // Named by its name alone, which is unique in the database; a dot is part
    // of the name. Its identity carries a name only.
    DATABASE_WIDE = 2;
    // In a schema, named as IN_SCHEMA names it, or on the database itself
    // with no schema, named by its name alone.
    SCHEMA_OR_DATABASE = 3;
  }
  Naming naming = 3;
  // The object's name is a relation's name: excluding the object excludes a
  // table of its name too. IN_SCHEMA only.
  bool relation = 4;
  // The object type a grant spells for an object of the kind, such as TOPIC:
  // upper-case words separated by single spaces. Empty when no grant names
  // one. Its YAML and annotation attribute is "on_" and the type in lower case
  // with underscores for spaces, such as on_topic.
  string grant_object_type = 5;
  // Kinds of the engine's other selections whose objects a kept object of
  // this kind keeps when its normalized value requires them, unless an
  // exclusion names them.
  repeated string keeps_required = 6;
}
// CommonObjectSupport lists the common objects beyond tables an engine
// carries on the common wire: inspected, validated, prepared for comparison
// and rendered by the provider, and compared and ordered by the host.
message CommonObjectSupport {
  enum Kind {
    KIND_UNSPECIFIED = 0;
    VIEW = 1;
    MATERIALIZED_VIEW = 2;
    SEQUENCE = 3;
    ROLE = 4;
    GRANT = 5;
    COMMENT = 6;
    // Contract 25.5, under schema.common-access. Each has its own coverage.
    OBJECT_OWNER = 7;
    ROLE_MEMBERSHIP = 8;
  }
  repeated Kind kinds = 1;
}
// HCLSourceDeclaration is an engine's claim on HCL syntax: the blocks and the
// attributes of the frontend's own blocks it reads, and the header kinds it
// reads as limits on its own claim. The host evaluates every block and sends
// the owner data, never HCL text.
message HCLSourceDeclaration {
  repeated HCLSourceBlock blocks = 1;
  repeated string header_kinds = 2;
}
// HCLSourceBlock is one block shape, with the meaning of the host's HCL
// extension contract. At TOP_LEVEL and IN_TABLE the owner reads a block of its
// own; at the attribute sites it adds attributes to the frontend's table,
// index, routine or materialized view block, whose type the claim names.
message HCLSourceBlock {
  enum Site {
    SITE_UNSPECIFIED = 0;
    TOP_LEVEL = 1;
    TABLE_ATTRIBUTES = 2;
    IN_TABLE = 3;
    INDEX_ATTRIBUTES = 4;
    ROUTINE_ATTRIBUTES = 5;
    MATERIALIZED_VIEW_ATTRIBUTES = 6;
  }
  // How the labels of a TOP_LEVEL block name the object it declares. Every
  // other site takes none.
  enum Naming {
    NAMING_UNSPECIFIED = 0;
    UNLABELED = 1;
    SCHEMA_AND_NAME = 2;
    SCHEMA_AND_QUALIFIED_NAME = 3;
    JOINED_NAME = 4;
  }
  Site site = 1;
  string type = 2;
  Naming naming = 3;
  repeated HCLSourceAttribute attributes = 4;
  // Blocks nested one level deep. Only TOP_LEVEL and IN_TABLE take them.
  repeated HCLSourceChild children = 5;
  // The labels name a type that a column type may reference. TOP_LEVEL only.
  bool declares_type = 6;
  // The kind a permission block names an object of this block as. TOP_LEVEL
  // only.
  string grant_kind = 7;
  string selector = 8;
  // DESIRED models whose source formats include HCL.
  repeated string models = 9;
  // Common attributes of the frontend's block the owner reads too, sent in
  // SourceFragment.inherited_attributes. Attribute sites only.
  repeated string inherited = 10;
}
message HCLSourceAttribute {
  enum Kind {
    KIND_UNSPECIFIED = 0;
    STRING = 1;
    TEXT = 2;
    TEXT_LIST = 3;
    BOOL = 4;
    REFERENCE = 5;
    REFERENCES = 6;
    SQL = 7;
    TYPE_NAME = 8;
  }
  string name = 1;
  Kind kind = 2;
  // The block type a REFERENCE or REFERENCES attribute refers to.
  string refers = 3;
  // A REFERENCE a block may leave out.
  bool optional = 4;
}
message HCLSourceChild {
  string type = 1;
  bool unlabeled = 2;
  repeated HCLSourceAttribute attributes = 3;
}
// QueryDialect is the spelling the host's query builder reads for an engine,
// as data: the builder renders statements offline and never calls the
// provider. Each field carries the host dialect descriptor's JSON tag with the
// same meaning and the same values. The SDK checks the shape; the host checks
// the vocabulary and refuses a value it does not know.
message QueryDialect {
  // How a statement marks a bound parameter, such as "dollar-named".
  string placeholder = 1;
  QueryQuoting quoting = 2;
  QuerySpelling query = 3;
  // The capability facts the builder assumes when its caller names the engine
  // without a target's capabilities. A present false is an established
  // answer; an absent key is unknown, and a clause it gates is refused.
  map<string, bool> default_capabilities = 4;
}
// QueryQuoting is the descriptor's quoting section.
message QueryQuoting {
  string style = 1;
  string bare = 2;
  repeated string keywords = 3;
  bool paths = 4;
}
// QuerySpelling is the descriptor's query section.
message QuerySpelling {
  bool checks_capabilities = 1;
  repeated string unsupported_joins = 2;
  bool offset_fetch = 3;
  string fetch_order_by = 4;
  string offset_only_limit = 5;
  bool unsigned_bounds = 6;
  string upsert = 7;
  string upsert_refusal = 8;
  string update_refusal = 9;
}
// SQLSchemaDeclaration says how an engine takes part in SQL schema documents.
// A target has exactly one mode. In FRAGMENTS mode the host lexes and parses
// the document with the shared grammar. In DOCUMENT mode the engine's own
// grammar reads every SQL document of the engine in full through
// ReadSQLSchema, and the host does not lex the text.
message SQLSchemaDeclaration {
  enum Mode { MODE_UNSPECIFIED = 0; FRAGMENTS = 1; DOCUMENT = 2; }
  Mode mode = 1;
  // Kinds a ptah:not-described header of a DOCUMENT engine may name. The host
  // parses the header and sends the entries of these kinds as limits. Empty
  // for FRAGMENTS.
  repeated string header_kinds = 2;
}
// ReleaseLine is one release line of an engine and how much testing stands
// behind it. A level of CERTIFIED or LEGACY_TESTED claims that something runs
// against the line, so it names an image; a line the provider keeps and no
// longer exercises is BEST_EFFORT and says why in unprobed.
message ReleaseLine {
  enum Support {
    SUPPORT_UNSPECIFIED = 0;
    CERTIFIED = 1;
    LEGACY_TESTED = 2;
    BEST_EFFORT = 3;
    KNOWN_INCOMPATIBLE = 4;
  }
  string line = 1;
  string label = 2;
  Support support = 3;
  string image = 4;
  string unprobed = 5;
  string note = 6;
}
// YAMLSourceKey is an explicit owner claim on shared YAML frontend syntax.
// The host refuses collisions with common keys or other selected owners.
// Models name desired value kinds that this key can declare. They are not
// inferred from the key, selector, or owner-specific JSON definition.
message YAMLSourceKey {
  // COLUMN and INDEX are contract 25.3 and are used only when both sides list
  // source.entry-keys. A COLUMN key is a key of a column entry of a table, an
  // INDEX key a key of an index entry.
  enum Scope { SCOPE_UNSPECIFIED = 0; DOCUMENT = 1; TABLE = 2; COLUMN = 3; INDEX = 4; }
  Scope scope = 1;
  string key = 2;
  string selector = 3;
  repeated string models = 4;
  // Common keys of the claim's entry the owner reads too, such as an index's
  // type and ops, sent in SourceFragment.inherited_attributes. COLUMN and
  // INDEX scopes only. Contract 25.3, under source.entry-keys.
  repeated string inherited = 5;
}
// GoSourceDirective is an explicit owner claim on Go annotation syntax. The
// host lexes a Go comment into a directive name and key/value attributes, checks
// that exactly one selected owner claims the name, and sends the owner the
// parsed attributes as a mapping. The owner never receives comment text. The
// attributes list names every key the directive accepts; the host refuses
// others before dispatch. Models name desired value kinds the directive can
// declare, as for YAMLSourceKey.
message GoSourceDirective {
  enum Scope { SCOPE_UNSPECIFIED = 0; DOCUMENT = 1; TABLE = 2; COLUMN = 3; INDEX = 4; }
  Scope scope = 1;
  string directive = 2;
  string selector = 3;
  repeated string attributes = 4;
  repeated string models = 5;
  // Common attributes of the frontend's directive the owner reads too, sent in
  // SourceFragment.inherited_attributes. Contract 25.3, under
  // source.entry-keys.
  repeated string inherited = 6;
}
// IdentifierRules are owner-supplied comparison facts. Missing or unknown
// values are refused; the host must not borrow rules from a built-in engine.
message IdentifierRules {
  enum Comparison {
    COMPARISON_UNSPECIFIED = 0;
    EXACT = 1;
    ASCII_CASE_INSENSITIVE = 2;
  }
  enum IndexNamespace {
    INDEX_NAMESPACE_UNSPECIFIED = 0;
    TABLE = 1;
    SCHEMA = 2;
  }
  Comparison table_names = 1;
  Comparison column_names = 2;
  Comparison index_names = 3;
  IndexNamespace index_namespace = 4;
}
// Reference keeps identity components separate. Display spelling does not
// replace normalized identity. No component is folded by the transport.
message Reference {
  string engine = 1;
  string database = 2;
  string catalog = 3;
  string schema = 4;
  repeated string path = 5;
  string kind = 6;
  string name = 7;
  repeated string overload = 8;
  string display_name = 9;
}
message Envelope {
  string provider_id = 1;
  string kind = 2;
  uint32 schema_version = 3;
  string encoding = 4;
  Reference owner = 5;
  bytes payload = 6;
  repeated string required_features = 7;
  string definition_sha256 = 8;
  // Bound interpretation context, separate from the authored owner identity.
  // Contract 25.7, negotiated under values.context.
  DatabaseContext context = 9;
}
// DatabaseContext contains no address or credentials. The provider interprets
// both roots; the host compares them exactly and never parses their paths.
message DatabaseContext {
  string database = 1;
  string source_database = 2;
}
// DatabaseContextRequest asks for pure address parsing without opening a session
// or resolving credentials. The address is never retained in the receipt.
message DatabaseContextRequest {
  string engine = 1;
  string address = 2;
}
message OpenRequest {
  string engine = 1;
  // The connection address can contain credentials. Neither logs nor durable
  // identity records may contain it.
  string address = 2;
}
message Session {
  string id = 1;
  string engine = 2;
  string database = 3;
  string default_schema = 4;
  string server_version = 5;
  repeated string features = 6;
  IdentifierRules identifiers = 7;
  // Established server facts. A present false value is distinct from an absent
  // fact. The host validates its capability vocabulary and dependencies.
  map<string, bool> capabilities = 8;
  // Contract 25.7, negotiated under database.context.
  DatabaseContext context = 9;
}
message CloseRequest {
  string session_id = 1;
}
message InspectRequest {
  string session_id = 1;
  repeated string schemas = 2;
}
// A false completeness bit is a refused comparison input, never an empty
// authoritative catalog. Unsupported observed facts carry dispositions.
message Schema {
  bool complete = 1;
  repeated Table tables = 2;
  repeated Envelope native_objects = 3;
  repeated Disposition dispositions = 4;
  // Explicit observed knowledge. Empty kinds enroll no models and establish no
  // native-object absence, even when the common-table snapshot is complete.
  ModelCoverage coverage = 5;
  // Binds empty snapshots and owner values to the inspected session's target.
  string engine = 6;
  repeated string target_features = 7;
  // Ordered owner interpretations of the exact requested schema selectors.
  repeated InspectionScopeBinding scope_bindings = 8;
  // Positively identified operational storage, outside desired schema management.
  // Omission from tables or native_objects never makes these names available.
  repeated ReservedObject reserved_objects = 9;
  // The common objects beyond tables, with coverage for each kind the engine
  // declares. Contract 25.3, under schema.common-objects.
  ObservedCommonObjects common_objects = 10;
}
// ObservedCommonObjects is what a read established about the common objects
// of the kinds its engine declares. A kind is complete or uninspected; an
// uninspected kind lists nothing and is never evidence of absence.
message ObservedCommonObjects {
  repeated ObservedView views = 1;
  repeated ObservedSequence sequences = 2;
  repeated ObservedRole roles = 3;
  repeated ObservedGrant grants = 4;
  repeated ObjectComment comments = 5;
  // Exactly one entry for each kind the engine declares.
  repeated CommonObjectCoverage coverage = 6;
  // Roles the server holds that this read does not describe, so a role
  // absent from roles is not taken for one the server does not have.
  repeated string roles_out_of_scope = 7;
  // Contract 25.5, under schema.common-access.
  repeated ObjectOwner object_owners = 8;
  // Independent of the roles this read describes. When ROLE_MEMBERSHIP is
  // declared, ObservedRole.member_of is empty and these are the only edges.
  repeated RoleMembership memberships = 9;
}
message ObjectOwner {
  Reference object = 1;
  string owner = 2;
  // Absent when the read did not establish whether the principal can log in.
  optional bool owner_can_login = 3;
}
message CommonObjectCoverage {
  CommonObjectSupport.Kind kind = 1;
  // COMPLETE, or UNINSPECTED with a reason.
  ModelKnowledge knowledge = 2;
}
message ObservedView {
  // Kind "view" or "materialized_view".
  Reference identity = 1;
  // The query as the server stores it.
  string body = 2;
  string check_option = 3;
  repeated string attributes = 4;
  // Native observed settings owned by this exact common view.
  // Contract 25.7, negotiated under schema.common-view-facets.
  repeated Envelope facets = 5;
}
message ObservedSequence {
  // Kind "sequence".
  Reference identity = 1;
  string data_type = 2;
  optional int64 start = 3;
  optional int64 increment = 4;
  optional int64 min_value = 5;
  optional int64 max_value = 6;
  optional int64 cache = 7;
  bool cycle = 8;
  // The column that owns the sequence, with its table as the only path
  // component, for a sequence a column owns.
  Reference owned_by = 9;
}
message ObservedRole {
  enum Password { PASSWORD_UNKNOWN = 0; PASSWORD_NONE = 1; PASSWORD_SET = 2; }
  string name = 1;
  bool login = 2;
  bool superuser = 3;
  bool create_db = 4;
  bool create_role = 5;
  bool inherit = 6;
  bool replication = 7;
  // A principal of its own kind that never logs in and has members.
  bool group = 8;
  repeated string member_of = 9;
  Password password = 10;
}
// ObservedGrant is one privilege a role holds on one object.
message ObservedGrant {
  string role = 1;
  string privilege = 2;
  // Kind "table", "schema", "database", "sequence", "routine" or the kind of an
  // owner's object. A database grant may leave the name empty.
  Reference target = 3;
  bool with_grant_option = 4;
  string granted_by = 5;
  repeated string columns = 6;
  // A privilege the object holds by default rather than by a grant.
  bool implicit = 7;
}
// ObjectComment is the comment of one object. A column or an index has its
// table as the only path component. An object without a comment has no entry.
message ObjectComment {
  Reference object = 1;
  string text = 2;
}
message Table {
  Reference identity = 1;
  repeated Column columns = 2;
  repeated Envelope facets = 3;
  // Required in inspection replies, including tables with no model facets.
  Reference normalized_identity = 4;
  // Complete common primary key in inspection, including its column order.
  // Contract 25.9, negotiated under schema.observed-primary-keys.
  ObservedConstraint primary_key = 5;
}
message Column {
  string name = 1;
  string type = 2;
  bool nullable = 3;
  bool primary_key = 4;
  optional string default_expression = 5;
  repeated Envelope facets = 6;
  // Exclusive common column facts under schema.observed-columns, contract 25.7.
  // Name matches the attachment identity; the legacy scalar facts stay empty.
  ObservedColumn observed = 7;
}
message Disposition {
  Reference object = 1;
  string field_path = 2;
  enum State {
    STATE_UNSPECIFIED = 0;
    MODELED = 1;
    NORMALIZED = 2;
    UNSUPPORTED = 3;
    NOT_INSPECTED = 4;
  }
  State state = 3;
  string reason = 4;
}
// Change is a typed rendering contribution, not a serialized host AST. The
// host compares and orders changes; the owner renders their engine semantics.
message Change {
  string id = 1;
  Reference object = 2;
  oneof operation {
    Table create_table = 3;
    Empty drop_table = 4;
    Column add_column = 5;
    string drop_column = 6;
    NativeOperation native = 7;
    // Contract 25.3, under schema.common-objects.
    CommonObjectChange common_object = 8;
  }
}
// CommonObjectChange is one change to a common object beyond tables, as a
// typed operand. The owner renders the statement; the host never sends SQL.
message CommonObjectChange {
  oneof operation {
    ViewCreation create_view = 1;
    Reference drop_view = 2;
    SQLSequence create_sequence = 3;
    SequenceAlteration alter_sequence = 4;
    Reference drop_sequence = 5;
    RoleCreation create_role = 6;
    RoleAlteration alter_role = 7;
    // Kind "role" or "group".
    Reference drop_role = 8;
    SQLGrant grant = 9;
    // with_grant_option revokes the grant option only.
    SQLGrant revoke = 10;
    RoleMembership add_member = 11;
    RoleMembership remove_member = 12;
    // An empty text removes the comment.
    ObjectComment set_comment = 13;
  }
}
message ViewCreation {
  SQLView view = 1;
  bool replace = 2;
  // Actual captured observation for a replacement. Absence means unknown.
  // Contract 25.7, negotiated under schema.common-view-facets.
  ObservedView current = 3;
}
message SequenceAlteration {
  // The identity the read reported.
  Reference sequence = 1;
  SQLSequence desired = 2;
  // The attributes that change: as_type, start, increment, min_value,
  // max_value, cache, cycle or owned_by.
  repeated string changed = 3;
  bool restart = 4;
}
// RoleCreation carries the password the unit has to set. Diagnostics never
// repeat it.
message RoleCreation {
  SQLRole role = 1;
  string password = 2;
}
message RoleAlteration {
  SQLRole desired = 1;
  // The attributes that change: login, password, superuser, create_db,
  // create_role, inherit or replication.
  repeated string changed = 2;
  // The new password, when changed lists password. Empty removes it.
  string password = 3;
}
message RoleMembership {
  string group = 1;
  string member = 2;
}
// NativeOperation retains the grammatical context of a captured OPERATION.
// The owner revalidates its payload before rendering; metadata is not authority.
message NativeOperation {
  enum Role {
    ROLE_UNSPECIFIED = 0;
    STATEMENT = 1;
    ALTER_TABLE = 2;
  }
  NormalizedValue value = 1;
  Role role = 2;
  // Required only for ALTER_TABLE. The owner renders the complete statement.
  Reference parent = 3;
}
message RenderRequest {
  // The units a host needs. TEXT asks for SQL text units only: portable
  // statements the same provider's Execute accepts read back from a file.
  // Sent only when both sides list render.text-units. Contract 25.3.
  enum Form {
    ANY = 0;
    TEXT = 1;
  }
  string engine = 1;
  repeated Change changes = 2;
  repeated string target_features = 3;
  // Established false and absent capability facts remain distinct.
  map<string, bool> capabilities = 4;
  Form form = 5;
}
message Unit {
  string change_id = 1;
  oneof body {
    string sql = 2;
    Envelope native = 3;
  }
}
message RenderResult {
  bool complete = 1;
  repeated Unit units = 2;
  // Set by RenderRowWrites when it refuses the batch, and by Render only in the
  // TEXT form with the reason NO_TEXT_FORM: complete is false and there is no
  // unit. Contract 25.1; Render's use is contract 25.3.
  RenderRefusal refusal = 3;
}
message ExecuteRequest {
  string session_id = 1;
  // Correlation only. A request ID does not promise exactly-once execution.
  string request_id = 2;
  repeated Unit units = 3;
  // Empty executes outside an explicit transaction. Otherwise the handle must
  // belong to session_id and remain active. APPLIED confirms execution within
  // that transaction, not a commit.
  string transaction_id = 4;
  // Zero sets no limit. Otherwise the provider stops a unit that runs longer
  // than this and reports the stop in Execution.statement_timed_out, so the
  // caller can tell its own limit from a canceled call. Negative is refused.
  // Sent only when both sides list units.statement-timeout. Contract 25.1.
  int64 statement_timeout_nanoseconds = 5;
  // Required when units.sensitive-inputs is negotiated. Contract 25.5.
  string engine = 6;
  // References captured in the reviewed plan, never values. The provider
  // re-describes the exact units and requires the same references at dispatch.
  repeated ExecutionInput expected_inputs = 7;
  // Ephemeral values resolved immediately before dispatch. Never persisted in
  // units, plans, history, diagnostics or provider logs.
  repeated ExecutionInputBinding input_bindings = 8;
}
message ExecutionInput {
  enum Source { SOURCE_UNSPECIFIED = 0; ENVIRONMENT = 1; }
  Source source = 1;
  string name = 2;
}
message ExecutionInputBinding {
  ExecutionInput input = 1;
  // An explicitly present binding may hold empty bytes.
  bytes value = 2;
}
message DescribeExecutionInputsRequest {
  string engine = 1;
  repeated Unit units = 2;
}
message ExecutionInputs {
  bool complete = 1;
  // Unique references, sorted by source then name. Discovery is deterministic
  // and offline. It never reads an environment or opens a database session.
  repeated ExecutionInput inputs = 2;
}

// Isolation is explicit. Providers refuse levels they cannot establish; they
// never silently substitute a weaker level. DEFAULT selects the engine default
// and makes no serializable guarantee. SERIALIZABLE includes range reads; the
// reads and writes of committed transactions must be equivalent to a serial
// execution, including observations that a revision is absent.
enum TransactionIsolation {
  TRANSACTION_ISOLATION_UNSPECIFIED = 0;
  DEFAULT = 1;
  SERIALIZABLE = 2;
}

// The caller chooses the handle before dispatch, so a lost begin reply does not
// prevent explicit rollback. A repeated begin never creates another transaction.
message BeginTransactionRequest {
  string session_id = 1;
  string transaction_id = 2;
  TransactionIsolation isolation = 3;
}
message Transaction {
  string session_id = 1;
  string id = 2;
  // Must match the requested isolation exactly.
  TransactionIsolation isolation = 3;
}
message FinishTransactionRequest {
  enum Action { ACTION_UNSPECIFIED = 0; COMMIT = 1; ROLLBACK = 2; }
  string session_id = 1;
  string transaction_id = 2;
  Action action = 3;
}
message TransactionResult {
  enum Outcome {
    UNKNOWN = 0;
    COMMITTED = 1;
    ROLLED_BACK = 2;
    // The handle never acquired a transaction and is fenced against a late
    // begin. This is a successful rollback, but not a successful commit.
    NOT_STARTED = 3;
  }
  Outcome outcome = 1;
  string diagnostic_code = 2;
  // Provider-authored, redacted text. Never include credentials or raw URLs.
  string message = 3;
}
message Execution {
  enum Outcome {
    OUTCOME_UNSPECIFIED = 0;
    NOT_STARTED = 1;
    RUNNING = 2;
    APPLIED = 3;
    NOT_APPLIED = 4;
    PARTIAL = 5;
    UNKNOWN = 6;
  }
  Outcome outcome = 1;
  // A contiguous prefix of the request's units, confirmed applied. A lost
  // reply cannot be used as evidence that the remaining units did not apply.
  uint32 applied_count = 2;
  string diagnostic_code = 3;
  // Provider-authored, redacted text. Never include credentials or raw URLs.
  string message = 4;
  // The unit after the confirmed prefix stopped at the request's statement
  // timeout. Only a request with a timeout can set it, and only with
  // NOT_APPLIED, PARTIAL or UNKNOWN: UNKNOWN when the server may still run
  // the unit after the provider stopped waiting. Contract 25.1.
  bool statement_timed_out = 5;
}

// AnalyzeSQL keeps statement boundaries and safety knowledge with the owner.
// A refused batch returns no prefix. Every source byte belongs to a statement
// or whitespace; unsupported comments or syntax must be refused, not skipped.
message AnalyzeSQLRequest {
  string engine = 1;
  repeated string sources = 2;
}
message SQLAnalysis {
  bool complete = 1;
  repeated SQLFile files = 2;
}
message SQLFile { repeated SQLStatement statements = 1; }
message SQLStatement {
  uint32 start = 1;
  uint32 end = 2;
  uint32 line = 3;
  repeated string words = 4;
  repeated string source_words = 5;
  string canonical = 6;
  enum Safety {
    SAFETY_UNSPECIFIED = 0;
    // COMMON_DDL permits the host's common DDL assessment. It is not a claim
    // that the operation is safe. Native effects require another disposition.
    COMMON_DDL = 1;
    BEHAVIORAL = 2;
    DESTRUCTIVE = 3;
    UNKNOWN = 4;
  }
  Safety safety = 7;
  // Redacted explanation of a native effect or an unknown assessment.
  string reason = 8;
}

// NormalizeValues is an offline owner operation. It validates the whole batch
// and produces representation-local canonical projections. It does not compare
// desired state with observed state or decide which migrations to execute.
message NormalizeValuesRequest {
  string engine = 1;
  repeated string target_features = 2;
  repeated ValueInput values = 3;
}
message ValueInput {
  string id = 1;
  enum Representation {
    REPRESENTATION_UNSPECIFIED = 0;
    DESIRED = 1;
    OBSERVED = 2;
    OPERATION = 3;
    CHANGE = 4;
  }
  Representation representation = 2;
  Envelope value = 3;
}
message NormalizedValues {
  bool complete = 1;
  // One result per input, in the same order. A refusal exposes no prefix.
  repeated NormalizedValue values = 2;
}
message NormalizedValue {
  string id = 1;
  // Payload normalization preserves the input envelope's owner, kind, version,
  // encoding, and required features. Unknown fields must be refused by the owner.
  Envelope value = 2;
  // Owner-defined normalized identity, separate from the original spelling.
  // Components remain separate; concatenation is not an identity encoding.
  Reference normalized_owner = 3;
  // The provider defines and versions this format. A host binds it to the
  // negotiated semantic identity, engine, target features, kind, and input
  // representation. It never substitutes serialized Protobuf or raw payload.
  string canonical_format = 4;
  bytes canonical_projection = 5;
  // Pure dependency facts computed by the owner, not inferred from payloads.
  repeated ComparisonIdentity required_objects = 6;
  // Required only for CHANGE. Decoding recomputes these facts from the complete
  // captured change payload; persisted metadata is never trusted on its own.
  ChangeSemantics change_semantics = 7;
  // Required only for OPERATION, reconstructed from the captured payload.
  OperationSemantics operation_semantics = 8;
  // Dependencies are unresolved until the caller supplies database context.
  // In this state required_objects is empty and dependency consumers refuse.
  // Contract 25.7, negotiated under values.context.
  bool requires_database_context = 9;
}

// SourcePosition uses a zero-based offset into the original encoded bytes and
// one-based line and byte-column coordinates in that same encoding. A BOM
// contributes bytes to the first column. Coordinates never refer to a temporary
// rendering of evaluated values.
message SourcePosition {
  uint64 byte_offset = 1;
  uint32 line = 2;
  uint32 column = 3;
}
message SourceSpan {
  SourcePosition start = 1;
  SourcePosition end = 2;
}
// SourceValue retains evaluated frontend data without a host AST, callback, or
// floating-point conversion. An absent map entry and an explicit null differ.
message SourceValue {
  SourceSpan span = 1;
  oneof value {
    Empty null = 2;
    bool boolean = 3;
    string text = 4;
    // Exact JSON number syntax, retained as text rather than a double.
    string number = 5;
    // An expression already identified by the shared frontend. The owner
    // does not evaluate host functions or read files to produce this value.
    string sql = 6;
    Reference reference = 7;
    SourceSequence sequence = 8;
    SourceMapping mapping = 9;
  }
}
message SourceSequence { repeated SourceValue values = 1; }
message SourceMapping { repeated SourceEntry entries = 1; }
message SourceEntry {
  string key = 1;
  SourceSpan key_span = 2;
  SourceValue value = 3;
}
// SourceBlock is evaluated block data. Attributes and child blocks are separate
// namespaces, so an author's attribute cannot collide with transport metadata.
message SourceBlock {
  string type = 1;
  repeated SourceLabel labels = 2;
  SourceMapping attributes = 3;
  repeated SourceBlock children = 4;
  SourceSpan span = 5;
}
message SourceLabel {
  string value = 1;
  SourceSpan span = 2;
}
// SourceBinding retains frontend naming separately from database identity.
// Bindings are scoped to one captured document; no string concatenation joins
// their database, schema, path, or object-name components.
message SourceBinding {
  string id = 1;
  Reference object = 2;
  string struct_name = 3;
  string entry_key = 4;
}
message SourceFragment {
  // Frozen negotiated grammar claim, required only for YAML fragments.
  YAMLSourceKey yaml_key = 10;
  // Frozen negotiated directive claim, required for Go annotation fragments.
  GoSourceDirective go_directive = 11;
  // Frozen negotiated block claim, required for the HCL fragments of an
  // engine that declares HCL claims. Contract 25.3, under source.hcl.
  HCLSourceBlock hcl_block = 12;
  string id = 1;
  string selector = 2;
  // The shared frontend's attachment context, if already known. An owner may
  // resolve a written reference against the document's complete binding set.
  string binding_id = 3;
  Reference subject = 4;
  // Common attributes the selected owner explicitly requested to interpret,
  // such as an index's type and operator class. These are not authored twice.
  SourceMapping inherited_attributes = 5;
  SourceSpan span = 6;
  oneof content {
    SourceValue value = 7;
    SourceBlock block = 8;
    string sql = 9;
  }
}
message SourceDocument {
  string id = 1;
  enum Format {
    FORMAT_UNSPECIFIED = 0;
    SQL = 1;
    YAML = 2;
    HCL = 3;
    GO_ANNOTATIONS = 4;
  }
  Format format = 2;
  string file = 3;
  uint64 byte_length = 4;
  repeated SourceBinding bindings = 5;
  repeated SourceFragment fragments = 6;
  // Explicit scope, frozen before dispatch. Only DESIRED models supporting
  // this document format may be enrolled. Empty means no owner models.
  repeated ValueModel models = 7;
  // The document's ptah:not-described entries in written order. HCL uses
  // hcl_source.header_kinds under source.hcl (25.3); Go uses go_header_kinds
  // under source.limits (25.5).
  repeated SchemaCoverageLimit limits = 8;
}
// SourcePathStep distinguishes a mapping key from a sequence index. A trace
// follows the explicit fragment content tree, not an encoded Go field name.
message SourcePathStep {
  oneof step {
    string key = 1;
    uint32 index = 2;
    string attribute = 3;
    uint32 child = 4;
    uint32 label = 5;
  }
}
message SourceTrace {
  string document_id = 1;
  string fragment_id = 2;
  repeated SourcePathStep path = 3;
  enum Root { ROOT_UNSPECIFIED = 0; CONTENT = 1; INHERITED_ATTRIBUTES = 2; }
  Root root = 4;
  // Set only for a document that ReadSQLSchema read whole: the span of the
  // declaring text in that document. fragment_id, path and root are then empty.
  SourceSpan span = 5;
}


// ValueModel identifies one owner's exact model definition. A captured source
// enrolls these identities explicitly; a later registry cannot widen its scope.
// The definition digest is owner-supplied SHA-256 of its canonical definition,
// not a hash of Protobuf serialization or a substitute for semantic comparison.
message ValueModel {
  string kind = 1;
  ValueInput.Representation representation = 2;
  uint32 schema_version = 3;
  string encoding = 4;
  string definition_sha256 = 5;
  string canonical_format = 6;
  repeated SourceDocument.Format source_formats = 7;
  // Full owner definition, canonicalized with modeljson.Canonical. Its exact
  // SHA-256 must match definition_sha256. It is a nonempty JSON object.
  bytes definition_json = 8;
  // Optional plural label for omission reports. This declares no count metrics.
  // Only desired and observed models may supply a trimmed, single-line label.
  string display_name = 9;
}
message ModelKnowledge {
  enum State {
    STATE_UNSPECIFIED = 0;
    UNINSPECTED = 1;
    COMPLETE = 2;
    ABSENT = 3;
    DEFAULTED = 4;
    UNREPRESENTABLE = 5;
  }
  State state = 1;
  string reason = 2;
}
// A component retains both authored and owner-normalized spelling. An absent
// component is a wildcard; a present empty component matches only an empty name.
message NamespaceComponent {
  string source = 1;
  string normalized = 2;
}
// A namespace is relative to the engine selected by the surrounding operation.
// Path prefixes compare whole components, never delimiter-joined strings.
message ModelNamespace {
  NamespaceComponent database = 1;
  NamespaceComponent catalog = 2;
  NamespaceComponent schema = 3;
  repeated NamespaceComponent path_prefix = 4;
}
message ModelNamespaceKnowledge {
  ModelNamespace scope = 1;
  ModelKnowledge knowledge = 2;
}
message ModelKindCoverage {
  ValueModel model = 1;
  // Knowledge outside every declared region. With no regions it is global.
  ModelKnowledge knowledge = 2;
  // Matching regions combine conservatively: unknown or unrepresentable
  // knowledge overrides completeness. Specific subjects take precedence.
  repeated ModelNamespaceKnowledge regions = 3;
}
message ModelSubjectCoverage {
  string kind = 1;
  Reference subject = 2;
  Reference normalized_subject = 3;
  ModelKnowledge knowledge = 4;
}
message ModelCoverage {
  ValueInput.Representation representation = 1;
  repeated ModelKindCoverage kinds = 2;
  repeated ModelSubjectCoverage subjects = 3;
}

// DecodeSource interprets captured extension fragments offline. The host owns
// frontend evaluation and common schema parsing; this call cannot read files,
// evaluate host functions, or decide migration policy. The owner interprets
// every supplied field, including inherited attributes, or refuses the batch.
message DecodeSourceRequest {
  string engine = 1;
  repeated string target_features = 2;
  repeated SourceDocument documents = 3;
}
message DecodedSource {
  bool complete = 1;
  // Exactly one document result per input, in input order.
  repeated DecodedSourceDocument documents = 2;
}
message DecodedSourceDocument {
  string id = 1;
  // Exact enrolled model inventory. Knowledge may be narrowed by the owner
  // only with negotiated source.limits and claimed headers in the document.
  ModelCoverage coverage = 2;
  // Exactly one result per fragment, in input order. An empty value list is an
  // explicit owner statement that the fully interpreted fragment adds none.
  repeated DecodedSourceFragment fragments = 3;
}
message DecodedSourceFragment {
  string id = 1;
  repeated SourceModelValue values = 2;
}
message SourceModelValue {
  enum Placement { PLACEMENT_UNSPECIFIED = 0; NATIVE_OBJECT = 1; FACET = 2; }
  Placement placement = 1;
  // IDs are unique within a document. The value is DESIRED and its model must
  // be enrolled by that input document. It carries a canonical projection.
  NormalizedValue value = 2;
  // Provenance resolves against the original captured fragment, never output
  // synthesized by the provider. Even an inherited default has a trace.
  SourceTrace source = 3;
}

// ReadSQLSchema reads the SQL schema documents of a DOCUMENT engine offline.
// The host reads the files and sends text; the owner is given no path to open
// and no connection. The call is a pure function of its request: it has no
// session, no address and no credential, and a canceled call returns nothing.
// The reply is the result of running all documents in order, because a later
// document can alter what an earlier one declared.
message ReadSQLSchemaRequest {
  string engine = 1;
  repeated string target_features = 2;
  ComparisonIdentifiers identifiers = 3;
  // Database root that absolute object paths in the documents resolve against.
  string database_path = 4;
  // Documents in the order the load runs them.
  repeated SQLDocument documents = 5;
  // Entries of the documents' ptah:not-described headers whose kind the engine
  // declared in sql_schema.header_kinds, in written order.
  repeated SchemaCoverageLimit limits = 6;
}
message SQLDocument {
  string id = 1;
  // For diagnostics only. The owner never opens it.
  string path = 2;
  string text = 3;
}
// SQLSchema is the owner's reading of a load. Every common object has a home
// in a declared field; an object with none is refused by name with an
// UNSUPPORTED diagnostic, never skipped. With complete false the reply holds
// error diagnostics and no schema: every other field is empty.
message SQLSchema {
  bool complete = 1;
  repeated DeclaredTable tables = 2;
  // DESIRED values of provider-owned models whose source formats include SQL.
  repeated Envelope native_objects = 3;
  // One entry per requested document, in request order.
  repeated SQLDocumentDeclarations declarations = 4;
  // DESIRED coverage the load claims, from the same call that read it.
  ModelCoverage coverage = 5;
  repeated SQLDiagnostic diagnostics = 6;
  repeated DeclaredNamespace namespaces = 7;
  repeated DeclaredEnum enums = 8;
  repeated SQLView views = 9;
  repeated SQLSequence sequences = 10;
  repeated SQLRole roles = 11;
  repeated SQLGrant grants = 12;
  // Exactly one trace for every object of the collections above.
  repeated SQLObjectTrace traces = 13;
}
message SQLView {
  string schema = 1;
  string name = 2;
  // The SELECT text that defines the view.
  string body = 3;
  bool materialized = 4;
  bool with_check = 5;
  string comment = 6;
  repeated string attributes = 7;
  repeated string depends_on = 8;
  // Desired facets and their knowledge, bound to this exact common view.
  // The objects collection is empty. Contract 25.7, schema.common-view-facets.
  CapturedFeatures features = 9;
}
message SQLSequence {
  string schema = 1;
  string name = 2;
  string as_type = 3;
  optional int64 start = 4;
  optional int64 increment = 5;
  optional int64 min_value = 6;
  optional int64 max_value = 7;
  optional int64 cache = 8;
  bool cycle = 9;
  string owned_by = 10;
  string comment = 11;
}
// SQLRole carries no password: a secret in a schema file is not a declared
// value the host compares.
message SQLRole {
  string name = 1;
  bool login = 2;
  bool superuser = 3;
  bool create_db = 4;
  bool create_role = 5;
  bool inherit = 6;
  bool replication = 7;
  string comment = 8;
  // A principal of its own kind that never logs in and has members.
  bool group = 9;
  repeated string member_of = 10;
  // The declaration gives the role a password. The password never travels in
  // a declaration. Contract 25.3, under schema.common-objects.
  bool password_declared = 11;
}
// SQLGrant is one GRANT or REVOKE. A REVOKE asserts the privilege absent, which
// is a statement of its own and not the absence of a grant.
message SQLGrant {
  string role = 1;
  repeated string privileges = 2;
  // The object the privilege applies to. Its kind names what it is, such as
  // "table", "schema", "database" or "routine"; overload holds the argument
  // types of a routine.
  Reference target = 3;
  bool with_grant_option = 4;
  bool revoked = 5;
  string comment = 6;
  // The columns of a table target the privileges are limited to. Empty means
  // the whole table. Contract 25.3, under schema.common-objects.
  repeated string columns = 7;
}
// DeclaredCommonObjects are the declared common objects beyond tables, in the
// shapes ReadSQLSchema returns. A comment stays in the comment field of the
// object it belongs to. Contract 25.3, under schema.common-objects.
message DeclaredCommonObjects {
  // Materialized views set materialized.
  repeated SQLView views = 1;
  repeated SQLSequence sequences = 2;
  repeated SQLRole roles = 3;
  // Revoked grants set revoked.
  repeated SQLGrant grants = 4;
}
// PrepareCommonObjects returns a declaration in the engine's own spelling, so
// the host compares it with what a read reports. It is offline and atomic.
message PrepareCommonObjectsRequest {
  string engine = 1;
  ComparisonIdentifiers identifiers = 2;
  map<string, bool> capabilities = 3;
  repeated string target_features = 4;
  DeclaredCommonObjects declared = 5;
}
message PreparedCommonObjects {
  bool complete = 1;
  // Each collection has the request's length and order, and each entry keeps
  // its identity; only the spelling of its values may change.
  DeclaredCommonObjects prepared = 2;
}
// SQLObjectTrace points one declared object at its text. The collection and
// index select the object, so objects without a unique name are addressable.
message SQLObjectTrace {
  enum Collection {
    COLLECTION_UNSPECIFIED = 0;
    TABLES = 1;
    NATIVE_OBJECTS = 2;
    NAMESPACES = 3;
    ENUMS = 4;
    VIEWS = 5;
    SEQUENCES = 6;
    ROLES = 7;
    GRANTS = 8;
  }
  Collection collection = 1;
  uint32 index = 2;
  SourceTrace source = 3;
}
// SQLDocumentDeclarations mirrors what the host's directory check reads. The
// host uses it only to refuse a later file of a schema directory that declares
// again what an earlier one did; the owner decides what a statement means.
message SQLDocumentDeclarations {
  string document_id = 1;
  // Objects the document leaves declared once it has run.
  repeated SQLDeclaration objects = 2;
  // Objects the document declares under a clause that admits an existing one.
  repeated SQLDeclaration guards = 3;
  // CREATE TABLE and DROP TABLE statements in the order the document runs them.
  repeated SQLTableStatement tables = 4;
}
message SQLDeclaration {
  // The object's kind, such as "table", "view" or "index".
  string kind = 1;
  // The name as the document writes it, qualified where it qualifies it.
  string name = 2;
}
message SQLTableStatement {
  string name = 1;
  bool drop = 2;
  // A CREATE TABLE under IF NOT EXISTS.
  bool guarded = 3;
}
// SQLDiagnostic is positioned in the document text. A message names a span and
// a bounded token, never the statement, because a schema file can carry a
// secret value.
message SQLDiagnostic {
  enum Code { CODE_UNSPECIFIED = 0; SYNTAX = 1; UNSUPPORTED = 2; INVALID = 3; INCOMPLETE = 4; }
  enum Severity { SEVERITY_UNSPECIFIED = 0; ERROR = 1; WARNING = 2; }
  Code code = 1;
  Severity severity = 2;
  string document_id = 3;
  SourceSpan span = 4;
  string message = 5;
}

// ConvertValues interprets a complete captured batch in the other schema
// representation without a session. Source normalization is context, not proof
// that the owner may skip validation. Conversion cannot rename an object or
// establish inspection knowledge.
message ConvertValuesRequest {
  string engine = 1;
  repeated string target_features = 2;
  ValueInput.Representation from = 3;
  ValueInput.Representation to = 4;
  repeated NormalizedValue values = 5;
}

// One selector may name several engine-defined namespaces. Empty namespaces
// explicitly resolve the selector to no objects. Bindings grant no coverage.
message InspectionScopeBinding {
  string selector = 1;
  repeated ModelNamespace namespaces = 2;
}

// ModelComparison assigns contextual models and change representations to one
// owner batch. A model has one placement per engine; facets name common owners.
message ModelComparison {
  string id = 1;
  enum Placement { PLACEMENT_UNSPECIFIED = 0; OBJECTS = 1; FACETS = 2; }
  Placement placement = 2;
  repeated string kinds = 3;
  repeated string change_kinds = 4;
  repeated string owner_kinds = 5;
  repeated string actions = 6;
}

// ComparisonPart records an already-bound identity component. These facts keep
// authored spelling and connection defaults distinct from equality. Comparison
// never reparses a delimiter-joined name to recover a component boundary.
message ComparisonPart {
  string source = 1;
  string normalized = 2;
  bool quoted = 3;
  bool defaulted = 4;
}
message ComparisonIdentity {
  string kind = 1;
  ComparisonPart database = 2;
  ComparisonPart catalog = 3;
  ComparisonPart schema = 4;
  repeated ComparisonPart path = 5;
  ComparisonPart parent = 6;
  ComparisonPart name = 7;
  repeated ComparisonPart signature = 8;
}
// ComparisonNamespace describes host-bound coverage, after capture and target
// selection. It differs from an owner's inspection namespace: common parents,
// explicit subject kinds, exact empty paths, and source target limits remain.
message ComparisonNamespace {
  repeated string targets = 1;
  repeated string subject_kinds = 2;
  ComparisonPart database = 3;
  ComparisonPart catalog = 4;
  ComparisonPart schema = 5;
  ComparisonPart parent = 6;
  repeated ComparisonPart path_prefix = 7;
  bool path_exact = 8;
}
message ComparisonRegion {
  ComparisonNamespace scope = 1;
  ModelKnowledge knowledge = 2;
}
// Sources intersect independently. A complete region in one source cannot
// supply authority missing from another source.
message ComparisonKnowledgeSource {
  ModelKnowledge outside = 1;
  repeated ComparisonRegion regions = 2;
}
message ComparisonKindCoverage {
  ValueModel model = 1;
  repeated ComparisonKnowledgeSource sources = 2;
}
message ComparisonSubjectCoverage {
  string kind = 1;
  ComparisonIdentity subject = 2;
  ModelKnowledge knowledge = 3;
  repeated string targets = 4;
}
message ComparisonCoverage {
  repeated ComparisonKindCoverage kinds = 1;
  repeated ComparisonSubjectCoverage subjects = 2;
}
// A missing value is a deliberately excluded facet, with a nonempty target
// binding. It is not an absent object or a request to restore defaults.
message ComparisonRecord {
  ComparisonIdentity subject = 1;
  string kind = 2;
  repeated string targets = 3;
  NormalizedValue value = 4;
}
message ComparisonState {
  ValueInput.Representation representation = 1;
  repeated ComparisonRecord records = 2;
  ComparisonCoverage coverage = 3;
}
message ComparisonParent {
  ComparisonIdentity subject = 1;
  bool desired = 2;
  bool current = 3;
}
message RequestedChange {
  ComparisonIdentity subject = 1;
  string action = 2;
  // The object as the operator wrote it, for the owner to resolve, set
  // instead of subject. Contract 25.3, under planning.policy.
  string written = 3;
}
message ComparisonExclusion {
  string kind = 1;
  string name = 2;
}
message ComparisonColumn {
  ComparisonIdentity table = 1;
  string name = 2;
  string type = 3;
}
message ComparisonConstraint {
  ComparisonIdentity subject = 1;
  string type = 2;
  repeated string columns = 3;
}
message ResolvedIdentifier {
  string name = 1;
  string key = 2;
}
message ComparisonIdentifiers {
  IdentifierRules rules = 1;
  string default_schema = 2;
  string catalog_collation = 3;
  repeated ResolvedIdentifier resolved_names = 4;
}
// CompareModels is an offline contextual operation. It has no session handle,
// cannot inspect a database, and returns either the whole reply or an error.
// The host enforces common migration policy on the result before planning.
message CompareModelsRequest {
  string engine = 1;
  string comparison_id = 2;
  repeated string target_features = 3;
  ComparisonIdentifiers identifiers = 4;
  // Missing keys mean unestablished facts; false is an established refusal.
  map<string, bool> capabilities = 5;
  repeated string kinds = 6;
  ComparisonState desired = 7;
  ComparisonState current = 8;
  repeated ComparisonParent parents = 9;
  repeated RequestedChange requests = 10;
  repeated ComparisonIdentity declared_relations = 11;
  repeated ComparisonIdentity declared_roles = 12;
  string database_path = 13;
  repeated ComparisonExclusion exclusions = 14;
  repeated ComparisonColumn declared_columns = 15;
  repeated ComparisonIdentity required = 16;
  repeated ComparisonConstraint desired_constraints = 17;
  repeated ComparisonConstraint current_constraints = 18;
}
message ChangeSemantics {
  optional bool replaces_owner = 1;
  optional bool removes_state = 2;
  enum Impact {
    IMPACT_UNSPECIFIED = 0;
    UNKNOWN = 1;
    ADDITIVE = 2;
    BEHAVIORAL = 3;
    DESTRUCTIVE = 4;
  }
  Impact impact = 3;
  string reason = 4;
  enum Access {
    ACCESS_UNSPECIFIED = 0;
    ACCESS_UNKNOWN = 1;
    UNCHANGED = 2;
    WIDENS = 3;
    NARROWS = 4;
  }
  Access access = 5;
  string access_reason = 6;
}
message ComparedChange {
  string kind = 1;
  ComparisonIdentity subject = 2;
  // A normalized CHANGE model whose complete payload reconstructs its facts.
  NormalizedValue value = 3;
}
message ComparisonUndecided {
  string kind = 1;
  // Absent only for an object model's entire unknown namespace.
  ComparisonIdentity subject = 2;
  string reason = 3;
}
message ComparedModels {
  bool complete = 1;
  ComparisonState desired = 2;
  repeated ComparedChange changes = 3;
  repeated ComparisonUndecided undecided = 4;
  // The desired object each written request named, for the requests this
  // service recognized. Contract 25.3, under planning.policy.
  repeated ResolvedRequest resolved_requests = 5;
}
message ResolvedRequest {
  // Index into CompareModelsRequest.requests.
  uint32 request = 1;
  ComparisonIdentity subject = 2;
}

// OperationSemantics carries local safety facts without rendering or I/O.
message OperationSemantics {
  ChangeSemantics.Impact impact = 1;
  string reason = 2;
  ChangeSemantics.Access access = 3;
  string access_reason = 4;
}

// ModelPlanning assigns change, parent, and operation vocabularies to one
// contextual service. Parent assessment runs even without a changed facet.
message ModelPlanning {
  string id = 1;
  repeated string change_kinds = 2;
  repeated string parent_kinds = 3;
  repeated string operation_kinds = 4;
  // Contract 25.7, under planning.object-context. Assessed without a change.
  repeated string context_kinds = 5;
}
message ModelDeclarations {
  string id = 1;
  repeated string kinds = 2;
  repeated string operation_kinds = 3;
}
// PlanDeclarations lowers authored objects without asserting observed absence.
// An explicit engine is required; no session or current state is involved.
message PlanDeclarationsRequest {
  string engine = 1;
  string declaration_id = 2;
  repeated string target_features = 3;
  ComparisonIdentifiers identifiers = 4;
  map<string, bool> capabilities = 5;
  repeated ComparisonRecord objects = 6;
  repeated ValidationTable tables = 7;
  repeated PlanningType types = 8;
  repeated CommonPlanningStep common_steps = 9;
}
message PlannedDeclarations {
  bool complete = 1;
  repeated PlanningContribution contributions = 2;
  repeated DeclarationReceipt declarations = 3;
  // A completed refusal carries diagnostics and no successful output.
  repeated DeclarationDiagnostic diagnostics = 4;
}
message DeclarationReceipt {
  ComparisonIdentity subject = 1;
  string strategy = 2;
  repeated StepIdentity steps = 3;
}
message DeclarationDiagnostic {
  SchemaDiagnostic problem = 1;
  // Zero-based index of the input object, when the diagnostic names one.
  optional uint32 object = 2;
}
// StepIdentity is structured: neither component is a delimiter-joined key.
message StepIdentity { string owner = 1; string name = 2; }
message PlanningEffect {
  ComparisonIdentity subject = 1;
  enum Action { ACTION_UNSPECIFIED = 0; READ = 1; CREATE = 2; ALTER = 3; DROP = 4; }
  Action action = 2;
}
message PlanningMetadata {
  repeated PlanningEffect effects = 1;
  enum Transaction { UNKNOWN = 0; ALLOWED = 1; REQUIRED = 2; FORBIDDEN = 3; }
  Transaction transaction = 2;
  ChangeSemantics.Impact impact = 3;
  string reason = 4;
  enum Placement { DEFAULT = 0; EARLY = 1; }
  Placement placement = 5;
}
message PlanningDependency { StepIdentity before = 1; StepIdentity after = 2; }
message CommonPlanningStep {
  StepIdentity id = 1;
  PlanningMetadata metadata = 2;
  // The actual operand, when this step adds a column. No host AST is sent.
  PlanningColumn added_column = 3;
  ComparisonIdentity parent = 4;
  // The operand, when this step changes a common object beyond tables.
  // Contract 25.3, under schema.common-objects.
  CommonObjectChange common_object = 5;
}
message PlanningOperation {
  NativeOperation.Role role = 1;
  ComparisonIdentity parent = 2;
  NormalizedValue value = 3;
  repeated string notes = 4;
  enum Phase {
    DEFAULT = 0;
    DEPENDENT = 1;
    PREREQUISITE = 2;
    TYPE = 3;
    // Spans the complete common sequence subject to resource, explicit and
    // rewrite constraints. Contract 25.5, under planning.lifecycle.
    LIFECYCLE = 4;
  }
  Phase phase = 5;
}
message PlanningStep {
  StepIdentity id = 1;
  PlanningMetadata metadata = 2;
  PlanningOperation operation = 3;
}
message PlanningContribution {
  string owner = 1;
  repeated PlanningStep steps = 2;
  repeated PlanningDependency dependencies = 3;
}
message PlanningRewrite { repeated StepIdentity sources = 1; StepIdentity replacement = 2; }
message PlanningChange { ComparisonIdentity subject = 1; NormalizedValue value = 2; }
message PlanningReceipt {
  ComparisonIdentity subject = 1;
  string kind = 2;
  string strategy = 3;
  repeated StepIdentity steps = 4;
}
message PlanningParentReceipt {
  PlanningReceipt receipt = 1;
  PlanningTable.Action action = 2;
}
message PlanningDiagnostic {
  enum Code { CODE_UNSPECIFIED = 0; INVALID_SCHEMA = 1; UNSUPPORTED_FEATURE = 2; OMITTED_DECLARATION = 3; }
  Code code = 1;
  string kind = 2;
  string object = 3;
  string feature = 4;
  string message = 5;
  oneof input { uint32 change = 6; uint32 parent = 7; uint32 context_object = 8; }
}
message PlanningType { ComparisonIdentity identity = 1; repeated string references = 2; }
message PlanningTable {
  ComparisonIdentity subject = 1;
  enum Action { CONTEXT = 0; CREATE = 1; ALTER = 2; DROP = 3; REBUILD = 4; }
  Action action = 2;
  // Missing captures are unknown, never proof of absence.
  DeclaredTable desired = 3;
  ObservedTable current = 4;
}
// PlanFeatures is offline. The host provides the complete captured context and
// common steps; the owner contributes operations, never a separately scheduled
// executable prefix. The host must validate and schedule the complete graph.
message PlanFeaturesRequest {
  string engine = 1;
  string planning_id = 2;
  repeated string target_features = 3;
  ComparisonIdentifiers identifiers = 4;
  map<string, bool> capabilities = 5;
  repeated PlanningChange changes = 6;
  repeated PlanningTable tables = 7;
  repeated PlanningType desired_types = 8;
  repeated PlanningType current_types = 9;
  repeated CommonPlanningStep common_steps = 10;
  repeated string parent_kinds = 11;
  string database_path = 12;
  // The declared and observed common objects beyond tables, as context.
  // Contract 25.3, under schema.common-objects.
  DeclaredCommonObjects desired_common = 13;
  ObservedCommonObjects current_common = 14;
  // The operator's planning policy. Contract 25.3, under planning.policy.
  PlanningPolicy policy = 15;
  // Contract 25.7, under planning.object-context. Complete owner-local native
  // states retain coverage; context_kinds assigns assessment, not visibility.
  ComparisonState desired_objects = 16;
  ComparisonState current_objects = 17;
  repeated string context_kinds = 18;
  // Sorted accepted native-change subjects from the complete host batch.
  // Read-only context; this list grants no operation ownership.
  repeated ComparisonIdentity changed_subjects = 19;
}
// PlanningPolicy is a request, not a prediction: an engine without the
// behavior plans as it would without it.
message PlanningPolicy {
  // Plan a change the engine cannot make in place as an explicit rebuild of
  // its table, rather than refuse it.
  bool allow_table_rebuild = 1;
  // How the operator asks for allow_table_rebuild, for a refusal to name, such
  // as "--allow-table-rebuild". Always set.
  string table_rebuild_request = 2;
  // Apply without blocking the writes already running, where the engine has a
  // way to, and fail at the statement where it cannot.
  bool online_alter = 3;
  // Build every added index, or the listed ones, without blocking writes.
  bool concurrent_index_builds = 4;
  repeated ComparisonIdentity concurrent_index_build_subjects = 5;
  // Drop every removed index, or the listed ones, without blocking writes.
  bool concurrent_index_drops = 6;
  repeated ComparisonIdentity concurrent_index_drop_subjects = 7;
  // Make a column NOT NULL without filling its NULL rows first.
  bool omit_null_backfill = 8;
  // Statement spelling selected for this plan. Contract 25.8, under
  // planning.statement-style.
  PlanningStatementStyle statement_style = 9;
}

enum PlanningStatementStyle {
  PLANNING_STATEMENT_STYLE_ANNOTATED = 0;
  PLANNING_STATEMENT_STYLE_EXACT = 1;
}
message PlannedFeatures {
  bool complete = 1;
  repeated PlanningContribution contributions = 2;
  repeated PlanningReceipt changes = 3;
  repeated PlanningParentReceipt parents = 4;
  repeated PlanningRewrite rewrites = 5;
  // A completed refusal carries diagnostics and no successful output.
  repeated PlanningDiagnostic diagnostics = 6;
  // Exact ordered assigned-object union receipts. Contract 25.7, under
  // planning.object-context. Empty steps explicitly acknowledge no work.
  repeated PlanningReceipt objects = 7;
}

// Captured feature collections retain excluded facets and independent coverage
// sources. They contain normalized values, never executable owner callbacks.
message CapturedFeatures {
  ComparisonState objects = 1;
  ComparisonState facets = 2;
}
