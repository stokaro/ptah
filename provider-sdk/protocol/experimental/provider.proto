// PlanningColumn describes the accepted common operation operand. It remains
// separate from a source declaration: defaults have explicit presence and enum
// identity comes from capture, never from the spelling of a type name.
message PlanningColumn {
  string name = 1;
  string type = 2;
  bool type_raw_sql = 3;
  bool type_is_declared_text = 4;
  bool enum_type = 5;
  bool nullable = 6;
  bool primary = 7;
  bool unique = 8;
  bool auto_increment = 9;
  string identity_generation = 10;
  string identity_start = 11;
  string identity_increment = 12;
  string identity_options = 13;
  PlanningDefault default = 14;
  string check = 15;
  string check_name = 16;
  bool check_not_enforced = 17;
  string not_null_constraint_name = 18;
  string generated_expression = 19;
  string generated_kind = 20;
  string collation = 21;
  string comment = 22;
  PlanningForeignKey foreign_key = 23;
  repeated CapturedFacet facets = 24;
}
message PlanningDefault { string value = 1; bool value_set = 2; string expression = 3; }
message PlanningForeignKey {
  string table = 1;
  string column = 2;
  repeated string columns = 3;
  string on_delete = 4;
  string on_update = 5;
  string name = 6;
  bool deferrable = 7;
  string initially = 8;
  string match = 9;
  bool not_enforced = 10;
  repeated CapturedFacet facets = 11;
}
// CapturedFacet retains a value or an explicit target exclusion in its exact
// common operand slot. Its enclosing operand supplies the grammatical owner.
message CapturedFacet {
  string kind = 1;
  repeated string targets = 2;
  NormalizedValue value = 3;
}

// HistoryScope binds a store to a live session and optionally its transaction.
// Schema and table are identifier components, never SQL fragments. A provider
// must validate storage ownership and layout before reading or adopting it.
message HistoryScope {
  enum Format { FORMAT_UNSPECIFIED = 0; NATIVE = 1; ATLAS = 2; }
  string session_id = 1;
  string transaction_id = 2;
  string schema = 3;
  string table = 4;
  Format format = 5;
}
// HistoryRevision carries stored facts. The host owns ordering, checksums,
// retry decisions, and recovery. Version preserves exact identity, including
// an empty Atlas identity. Native versions use canonical signed decimal text.
message HistoryRevision {
  enum State { STATE_UNSPECIFIED = 0; PENDING = 1; APPLIED = 2; FAILED = 3; }
  enum Direction { DIRECTION_UNSPECIFIED = 0; UP = 1; DOWN = 2; }
  string version = 1;
  string description = 2;
  // Native storage carries explicit state and direction. Atlas storage must
  // leave both unspecified; the host derives them from the stored facts.
  State state = 3;
  Direction direction = 4;
  uint64 applied = 5;
  uint64 total = 6;
  string error = 7;
  string error_statement = 8;
  int64 execution_nanoseconds = 9;
  string checksum = 10;
  // Unix time is split so the entire Go time range is not forced into int64
  // nanoseconds. Nanos is in [0, 999999999].
  int64 applied_at_seconds = 11;
  int32 applied_at_nanos = 12;
  string operator_version = 13;
  repeated string partial_hashes = 14;
  uint32 atlas_type = 15;
}
// ReadHistory returns a complete consistent snapshot or an error. A provider
// refuses a store exceeding max_revisions; truncation is never a valid reply.
message ReadHistoryRequest {
  HistoryScope scope = 1;
  uint32 max_revisions = 2;
}
message HistorySnapshot {
  HistoryScope scope = 1;
  bool exists = 2;
  bool complete = 3;
  repeated HistoryRevision revisions = 4;
}
// PrepareHistory creates missing storage and verifies existing storage. It
// does not upgrade an old layout or modify revision rows. Preparation runs
// outside transactions; engines with nontransactional DDL must support it too.
message PrepareHistoryRequest {
  HistoryScope scope = 1;
  string request_id = 2;
}
// MutateHistory is one atomic compare-and-swap. A missing expected row means
// insert only if absent; a missing replacement means delete the exact expected
// row. Replacing a row cannot change its version. No receipt permits replay.
// Under a caller transaction, APPLIED confirms the mutation, not its commit.
message MutateHistoryRequest {
  HistoryScope scope = 1;
  string request_id = 2;
  HistoryRevision expected = 3;
  HistoryRevision replacement = 4;
}
message HistoryResult {
  enum Outcome { UNKNOWN = 0; APPLIED = 1; CONFLICT = 2; REFUSED = 3; }
  HistoryScope scope = 1;
  string request_id = 2;
  Outcome outcome = 3;
  string diagnostic_code = 4;
  string message = 5;
}

// LockScope identifies one acquisition attempt within a live session. The name
// addresses the database's exclusion namespace; lock_id is never reused.
message LockScope {
  string session_id = 1;
  string lock_id = 2;
  string name = 3;
}
// Each RPC has a fresh request_id. TryLock is one nonblocking attempt, not a
// transport-managed wait or retry. Only a confirmed BUSY permits a new attempt.
message LockRequest {
  LockScope scope = 1;
  string request_id = 2;
}
// ACQUIRED confirms current ownership, never an indefinitely valid lease.
// NOT_ACQUIRED from ReleaseLock fences a delayed TryLock with the same handle.
// LOST is terminal: that session must refuse further execution and writes.
message LockResult {
  enum Outcome {
    UNKNOWN = 0;
    ACQUIRED = 1;
    BUSY = 2;
    RELEASED = 3;
    NOT_ACQUIRED = 4;
    LOST = 5;
  }
  LockScope scope = 1;
  string request_id = 2;
  Outcome outcome = 3;
}

// MetadataScope identifies an exact store and its execution handle. LOG writes
// are durable session operations and never carry a transaction ID.
message MetadataScope {
  enum Kind { UNSPECIFIED = 0; LOG = 1; TAGS = 2; }
  string session_id = 1;
  string transaction_id = 2;
  string schema = 3;
  string table = 4;
  Kind kind = 5;
}
message MigrationLogRecord {
  string run_id = 1;
  int64 sequence = 2;
  string operation = 3;
  int64 version = 4;
  string state = 5;
  string actor = 6;
  string actor_source = 7;
  string checksum = 8;
  int64 at_seconds = 9;
  int32 at_nanos = 10;
  string error = 11;
}
message MigrationTagRecord {
  string name = 1;
  int64 version = 2;
  int64 recorded_at_seconds = 3;
  int32 recorded_at_nanos = 4;
}
message PrepareMetadataRequest {
  MetadataScope scope = 1;
  string request_id = 2;
}
message MutateMetadataRequest {
  MetadataScope scope = 1;
  string request_id = 2;
  oneof mutation {
    MigrationLogRecord append_log = 3;
    MigrationTagRecord put_tag = 4;
    string delete_tag = 5;
  }
}
message MetadataResult {
  enum Outcome { UNKNOWN = 0; APPLIED = 1; REJECTED = 2; }
  MetadataScope scope = 1;
  string request_id = 2;
  Outcome outcome = 3;
  // Only DELETE_TAG can set deleted. False confirms atomic absence.
  bool deleted = 4;
}
message LookupMetadataTagRequest {
  MetadataScope scope = 1;
  string request_id = 2;
  string name = 3;
}
message MetadataTagResult {
  MetadataScope scope = 1;
  string request_id = 2;
  bool found = 3;
  MigrationTagRecord record = 4;
}
// The caller chooses a fresh reader ID before opening. Close fences that ID
// even when it reaches the owner before open, and is idempotent for the scope.
message MetadataReadRequest {
  MetadataScope scope = 1;
  string reader_id = 2;
  string request_id = 3;
}
message MetadataReadResult {
  MetadataScope scope = 1;
  string reader_id = 2;
  string request_id = 3;
}
// Pages advance exactly once, starting at zero. An unknown read reply must
// close the snapshot rather than replay a cursor advance.
message ReadMetadataPageRequest {
  MetadataReadRequest reader = 1;
  uint64 page = 2;
  uint32 max_records = 3;
}
message MetadataPage {
  MetadataReadResult reader = 1;
  uint64 page = 2;
  bool exists = 3;
  bool complete = 4;
  repeated MigrationLogRecord logs = 5;
  repeated MigrationTagRecord tags = 6;
}

// The provider verifies ownership and native layout before reserving storage.
// Familiar names alone do not prove ownership. Conflict kinds state which
// object families share this name; the host must not infer engine namespaces.
message ReservedObject {
  Reference object = 1;
  Reference normalized_object = 2;
  enum Purpose {
    PURPOSE_UNSPECIFIED = 0;
    HISTORY = 1;
    LOCK = 2;
    LOG = 3;
    TAG = 4;
  }
  Purpose purpose = 3;
  repeated string conflict_kinds = 4;
}

// PrepareTables resolves comparison inputs from captured declarations and
// observations. It performs no I/O and does not infer existence from omission.
message PrepareTablesRequest {
  string engine = 1;
  ComparisonIdentifiers identifiers = 2;
  map<string, bool> capabilities = 3;
  repeated string target_features = 4;
  repeated TablePreparationInput tables = 5;
}
message TablePreparationInput {
  ComparisonIdentity subject = 1;
  DeclaredTable desired = 2;
  ObservedTable current = 3;
  ModelKnowledge current_knowledge = 4;
}
// PreparedTable contains only permitted adjustments. Authored declarations and
// observations are retained by the caller. Facets may resolve existing declared
// values, but cannot add kinds, restore exclusions, or alter target bindings.
message PreparedTable {
  ComparisonIdentity subject = 1;
  bool column_primary_keys_prepared = 2;
  repeated string column_primary_keys = 3;
  repeated ComparisonRecord resolved_facets = 4;
}
message PreparedTables {
  bool complete = 1;
  repeated PreparedTable tables = 2;
}

// ProjectTableCreations predicts CREATE effects from captured declarations.
// It performs no I/O and establishes neither execution nor catalog inspection.
message ProjectTableCreationsRequest {
  string engine = 1;
  ComparisonIdentifiers identifiers = 2;
  map<string, bool> capabilities = 3;
  repeated string target_features = 4;
  repeated TableCreationInput tables = 5;
}
message TableCreationInput {
  ComparisonIdentity subject = 1;
  DeclaredTable declaration = 2;
  // The caller's allowed facet owners, including owners with no declared values.
  // The host derives these identities from its shared creation acceptance rules.
  repeated ComparisonIdentity facet_owners = 3;
}
message ProjectedTableCreation {
  ComparisonIdentity subject = 1;
  bool column_primary_keys_prepared = 2;
  repeated string column_primary_keys = 3;
  // Computed desired values are converted by their selected model owner.
  repeated ComparisonRecord desired_facets = 4;
  // Observed overrides apply after conversion. They are predictions, not reads.
  repeated ComparisonRecord observed_facets = 5;
  // schema.columns: complete ordered CREATE predictions, never observations.
  repeated ObservedColumn columns = 6;
}
message ProjectedTableCreations {
  bool complete = 1;
  repeated ProjectedTableCreation tables = 2;
}

// ValidateSchema checks a complete captured declaration offline. Validation
// neither renders a plan nor establishes that any object exists on a server.
message ValidateSchemaRequest {
  string engine = 1;
  ComparisonIdentifiers identifiers = 2;
  map<string, bool> capabilities = 3;
  repeated string target_features = 4;
  repeated ValidationTable tables = 5;
  repeated DeclaredNamespace namespaces = 6;
  repeated DeclaredEnum enums = 7;
  CapturedFeatures features = 8;
  bool no_skipped = 9;
  repeated SchemaCoverageLimit not_described = 10;
  map<string, SchemaDependencies> dependencies = 11;
  // Contract 25.3, under schema.common-objects.
  DeclaredCommonObjects common_objects = 12;
}
message ValidationTable {
  ComparisonIdentity subject = 1;
  DeclaredTable declaration = 2;
}
message DeclaredNamespace {
  ComparisonIdentity subject = 1;
  string name = 2;
  string comment = 3;
  string charset = 4;
  string collation = 5;
}
// Diagnostics describe a completed semantic check. Transport or owner failures
// are RPC errors and never successful replies containing a partial diagnostic set.
message SchemaValidation {
  bool complete = 1;
  repeated SchemaDiagnostic diagnostics = 2;
}
message SchemaDiagnostic {
  enum Code {
    CODE_UNSPECIFIED = 0;
    INVALID_SCHEMA = 1;
    UNSUPPORTED_FEATURE = 2;
    OMITTED_DECLARATION = 3;
  }
  Code code = 1;
  string kind = 2;
  string object = 3;
  string feature = 4;
  string message = 5;
}

// Common coverage limits remain evidence limits, never successful validation.
message SchemaCoverageLimit {
 string kind = 1;
 string name = 2;
 string reason = 3;
 string provenance = 4;
}
message SchemaDependencies { repeated string tables = 1; }

// LintRule describes one rule an engine checks, as data the host reads without
// running it. The rule judges the engine that declares it. Codes are unique
// across every provider the host holds.
message LintRule {
  enum Severity {
    SEVERITY_UNSPECIFIED = 0;
    INFO = 1;
    WARNING = 2;
    ERROR = 3;
  }
  string code = 1;
  string title = 2;
  Severity severity = 3;
  // applies_to_down extends a statement rule to the rollback half of a
  // migration.
  bool applies_to_down = 4;
  // subsumes names rules whose finding on the same statement this rule's
  // finding replaces.
  repeated string subsumes = 5;
}

// LintSource is one migration file offered for splitting.
message LintSource {
  string name = 1;
  string sql = 2;
  int64 version = 3;
  bool up = 4;
  bool down = 5;
  bool repeatable = 6;
}

enum LintFact {
  LINT_FACT_UNSPECIFIED = 0;
  LINT_FACT_STATEFUL_DROP = 1;
  LINT_FACT_UNIQUE_INDEX = 2;
  LINT_FACT_REBUILD_DROP = 3;
  LINT_FACT_REBUILD_RENAME = 4;
  LINT_FACT_SAFETY_EFFECT = 5;
  // The facts from here on are contract 25.1. A provider judges or reports
  // them only for an engine that lists lint.statement-facts, to a host that
  // lists it too.
  //
  // What a statement is. Where it is judged, every statement carries exactly
  // one: statement_class says what the statement does to the schema, kind
  // names it in the dialect's words for a message, such as "CREATE TABLE",
  // "UPSERT" or "named expression", and object is what it acts on, when it
  // names one.
  LINT_FACT_STATEMENT_KIND = 6;
  // A table the statement creates without a primary key, named in table. A
  // statement it is judged for and that does not carry it creates no such
  // table.
  LINT_FACT_MISSING_PRIMARY_KEY = 7;
  // A capability the statement needs from its target, named in capability.
  // object, kind, table and clause name the part of the statement that needs
  // it, such as an index and the clause that adds it. The host compares the
  // key with the target's capabilities; the owner does not.
  LINT_FACT_REQUIRED_CAPABILITY = 8;
}

// LintStatementClass is what a statement does to the schema, so a host rule
// can choose the statements it examines without reading the dialect.
enum LintStatementClass {
  LINT_STATEMENT_CLASS_UNSPECIFIED = 0;
  LINT_STATEMENT_CLASS_CREATE_TABLE = 1;
  LINT_STATEMENT_CLASS_ALTER_TABLE = 2;
  // Another statement that creates, alters or drops a schema object.
  LINT_STATEMENT_CLASS_SCHEMA = 3;
  // A statement that changes no schema object: a data change, a query, a
  // setting or a named expression.
  LINT_STATEMENT_CLASS_OTHER = 4;
}

enum LintImpact {
  LINT_IMPACT_UNSPECIFIED = 0;
  LINT_IMPACT_BEHAVIORAL = 1;
  LINT_IMPACT_DESTRUCTIVE = 2;
}

// LintEffect is one fact the owner recognizes in a statement.
message LintEffect {
  LintFact fact = 1;
  string object = 2;
  string kind = 3;
  string table = 4;
  repeated string columns = 5;
  string clause = 6;
  string failure = 7;
  // impact and reason belong to LINT_FACT_SAFETY_EFFECT alone.
  LintImpact impact = 8;
  string reason = 9;
  // statement_class belongs to LINT_FACT_STATEMENT_KIND alone.
  LintStatementClass statement_class = 10;
  // capability belongs to LINT_FACT_REQUIRED_CAPABILITY alone.
  string capability = 11;
}

// LintStatement is one statement of a file. Start and end are byte offsets
// into the source text, and line counts from 1.
message LintStatement {
  uint32 start = 1;
  uint32 end = 2;
  uint32 line = 3;
  string sql = 4;
  string canonical = 5;
  repeated string words = 6;
  repeated string source_words = 7;
  repeated string comments = 8;
  repeated LintEffect effects = 9;
}

// LintFile is one migration file of a lint run with its statements.
message LintFile {
  string name = 1;
  int64 version = 2;
  bool up = 3;
  bool down = 4;
  bool has_pair = 5;
  bool no_transaction = 6;
  bool repeatable = 7;
  repeated LintStatement statements = 8;
}

// SplitLintRequest asks the engine's owner to split migration sources into
// statements. It performs no I/O and opens no session.
message SplitLintRequest {
  string engine = 1;
  repeated LintSource sources = 2;
}
message SplitLint {
  // files holds one entry per source, in request order.
  repeated LintFile files = 1;
  // judged lists the facts the owner reports on statements.
  repeated LintFact judged = 2;
}

// AnnotateLintRequest asks for the facts of statements the host split with a
// scanner that knows no dialect.
message AnnotateLintRequest {
  string engine = 1;
  repeated LintFact facts = 2;
  repeated LintSource sources = 3;
  repeated LintFile files = 4;
}
message LintAnnotation {
  repeated LintEffect effects = 1;
  // declined reports a statement the owner does not judge. It carries no effect.
  bool declined = 2;
}
message LintAnnotations {
  repeated LintAnnotation statements = 1;
}
message AnnotatedLint {
  repeated LintAnnotations files = 1;
}

// CheckLintRequest asks the owner for the findings of the enabled rules over
// every file of a lint run, in the order the migrator applies them.
message CheckLintRequest {
  string engine = 1;
  string server_version = 2;
  map<string, bool> capabilities = 3;
  repeated string codes = 4;
  repeated LintFile files = 5;
  // compatibility is empty for Ptah's own surface and "atlas" for the
  // Atlas-compatible one.
  string compatibility = 6;
}
message LintSubject {
  enum Kind {
    KIND_UNSPECIFIED = 0;
    TABLE = 1;
    COLUMN = 2;
  }
  Kind kind = 1;
  string name = 2;
  string parent = 3;
  string data_type = 4;
}
message LintFinding {
  string code = 1;
  // file indexes the request's files. statement indexes the file's
  // statements, or is -1 for a finding about the whole file.
  int32 file = 2;
  int32 statement = 3;
  string message = 4;
  repeated LintSubject subjects = 5;
}
message CheckedLint {
  // complete is set by an owner that judged every enabled rule over every file.
  bool complete = 1;
  repeated LintFinding findings = 2;
}
// ProvisionDevRequest asks the owner for a throwaway database. spec is the
// operator's image request as typed, such as "docker://ydb/24.3" or
// "docker+ydb://_/ydbplatform/local-ydb:24.3/local", or empty for the owner's
// default. The host never names an image.
//
// address instead names a database the operator owns, in which an engine
// that declares database.dev-realms creates a realm of its own for the run:
// an empty namespace the reply's address selects and the release removes.
// It can contain credentials, as OpenRequest.address can. A request carries
// spec or address, never both. address is contract 25.1 and is sent only
// when both sides list database.dev-realms.
message ProvisionDevRequest {
  string engine = 1;
  string spec = 2;
  string address = 3;
}
// DevDatabaseRefusal is a typed answer from an owner that will not provision.
message DevDatabaseRefusal {
  enum Kind {
    KIND_UNSPECIFIED = 0;
    // UNSUPPORTED means the owner does not provision this spec.
    UNSUPPORTED = 1;
    // UNAVAILABLE means the owner could provision it but its runtime is missing
    // or failed, for example no container engine.
    UNAVAILABLE = 2;
  }
  Kind kind = 1;
  string reason = 2;
}
// DevDatabase carries either a lease and the address to open, or a refusal.
// The lease names what the owner created and must be released. The address
// of a provisioned database carries no credentials. The address of a realm
// keeps the scheme and host of the request's address and may carry its
// credentials, so a host treats it as it treats that address.
message DevDatabase {
  string lease = 1;
  string url = 2;
  DevDatabaseRefusal refusal = 3;
}
message ReleaseDevRequest {
  string engine = 1;
  string lease = 2;
}

// ListDevObjectsRequest asks what CleanDevDatabase would remove from the dev
// database a session selected. Empty schemas select the whole realm the
// session treats as its database; otherwise only the named schemas.
message ListDevObjectsRequest {
  string session_id = 1;
  repeated string schemas = 2;
}
// DevObject is one object a cleanup finds. refusal is empty for an object the
// cleanup removes, and says in one line why it cannot remove one it would
// stop at.
message DevObject {
  Reference object = 1;
  string refusal = 2;
}
// DevObjects is every object in scope, the server's own objects and storage
// the provider keeps for the session left out. The list and the cleanup read
// the same set, so a host judges a dev database clean when the list is empty.
message DevObjects {
  bool complete = 1;
  repeated DevObject objects = 2;
}
// CleanDevRequest empties the scope ListDevObjectsRequest names. The host
// decides that the database is a dev database; the provider cannot.
message CleanDevRequest {
  string session_id = 1;
  string request_id = 2;
  repeated string schemas = 3;
}
// DevCleanup is the outcome of one cleanup. CLEANED leaves the scope empty.
// REFUSED removed nothing and names the objects that stopped it. UNKNOWN is a
// cleanup that stopped part way, or whose effect is not known; the host
// treats the database as not clean.
message DevCleanup {
  enum Outcome { UNKNOWN = 0; CLEANED = 1; REFUSED = 2; }
  string request_id = 1;
  Outcome outcome = 2;
  repeated DevObject blocking = 3;
  // Provider-authored, redacted text. Never include credentials or raw URLs.
  string message = 4;
}

// ReplayScope is how much of the dev server one replayed statement may
// change. The zero value confines it to the dev database the session selected.
message ReplayScope {
  // The database the dev session selected, empty when it selected none.
  string database = 1;
  // The run owns the whole server: the operator declared it disposable, or
  // the run provisioned it.
  bool server = 2;
  // The run provisioned the server and removes it afterwards. Requires server.
  bool provisioned = 3;
  // The run may change every user database of a server the operator named
  // as a whole, and nothing beyond them. Excludes server.
  bool databases = 4;
  // The replay owns one pinned session and discards it after every outcome.
  bool session = 5;
}
// GuardReplayRequest asks the owner, offline, which statements of a
// migration replay have effects it cannot confine to the scope: a change
// outside the dev database, to something the whole server shares, or to the
// replay session's own settings. The host runs no statement of a file that
// has a refused one.
message GuardReplayRequest {
  string engine = 1;
  ReplayScope scope = 2;
  repeated string statements = 3;
}
// ReplayVerdict answers one statement. A refused statement names, in one
// line, what it does that cannot be confined, without quoting the statement.
message ReplayVerdict {
  bool refused = 1;
  string operation = 2;
}
// GuardedReplay holds one verdict per requested statement, in request order.
message GuardedReplay {
  repeated ReplayVerdict verdicts = 1;
}

// DataKind names the case of DataValue the values of a column take.
enum DataKind {
  DATA_KIND_UNSPECIFIED = 0;
  DATA_KIND_BOOL = 1;
  DATA_KIND_INT64 = 2;
  DATA_KIND_UINT64 = 3;
  DATA_KIND_DOUBLE = 4;
  DATA_KIND_STRING = 5;
  DATA_KIND_BYTES = 6;
  DATA_KIND_DECIMAL = 7;
  DATA_KIND_TIMESTAMP = 8;
  DATA_KIND_DATE = 9;
  DATA_KIND_INTERVAL = 10;
  DATA_KIND_JSON = 11;
  DATA_KIND_NATIVE = 12;
}
// DataValue is one value of a row, never SQL text. A value with no case set
// is a column the row does not carry, which differs from null.
message DataValue {
  oneof value {
    Empty null = 1;
    bool bool_value = 2;
    int64 int64_value = 3;
    uint64 uint64_value = 4;
    double double_value = 5;
    string string_value = 6;
    bytes bytes_value = 7;
    DecimalValue decimal_value = 8;
    TimestampValue timestamp_value = 9;
    // Days since 1970-01-01 in the proleptic Gregorian calendar.
    int64 date_value = 10;
    IntervalValue interval_value = 11;
    // JSON text.
    string json_value = 12;
    NativeValue native_value = 13;
  }
}
// DecimalValue is the unscaled integer as decimal digits with an optional
// leading minus, and the scale that places the point: digits 1250 with scale
// 2 is 12.50. precision is the column's, zero when its type states none.
message DecimalValue {
  string digits = 1;
  uint32 precision = 2;
  uint32 scale = 3;
}
// TimestampValue is a moment in UTC. nanos is in [0, 999999999].
message TimestampValue {
  int64 seconds = 1;
  int32 nanos = 2;
}
// IntervalValue keeps months, days and nanoseconds apart, because a month and
// a day have no fixed length.
message IntervalValue {
  int64 months = 1;
  int64 days = 2;
  int64 nanoseconds = 3;
}
// NativeValue is a value the common cases cannot hold. The host does not read
// it; it compares the canonical form the provider returns.
message NativeValue {
  string type = 1;
  bytes payload = 2;
}
// Row is one row, its values aligned with the column list of its message.
message Row {
  repeated DataValue values = 1;
}
// DataColumn is a column of a row set with its engine type and the case its
// values take. A column with no type keeps the values it was given and has no
// kind. native_type names the NativeValue type of a NATIVE column.
message DataColumn {
  string name = 1;
  string type = 2;
  DataKind kind = 3;
  string native_type = 4;
}
// RowColumn is a column the rows of a TypeRows request carry, with the type
// its declaration gives, empty when no declaration types it.
message RowColumn {
  string name = 1;
  string declared_type = 2;
}
// LiveTable is the table the database holds: its columns and engine types.
message LiveTable {
  repeated Column columns = 1;
}
// TypeRowsRequest types the declared and the live rows of one table offline,
// so a comparison pairs values in the form the engine compares them in. The
// host reads the live rows first.
message TypeRowsRequest {
  string engine = 1;
  // Established false and absent capability facts remain distinct.
  map<string, bool> capabilities = 2;
  repeated string target_features = 3;
  Reference table = 4;
  // Absent when the table does not exist yet.
  LiveTable live_table = 5;
  // Every column the rows carry, in the order their values align with.
  repeated RowColumn columns = 6;
  repeated Row declared = 7;
  repeated Row live = 8;
}
// TypedRows holds the engine type of each request column, in request order,
// and both row sets in one canonical form. Rows keep their order and the
// columns each carries.
message TypedRows {
  repeated DataColumn columns = 1;
  repeated Row declared = 2;
  repeated Row live = 3;
}
// ReadRowsRequest reads one page of a table on a live session, in key order.
// A page token resumes the read where the page that returned it stopped.
message ReadRowsRequest {
  string session_id = 1;
  // Empty reads outside a transaction. Otherwise the handle must belong to
  // session_id, and the read sees what the transaction sees.
  string transaction_id = 2;
  Reference table = 3;
  repeated string columns = 4;
  // The key the rows are ordered by. Every key column is also in columns.
  repeated string key_columns = 5;
  string page_token = 6;
  // From 1 to 10,000. A page also stays within the message limit.
  uint32 max_rows = 7;
}
// RowPage is one page of a read. A missing table is exists=false,
// complete=true and no rows; an empty table is exists=true, complete=true and
// no rows. A read that cannot finish is an error and no page.
message RowPage {
  Reference table = 1;
  bool exists = 2;
  bool complete = 3;
  // The requested columns, in request order, with their types. Empty for a
  // missing table.
  repeated DataColumn columns = 4;
  // Every value is set; null is a value.
  repeated Row rows = 5;
  // Empty exactly when complete.
  string next_page_token = 6;
}
// RenderRowWritesRequest renders typed row writes offline. The reply is a
// RenderResult with one unit per write, in input order, or a refusal and no
// unit. Ordering across tables is the caller's; the owner orders rows only
// inside one write when its engine needs it.
message RenderRowWritesRequest {
  string engine = 1;
  map<string, bool> capabilities = 2;
  repeated string target_features = 3;
  repeated RowWrite writes = 4;
  // Sent only when both sides list render.text-units. Contract 25.3.
  RenderRequest.Form form = 5;
}
// RowWrite is one row operation. UPSERT is a mode of the operation, not a
// word of one dialect: an owner whose engine has none refuses it.
message RowWrite {
  enum Mode { MODE_UNSPECIFIED = 0; INSERT = 1; UPSERT = 2; UPDATE_BY_KEY = 3; DELETE_BY_KEY = 4; }
  string change_id = 1;
  Mode mode = 2;
  Reference table = 3;
  // The columns written, key columns included.
  repeated string columns = 4;
  repeated string key_columns = 5;
  // One row, aligned with columns. Every value is set; null is a value.
  repeated DataValue values = 6;
  // The engine type of a column, from TypeRows.
  map<string, string> column_types = 7;
}
// RenderRefusal names the write a refused batch stopped at and why, in one
// line that names no value.
message RenderRefusal {
  // NO_TEXT_FORM refuses, in the TEXT form, a change or a write the engine
  // performs only through a native call. Contract 25.3.
  enum Reason { REASON_UNSPECIFIED = 0; UNSUPPORTED_MODE = 1; UNSUPPORTED_VALUE = 2; NO_TEXT_FORM = 3; }
  string change_id = 1;
  Reason reason = 2;
  string message = 3;
}

// ListSeedTablesRequest lists the tables of one schema, which the host's
// protected-table check compares a seed run against.
message ListSeedTablesRequest {
  string session_id = 1;
  // Empty selects the session's default schema.
  string schema = 2;
}
message SeedTables {
  repeated Reference tables = 1;
}
// Seed is one seed file. Its text and its values never appear in a
// diagnostic: a diagnostic carries the path, a position and a reason.
message Seed {
  // The file's path in the seed directory, which the ledger keys it by.
  string path = 1;
  string filename = 2;
  // The lowercase hex SHA-256 of the file's bytes.
  string checksum = 3;
  string text = 4;
  string env = 5;
}
// ApplySeedRequest runs one file and records it in the provider's ledger
// atomically, replacing an entry for the same path. The provider creates a
// missing ledger, refuses one whose layout it does not own, and never adopts
// another layout.
message ApplySeedRequest {
  string session_id = 1;
  string request_id = 2;
  Seed seed = 3;
}
// RecordSeedRequest records a file in the ledger without running it, as an
// idempotent run does after KEY_CONFLICT. The text is not sent.
message RecordSeedRequest {
  string session_id = 1;
  string request_id = 2;
  Seed seed = 3;
}
// SeedResult is the outcome of one seed request. APPLIED confirms the file
// and its entry together. KEY_CONFLICT, from ApplySeed only, is a statement
// that hit an existing key; nothing of the file stayed. REFUSED ran nothing.
// NOT_APPLIED stopped and proved that nothing committed, as after a bounded
// number of retries. UNKNOWN is any case the provider cannot prove that.
message SeedResult {
  enum Outcome { UNKNOWN = 0; APPLIED = 1; KEY_CONFLICT = 2; REFUSED = 3; NOT_APPLIED = 4; }
  string request_id = 1;
  string path = 2;
  Outcome outcome = 3;
  // Where the statement a REFUSED ApplySeed would not run starts in the text.
  SourcePosition position = 4;
  // One line of at most 512 bytes. Required for REFUSED and NOT_APPLIED.
  string reason = 5;
}
// ReadSeedLedgerRequest reads the whole ledger. A ledger with more than
// max_entries entries is an error, never a truncated reply.
message ReadSeedLedgerRequest {
  string session_id = 1;
  uint32 max_entries = 2;
}
// SeedLedger distinguishes a missing ledger from an empty one. Reading never
// creates it.
message SeedLedger {
  bool exists = 1;
  bool complete = 2;
  repeated SeedLedgerEntry entries = 3;
}
message SeedLedgerEntry {
  string path = 1;
  string checksum = 2;
  string env = 3;
  int64 applied_at_seconds = 4;
  int32 applied_at_nanos = 5;
}

// The embedding store, contract 25.2. The host keeps the lifecycle of an
// embedding generation: the loops, the batch bounds, leases and fencing, every
// lifecycle rule and verification. The provider stores what the host decided,
// owns the layout of that storage, and reads and writes a generation's rows
// and vectors. It refuses nothing for a lifecycle reason.

// EmbeddingEngine is what an engine declares about its embedding store.
message EmbeddingEngine {
  // The consistency modes a generation on this engine can be built with, by
  // the host's names, such as "immutable". The host owns the vocabulary.
  repeated string consistency_modes = 1;
}

// EmbeddingKey is one source key: its components as text, in the key order
// the specification names. Text is the one form every key type has; the
// provider converts each component back to its column's type.
message EmbeddingKey {
  repeated string components = 1;
}

// EmbeddingSource is the relation a generation reads.
message EmbeddingSource {
  Reference table = 1;
  repeated string key_fields = 2;
  // The columns the provider input is built from, in order.
  repeated string input_fields = 3;
  // Empty when the version strategy reads no column.
  string version_field = 4;
  // The specification's own boolean expression in the engine's dialect.
  // Empty selects every row. Only the provider reads it.
  string filter = 5;
}

// EmbeddingTarget is where a generation's vectors live and how they compare.
message EmbeddingTarget {
  enum Layout { LAYOUT_UNSPECIFIED = 0; SOURCE_COLUMNS = 1; OWN_TABLE = 2; }
  enum Metric { METRIC_UNSPECIFIED = 0; COSINE = 1; L2 = 2; INNER_PRODUCT = 3; }
  Reference table = 1;
  string column = 2;
  Layout layout = 3;
  // The engine's name for the stored element type, such as "float".
  string representation = 4;
  Metric metric = 5;
  uint32 dimension = 6;
  // Empty when the specification declares no index.
  string index_method = 7;
  map<string, string> index_options = 8;
}

// EmbeddingNames are the names of a generation's objects. The host derives
// them, so a name that is created and a name that is dropped come from one
// derivation.
message EmbeddingNames {
  string index = 1;
  // What marks a table the generation owns, and is read back before the
  // table is dropped.
  string ownership_mark = 2;
  string column_comment = 3;
}

// EmbeddingSpec is what the engine needs of a specification, never the
// specification document.
message EmbeddingSpec {
  // The generation identity.
  string generation = 1;
  EmbeddingSource source = 2;
  EmbeddingTarget target = 3;
  // A source key holds a set of rows, one per chunk.
  bool chunked = 4;
  EmbeddingNames names = 5;
}

// EmbeddingLocation is where a registered generation's vectors are, as its
// registry record says. A retirement has the record and no specification.
message EmbeddingLocation {
  string generation = 1;
  Reference table = 2;
  string column = 3;
  uint32 dimension = 4;
  EmbeddingNames names = 5;
}

// EmbeddingRefusal says why a request cannot be met at all.
message EmbeddingRefusal {
  enum Reason {
    REASON_UNSPECIFIED = 0;
    // The engine or this server line cannot do what the request asks.
    UNSUPPORTED = 1;
    // The engine refuses a value the request names as written.
    INVALID = 2;
    // An object the request needs does not exist.
    ABSENT = 3;
    // Storage exists and the provider cannot prove it is the generation's or
    // its own.
    NOT_OWNED = 4;
  }
  Reason reason = 1;
  // One line of at most 512 bytes, provider-authored and redacted.
  string message = 2;
}

// EmbeddingWriteResult answers every embedding write. APPLIED means
// committed. CONFLICT, REFUSED and NOT_APPLIED confirm that nothing was
// written. UNKNOWN leaves the effect unresolved, and nothing resends it.
message EmbeddingWriteResult {
  enum Outcome { UNKNOWN = 0; APPLIED = 1; CONFLICT = 2; REFUSED = 3; NOT_APPLIED = 4; }
  enum IndexOutcome { INDEX_OUTCOME_UNSPECIFIED = 0; NOT_DECLARED = 1; ALREADY_VALID = 2; BUILT = 3; REBUILT = 4; }
  string request_id = 1;
  Outcome outcome = 2;
  // Set with REFUSED, and only then.
  EmbeddingRefusal refusal = 3;
  // One line of at most 512 bytes. Required with NOT_APPLIED.
  string message = 4;
  // With APPLIED from MutateEmbeddingState and CommitEmbeddingBatch: each
  // written record as a later read returns it, in key order.
  EmbeddingRecords written = 5;
  // With APPLIED from AppendEmbeddingEvent: the sequence the event took.
  int64 sequence = 6;
  // With APPLIED from BuildEmbeddingIndex.
  IndexOutcome index_outcome = 7;
}

// The run-state records. Their fields are the host's run state, so a provider
// can keep each in a column of its own. Phase, status, kind and failure class
// are text the host defines; the provider stores it and does not read it. An
// absent time is the zero time.

message EmbeddingGeneration {
  string identity = 1;
  string spec_digest = 2;
  string spec_document = 3;
  string name = 4;
  string reproducibility = 5;
  string reproducibility_reason = 6;
  string resolved_model = 7;
  uint32 dimension = 8;
  string target_schema = 9;
  string target_table = 10;
  string target_column = 11;
  string source_schema = 12;
  string source_table = 13;
  string consistency_mode = 14;
  TimestampValue created_at = 15;
  TimestampValue retired_at = 16;
  TimestampValue verified_at = 17;
  TimestampValue maintained_until = 18;
}

message EmbeddingProgress {
  int64 rows_scanned = 1;
  int64 rows_embedded = 2;
  int64 rows_skipped = 3;
  int64 rows_deleted = 4;
  int64 batches_committed = 5;
  int64 provider_prompt_tokens = 6;
  int64 provider_total_tokens = 7;
  int64 provider_usage_batches = 8;
  uint32 retry_count = 9;
}

message EmbeddingRun {
  string id = 1;
  string spec_digest = 2;
  string generation_identity = 3;
  string environment = 4;
  string source = 5;
  string target = 6;
  string provider_profile = 7;
  string resolved_model = 8;
  string ptah_version = 9;
  string policy_digest = 10;
  string phase = 11;
  string status = 12;
  string lease_owner = 13;
  TimestampValue lease_expires = 14;
  int64 fencing_token = 15;
  bool snapshot_done = 16;
  string snapshot_watermark = 17;
  string catch_up_watermark = 18;
  // The keyset position the backfill resumes after.
  repeated string cursor = 19;
  EmbeddingProgress progress = 20;
  string verification_ref = 21;
  string cutover_plan_ref = 22;
  string approval_ref = 23;
  string active_pointer = 24;
  bool rollback_eligible = 25;
  string failure_class = 26;
  string failure_detail = 27;
  TimestampValue created_at = 28;
  TimestampValue updated_at = 29;
}

// EmbeddingRecords lists records in key order: generations by identity, runs
// by ID, pointers by schema and then table.
message EmbeddingRecords {
  repeated EmbeddingGeneration generations = 1;
  repeated EmbeddingRun runs = 2;
  repeated EmbeddingPointer pointers = 3;
}

message EmbeddingPointerKey {
  string target_schema = 1;
  string target_table = 2;
}

message EmbeddingPointer {
  string target_schema = 1;
  string target_table = 2;
  string active_generation = 3;
  string previous_generation = 4;
  TimestampValue cut_over_at = 5;
  string cut_over_by = 6;
  string plan_digest = 7;
}

// EmbeddingEventCounts are a run's counts when an event happened.
message EmbeddingEventCounts {
  int64 rows_scanned = 1;
  int64 rows_embedded = 2;
  int64 rows_skipped = 3;
  int64 rows_deleted = 4;
  int64 batches_committed = 5;
}

// EmbeddingEvent is one entry of a run's audit trail. It has no field for row
// content or a vector.
message EmbeddingEvent {
  string run_id = 1;
  // Assigned by the provider: the run's previous sequence plus one, from 1.
  int64 sequence = 2;
  string kind = 3;
  TimestampValue at = 4;
  string actor = 5;
  int64 fencing_token = 6;
  string from_phase = 7;
  string to_phase = 8;
  string detail = 9;
  EmbeddingEventCounts counts = 10;
}

// EmbeddingStateScope selects the records one lifecycle decision reads.
message EmbeddingStateScope {
  message AllRecords {}
  oneof scope {
    // Every generation, run and pointer.
    AllRecords everything = 1;
    // One run, by ID.
    string run = 2;
    // One generation, by identity.
    string generation = 3;
    // Every run of one generation, by its identity.
    string runs_of_generation = 4;
    EmbeddingPointerKey pointer = 5;
  }
}

// PrepareEmbeddingStoreRequest creates a missing store and verifies an
// existing one. A layout the provider does not recognize as its own is
// REFUSED with NOT_OWNED, and is never upgraded.
message PrepareEmbeddingStoreRequest {
  string session_id = 1;
  string request_id = 2;
}

// ReadEmbeddingStateRequest reads one scope as one consistent snapshot. A
// scope holding more than max_records records is an error, never a partial
// snapshot.
message ReadEmbeddingStateRequest {
  string session_id = 1;
  EmbeddingStateScope scope = 2;
  uint32 max_records = 3;
}

// EmbeddingState is a snapshot of one scope. A store that does not exist is
// exists=false with no record.
message EmbeddingState {
  EmbeddingStateScope scope = 1;
  bool exists = 2;
  EmbeddingRecords records = 3;
  // A digest of exactly these records. Equal records give an equal token
  // within one provider build; any change to a record of the scope, including
  // one that appears, gives another.
  string token = 4;
}

// MutateEmbeddingStateRequest is one atomic compare-and-write. The provider
// reads the scope again, and only when its token equals expected_token writes
// each record whole. A mutation writes only records its scope covers and
// never deletes one.
message MutateEmbeddingStateRequest {
  string session_id = 1;
  string request_id = 2;
  EmbeddingStateScope scope = 3;
  string expected_token = 4;
  // The records the decision changed, each whole.
  EmbeddingRecords records = 5;
}

// AppendEmbeddingEventRequest records one event of an existing run. The
// event's sequence is zero; the provider assigns it.
message AppendEmbeddingEventRequest {
  string session_id = 1;
  string request_id = 2;
  EmbeddingEvent event = 3;
}

// ReadEmbeddingEventsRequest pages a run's events after a sequence.
message ReadEmbeddingEventsRequest {
  string session_id = 1;
  string run_id = 2;
  int64 after_sequence = 3;
  uint32 max_events = 4;
}

// EmbeddingEventPage holds events in sequence order. exists is false for a
// run that is not there. complete says no event follows the last one.
message EmbeddingEventPage {
  string run_id = 1;
  bool exists = 2;
  repeated EmbeddingEvent events = 3;
  bool complete = 4;
}

// DescribeEmbeddingTargetRequest asks offline whether an engine can hold a
// specification, and what a generation needs on it.
message DescribeEmbeddingTargetRequest {
  string engine = 1;
  EmbeddingSpec spec = 2;
}

// EmbeddingTargetObjects is a refusal, or what a generation needs.
message EmbeddingTargetObjects {
  EmbeddingRefusal refusal = 1;
  string column_type = 2;
  // The generation creates the target table and drops it at retirement.
  bool owns_table = 3;
  // An owned table references the source rows its keys name.
  bool references_source = 4;
  bool has_index = 5;
  string index_method = 6;
  string index_operator = 7;
  repeated string required_extensions = 8;
}

// ResolveEmbeddingRelationsRequest asks which relation each spelling names on
// this server. A spelling that names no relation comes back as written.
message ResolveEmbeddingRelationsRequest {
  string session_id = 1;
  repeated Reference relations = 2;
}

// EmbeddingRelations answers each relation of the request, in order.
message EmbeddingRelations {
  repeated Reference relations = 1;
}

message MeasureEmbeddingRequest {
  string session_id = 1;
  EmbeddingSpec spec = 2;
}

// EmbeddingMeasurement is what a plan reports about the database.
message EmbeddingMeasurement {
  bool source_exists = 1;
  bool target_table_exists = 2;
  bool target_column_exists = 3;
  // rows is the number of source rows in scope, and is zero when they were
  // not counted.
  bool rows_counted = 4;
  int64 rows = 5;
  // What the database can do with vectors, by the names the host's plan
  // holds a database to. A present false is an answer; an absent key is
  // unknown.
  map<string, bool> capabilities = 6;
  bool index_buildable = 7;
  // Reasons the database cannot run the specification, one line each.
  repeated string refusals = 8;
}

// PrepareEmbeddingTargetRequest creates a generation's storage, or verifies
// that a prepared one is still complete. Both are idempotent.
message PrepareEmbeddingTargetRequest {
  enum Mode { MODE_UNSPECIFIED = 0; CREATE = 1; VERIFY = 2; }
  string session_id = 1;
  string request_id = 2;
  EmbeddingSpec spec = 3;
  Mode mode = 4;
}

// BuildEmbeddingIndexRequest builds the declared index, or rebuilds one whose
// build did not finish.
message BuildEmbeddingIndexRequest {
  string session_id = 1;
  string request_id = 2;
  EmbeddingSpec spec = 3;
}

message ReadEmbeddingStructureRequest {
  string session_id = 1;
  EmbeddingLocation location = 2;
  // Count the rows the generation holds.
  bool count_rows = 3;
}

// EmbeddingStructure is a generation's storage as the engine reports it.
message EmbeddingStructure {
  bool table_exists = 1;
  bool column_exists = 2;
  string column_type = 3;
  uint32 dimension = 4;
  bool index_exists = 5;
  // The index finished building and serves queries.
  bool index_valid = 6;
  string index_method = 7;
  string index_operator = 8;
  // What the engine needs to store and compare vectors is present.
  bool vector_support = 9;
  // Set exactly when the request asked for a count.
  bool rows_counted = 10;
  int64 rows = 11;
  // The session settings a search runs under, as name=value pairs joined by
  // commas.
  string search_settings = 12;
}

// DropEmbeddingGenerationRequest drops a retired generation's index, and the
// columns or the table the approval names. Ownership is checked before
// anything is dropped, so a refusal drops nothing.
message DropEmbeddingGenerationRequest {
  enum Storage { STORAGE_UNSPECIFIED = 0; INDEX_ONLY = 1; COLUMNS = 2; TABLE = 3; }
  string session_id = 1;
  string request_id = 2;
  EmbeddingLocation location = 3;
  Storage storage = 4;
}

// EmbeddingSourceRow is one source row: each input field is null or text.
message EmbeddingSourceRow {
  EmbeddingKey key = 1;
  repeated DataValue fields = 2;
  string version = 3;
}

// ScanEmbeddingSourceRequest reads one keyset page after a key, in key
// order, under the filter. An absent key starts at the beginning.
message ScanEmbeddingSourceRequest {
  string session_id = 1;
  EmbeddingSource source = 2;
  EmbeddingKey after = 3;
  uint32 max_rows = 4;
}

// EmbeddingSourcePage is one keyset page. cursor is where the next page
// starts after; done says the scan reached the end. A page may be empty and
// not done, when the filter matched nothing for a stretch.
message EmbeddingSourcePage {
  repeated EmbeddingSourceRow rows = 1;
  EmbeddingKey cursor = 2;
  bool done = 3;
}

// ReadEmbeddingSourceRowsRequest rereads rows by key, under the filter.
message ReadEmbeddingSourceRowsRequest {
  string session_id = 1;
  EmbeddingSource source = 2;
  repeated EmbeddingKey keys = 3;
}

// EmbeddingSourceRows holds the rows still present. A requested key missing
// from it is a row that is gone.
message EmbeddingSourceRows {
  repeated EmbeddingSourceRow rows = 1;
}

// EmbeddingWriteKind is what a target write did to a row.
enum EmbeddingWriteKind {
  EMBEDDING_WRITE_KIND_UNSPECIFIED = 0;
  EMBEDDING_WRITE_KIND_UPSERT = 1;
  EMBEDDING_WRITE_KIND_SKIP = 2;
  EMBEDDING_WRITE_KIND_TOMBSTONE = 3;
}

// EmbeddingHeldTarget is what the target holds at one key: the generation,
// input hash, version and kind of the key's first stored row. A key nothing
// wrote is absent.
message EmbeddingHeldTarget {
  EmbeddingKey key = 1;
  string generation = 2;
  string input_hash = 3;
  string version = 4;
  EmbeddingWriteKind kind = 5;
}

// ReadEmbeddingBatchStateRequest reads what a batch commit compares: the run
// and what the target holds at the batch's keys.
message ReadEmbeddingBatchStateRequest {
  string session_id = 1;
  EmbeddingSpec spec = 2;
  string run_id = 3;
  repeated EmbeddingKey keys = 4;
}

// EmbeddingBatchState is the run, or no run when it is not there, the held
// state of the requested keys, and a token over both.
message EmbeddingBatchState {
  string run_id = 1;
  EmbeddingRun run = 2;
  repeated EmbeddingHeldTarget held = 3;
  string token = 4;
}

// EmbeddingTargetWrite is one member of a key's set.
message EmbeddingTargetWrite {
  EmbeddingKey key = 1;
  uint32 ordinal = 2;
  string generation = 3;
  string input_hash = 4;
  string version = 5;
  EmbeddingWriteKind kind = 6;
  // The vector of an UPSERT, of the target's dimension. Empty otherwise.
  repeated float vector = 7;
}

// CommitEmbeddingBatchRequest is one atomic compare-and-write over the run
// and the batch's keys. The provider rereads both, compares the token, makes
// each written key's stored rows equal to its set, writes the run, and
// commits. A set is ordered by ordinal from 0; a skip or a tombstone is a set
// of one at ordinal 0.
message CommitEmbeddingBatchRequest {
  string session_id = 1;
  string request_id = 2;
  EmbeddingSpec spec = 3;
  string run_id = 4;
  // The keys the token was read over. Every write names one of them.
  repeated EmbeddingKey keys = 5;
  string expected_token = 6;
  EmbeddingRun run = 7;
  repeated EmbeddingTargetWrite writes = 8;
}

// EmbeddingStoredRow is what a target row holds. A row nothing wrote has no
// generation and no kind. It never carries the vector, only its width.
message EmbeddingStoredRow {
  string generation = 1;
  string input_hash = 2;
  string version = 3;
  EmbeddingWriteKind kind = 4;
  // The number of elements of the stored vector, zero for none.
  uint32 dimension = 5;
  uint32 ordinal = 6;
}

// EmbeddingVerificationSource is the source side of a row in scope.
message EmbeddingVerificationSource {
  repeated DataValue fields = 1;
  string version = 2;
}

// EmbeddingVerificationRow is one position of the verification walk. source
// is absent when the key is out of scope; stored is absent when no row stands
// at the key. One of them is present.
message EmbeddingVerificationRow {
  EmbeddingKey key = 1;
  EmbeddingVerificationSource source = 2;
  EmbeddingStoredRow stored = 3;
}

// ReadEmbeddingVerificationRequest pages the walk verification folds over.
message ReadEmbeddingVerificationRequest {
  string session_id = 1;
  EmbeddingSpec spec = 2;
  string page_token = 3;
  uint32 max_rows = 4;
}

// EmbeddingVerificationPage holds rows of one key adjacent, and never splits
// them across pages. Each page reads both sides of its keys in one read.
message EmbeddingVerificationPage {
  repeated EmbeddingVerificationRow rows = 1;
  string next_page_token = 2;
  bool complete = 3;
}

// SearchEmbeddingsRequest asks for the keys nearest to one vector.
message SearchEmbeddingsRequest {
  string session_id = 1;
  EmbeddingSpec spec = 2;
  repeated float vector = 3;
  uint32 depth = 4;
}

// EmbeddingSearchResult lists the nearest keys through the index, as an
// application's query would, and by exhaustive scan. A FAILED search carries
// a reason and no keys; the host records it against its case.
message EmbeddingSearchResult {
  enum Outcome { OUTCOME_UNSPECIFIED = 0; COMPLETED = 1; FAILED = 2; }
  Outcome outcome = 1;
  // One line of at most 512 bytes. Required with FAILED.
  string message = 2;
  repeated EmbeddingKey indexed = 3;
  repeated EmbeddingKey exact = 4;
  // An index served the first list.
  bool index_used = 5;
}

// EncodeSource writes a provider's DESIRED values as the fragments its claims
// read, offline: the mirror of DecodeSource. The host writes the syntax of the
// format; the owner never writes text of it. Contract 25.3, under
// source.encode.
message EncodeSourceRequest {
  string engine = 1;
  repeated string target_features = 2;
  // YAML, HCL or GO_ANNOTATIONS.
  SourceDocument.Format format = 3;
  // The document's tables, with the frontend naming they are written with.
  repeated SourceBinding bindings = 4;
  repeated EncodeSourceValue values = 5;
  // What the document knows of the provider's models, DESIRED.
  ModelCoverage coverage = 6;
  // GO_ANNOTATIONS only: the columns of the bound tables, for their Go types.
  repeated EncodeSourceColumn columns = 7;
}
message EncodeSourceValue {
  SourceModelValue.Placement placement = 1;
  // DESIRED; the envelope's owner is the object or the facet's subject.
  NormalizedValue value = 2;
  // The table binding of a facet. Empty for a native object.
  string binding_id = 3;
}
message EncodeSourceColumn {
  string binding_id = 1;
  string name = 2;
  // The engine type.
  string type = 3;
  bool nullable = 4;
  bool primary_key = 5;
}
// EncodedSource accounts for every input value once: written by one fragment
// or reported as one loss. A refused call is an error and returns nothing.
message EncodedSource {
  bool complete = 1;
  repeated EncodedFragment fragments = 2;
  repeated EncodeLoss losses = 3;
  // The ptah:not-described entries the document has to carry.
  repeated SchemaCoverageLimit limits = 4;
  // GO_ANNOTATIONS only.
  repeated EncodedFieldType field_types = 5;
  // Contract 25.5, under source.encode-groups. Mutually exclusive with
  // fragments. Each group accounts for values once across ordered syntax parts.
  repeated EncodedSourceGroup groups = 6;
}
message EncodedSourceGroup {
  repeated string value_ids = 1;
  repeated EncodedSourcePart parts = 2;
}
message EncodedSourcePart {
  // The negotiated claim and content, without positions or value accounting.
  SourceFragment fragment = 1;
  EncodedFragment.Placement placement = 2;
}
message EncodedFragment {
  // The claim, selector, binding, subject and content as DecodeSource
  // receives them, with no position.
  SourceFragment fragment = 1;
  // The IDs of the input values the fragment writes.
  repeated string value_ids = 2;
  // Where an HCL TOP_LEVEL or IN_TABLE block stands among the writer's own.
  enum Placement {
    PLACEMENT_UNSPECIFIED = 0;
    BEFORE_TYPES = 1;
    USER_TYPES = 2;
    AFTER_TABLES = 3;
    AFTER_TRIGGERS = 4;
    WITHIN_TABLE = 5;
  }
  Placement placement = 3;
}
// EncodeLoss is a value the format cannot say, in one line that names it and
// never its content.
message EncodeLoss {
  string value_id = 1;
  string message = 2;
}
message EncodedFieldType {
  string binding_id = 1;
  string column = 2;
  // Such as "uint64" or "time.Time".
  string go_type = 3;
  string go_import = 4;
}

// RunStatementRequest runs one statement the operator wrote, such as a check,
// a test assertion or a script step, on a live session. The host composes no
// statement it sends here. Contract 25.4, under sessions.statements.
message RunStatementRequest {
  string session_id = 1;
  // Correlation only, as for Execute. The reply echoes it.
  string request_id = 2;
  // Empty runs outside an explicit transaction. Otherwise the handle must
  // belong to session_id and remain active. Never set with READ_ONLY.
  string transaction_id = 3;
  // One statement, as the operator wrote it.
  string sql = 4;
  // Bound in the order the statement's placeholders take them, in the
  // engine's own placeholder syntax. Every argument is set; null is a value.
  repeated DataValue arguments = 5;
  enum Access {
    ACCESS_UNSPECIFIED = 0;
    // Run the statement as written.
    READ_WRITE = 1;
    // Run it only when the provider proves, before running it, that it is one
    // query that changes nothing and reads only objects of the session's
    // database, and run it where a write is refused. Otherwise refuse it.
    READ_ONLY = 2;
  }
  Access access = 6;
  // From 1 to 10,000: the rows of the first page. A page also stays within
  // the message limit.
  uint32 max_rows = 7;
}
// StatementResult is what one statement did. A reply the host cannot read
// leaves the outcome unknown, and the host never sends the statement again.
message StatementResult {
  string request_id = 1;
  enum Outcome {
    OUTCOME_UNSPECIFIED = 0;
    // The statement ran. columns, rows and rows_affected say what it did.
    SUCCEEDED = 1;
    // The engine refused the statement and it changed nothing. error says
    // why.
    FAILED = 2;
    // The provider ran nothing: a READ_ONLY statement it cannot prove, or a
    // statement its engine cannot run here. refusal says why.
    REFUSED = 3;
    // The provider cannot say whether the statement ran.
    UNKNOWN = 4;
  }
  Outcome outcome = 2;
  // The result's columns, in order, with their engine types. Empty for a
  // statement that returns no rows. SUCCEEDED only.
  repeated DataColumn columns = 3;
  // The first page. Every value is set; null is a value. SUCCEEDED only.
  repeated Row rows = 4;
  // Present only when the engine measured how many rows the statement
  // changed. SUCCEEDED only.
  optional uint64 rows_affected = 5;
  // Empty exactly when every row is in this reply. The result stays open on
  // the provider's side until its last page is read, CloseStatement releases
  // it, or the transaction or the session it was read in ends. SUCCEEDED
  // only.
  string next_page_token = 6;
  // FAILED only: the server's message for the statement, at most 4 KiB, with
  // what the transport adds removed and never a credential; and the server's
  // code for it, such as an SQLSTATE.
  string error = 7;
  string error_code = 8;
  // REFUSED only: one line naming what stopped the statement.
  string refusal = 9;
}
// ReadStatementRowsRequest reads the next page of an open result.
message ReadStatementRowsRequest {
  string session_id = 1;
  // The next_page_token the previous page returned.
  string page_token = 2;
  // From 1 to 10,000.
  uint32 max_rows = 3;
  // How many columns the result named, which every row of the page has.
  uint32 column_count = 4;
}
// StatementRows is one page of an open result, in the columns the result
// named. A read that cannot finish is an error and no page.
message StatementRows {
  repeated Row rows = 1;
  // Empty exactly when this page is the last one, which releases the result.
  string next_page_token = 2;
}
// CloseStatementRequest releases an open result before its last page. A
// token whose result is already released succeeds.
message CloseStatementRequest {
  string session_id = 1;
  string page_token = 2;
}

// schema.columns owns offline equivalence and readback of captured common
// columns. The host owns pairing, domains, generated expressions and operations.
message CompareColumnsRequest {
  string engine = 1;
  ComparisonIdentifiers identifiers = 2;
  map<string, bool> capabilities = 3;
  repeated string target_features = 4;
  repeated ColumnComparisonTable tables = 5;
}
message ColumnComparisonTable {
  ComparisonIdentity subject = 1;
  DeclaredTable desired = 2;
  ObservedTable current = 3;
  repeated ColumnComparisonPair pairs = 4;
  ComparisonIdentity current_subject = 5;
}
enum ColumnAspect {
  COLUMN_ASPECT_UNSPECIFIED = 0;
  COLUMN_TYPE = 1;
  COLUMN_DEFAULT = 2;
  COLUMN_NULLABILITY = 3;
  COLUMN_SEQUENCE = 4;
}
message ColumnComparisonPair {
  ComparisonIdentity subject = 1;
  string desired_column = 2;
  string current_column = 3;
  repeated ColumnAspect aspects = 4;
  ComparisonIdentity current_subject = 5;
}
message ComparedColumns {
  bool complete = 1;
  repeated ComparedColumnTable tables = 2;
}
message ComparedColumnTable {
  ComparisonIdentity subject = 1;
  repeated ComparedColumn columns = 2;
  ComparisonIdentity current_subject = 3;
}
message ComparedColumn {
  ComparisonIdentity subject = 1;
  repeated ColumnAspectReceipt aspects = 2;
  ComparisonIdentity current_subject = 3;
}
message ColumnAspectReceipt {
  ColumnAspect aspect = 1;
  oneof receipt {
    ColumnDifference difference = 2;
    ColumnNullability nullability = 3;
    ColumnSequenceDifferences sequence = 4;
  }
}
message ColumnDifference {
  enum Relation { RELATION_UNSPECIFIED = 0; SAME = 1; CHANGED = 2; }
  Relation relation = 1;
  string current = 2;
  string desired = 3;
}
message ColumnNullability { optional bool nullable = 1; }
message ColumnSequenceDifferences {
  repeated ColumnSequenceDifference changes = 1;
}
message ColumnSequenceDifference {
  enum Attribute { ATTRIBUTE_UNSPECIFIED = 0; IDENTITY_START = 1; IDENTITY_INCREMENT = 2; }
  Attribute attribute = 1;
  string current = 2;
  string desired = 3;
}
message ReadColumnDefaultsRequest {
  string engine = 1;
  ComparisonIdentifiers identifiers = 2;
  map<string, bool> capabilities = 3;
  repeated string target_features = 4;
  repeated ObservedColumnDefaultInput columns = 5;
}
message ObservedColumnDefaultInput {
  ComparisonIdentity subject = 1;
  ObservedColumn column = 2;
}
message ReadColumnDefaultsResult {
  bool complete = 1;
  repeated ColumnDefaultReceipt columns = 2;
}
message ColumnDefaultReceipt {
  ComparisonIdentity subject = 1;
  enum Kind { KIND_UNSPECIFIED = 0; ABSENT = 1; LITERAL = 2; EXPRESSION = 3; }
  Kind kind = 2;
  string value = 3;
}
