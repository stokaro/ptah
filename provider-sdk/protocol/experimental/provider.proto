// PlanningColumn describes the accepted common operation operand. It remains
// separate from a source declaration: defaults have explicit presence and enum
// identity comes from capture, never from the spelling of a type name.
message PlanningColumn {
  string name = 1;
  string type = 2;
  bool type_raw_sql = 3;
  bool type_is_declared_text = 4;
  bool enum_type = 5;
  bool nullable = 6;
  bool primary = 7;
  bool unique = 8;
  bool auto_increment = 9;
  string identity_generation = 10;
  string identity_start = 11;
  string identity_increment = 12;
  string identity_options = 13;
  PlanningDefault default = 14;
  string check = 15;
  string check_name = 16;
  bool check_not_enforced = 17;
  string not_null_constraint_name = 18;
  string generated_expression = 19;
  string generated_kind = 20;
  string collation = 21;
  string comment = 22;
  PlanningForeignKey foreign_key = 23;
  repeated CapturedFacet facets = 24;
}
message PlanningDefault { string value = 1; bool value_set = 2; string expression = 3; }
message PlanningForeignKey {
  string table = 1;
  string column = 2;
  repeated string columns = 3;
  string on_delete = 4;
  string on_update = 5;
  string name = 6;
  bool deferrable = 7;
  string initially = 8;
  string match = 9;
  bool not_enforced = 10;
  repeated CapturedFacet facets = 11;
}
// CapturedFacet retains a value or an explicit target exclusion in its exact
// common operand slot. Its enclosing operand supplies the grammatical owner.
message CapturedFacet {
  string kind = 1;
  repeated string targets = 2;
  NormalizedValue value = 3;
}

// HistoryScope binds a store to a live session and optionally its transaction.
// Schema and table are identifier components, never SQL fragments. A provider
// must validate storage ownership and layout before reading or adopting it.
message HistoryScope {
  enum Format { FORMAT_UNSPECIFIED = 0; NATIVE = 1; ATLAS = 2; }
  string session_id = 1;
  string transaction_id = 2;
  string schema = 3;
  string table = 4;
  Format format = 5;
}
// HistoryRevision carries stored facts. The host owns ordering, checksums,
// retry decisions, and recovery. Version preserves exact identity, including
// an empty Atlas identity. Native versions use canonical signed decimal text.
message HistoryRevision {
  enum State { STATE_UNSPECIFIED = 0; PENDING = 1; APPLIED = 2; FAILED = 3; }
  enum Direction { DIRECTION_UNSPECIFIED = 0; UP = 1; DOWN = 2; }
  string version = 1;
  string description = 2;
  // Native storage carries explicit state and direction. Atlas storage must
  // leave both unspecified; the host derives them from the stored facts.
  State state = 3;
  Direction direction = 4;
  uint64 applied = 5;
  uint64 total = 6;
  string error = 7;
  string error_statement = 8;
  int64 execution_nanoseconds = 9;
  string checksum = 10;
  // Unix time is split so the entire Go time range is not forced into int64
  // nanoseconds. Nanos is in [0, 999999999].
  int64 applied_at_seconds = 11;
  int32 applied_at_nanos = 12;
  string operator_version = 13;
  repeated string partial_hashes = 14;
  uint32 atlas_type = 15;
}
// ReadHistory returns a complete consistent snapshot or an error. A provider
// refuses a store exceeding max_revisions; truncation is never a valid reply.
message ReadHistoryRequest {
  HistoryScope scope = 1;
  uint32 max_revisions = 2;
}
message HistorySnapshot {
  HistoryScope scope = 1;
  bool exists = 2;
  bool complete = 3;
  repeated HistoryRevision revisions = 4;
}
// PrepareHistory creates missing storage and verifies existing storage. It
// does not upgrade an old layout or modify revision rows. Preparation runs
// outside transactions; engines with nontransactional DDL must support it too.
message PrepareHistoryRequest {
  HistoryScope scope = 1;
  string request_id = 2;
}
// MutateHistory is one atomic compare-and-swap. A missing expected row means
// insert only if absent; a missing replacement means delete the exact expected
// row. Replacing a row cannot change its version. No receipt permits replay.
// Under a caller transaction, APPLIED confirms the mutation, not its commit.
message MutateHistoryRequest {
  HistoryScope scope = 1;
  string request_id = 2;
  HistoryRevision expected = 3;
  HistoryRevision replacement = 4;
}
message HistoryResult {
  enum Outcome { UNKNOWN = 0; APPLIED = 1; CONFLICT = 2; REFUSED = 3; }
  HistoryScope scope = 1;
  string request_id = 2;
  Outcome outcome = 3;
  string diagnostic_code = 4;
  string message = 5;
}

// LockScope identifies one acquisition attempt within a live session. The name
// addresses the database's exclusion namespace; lock_id is never reused.
message LockScope {
  string session_id = 1;
  string lock_id = 2;
  string name = 3;
}
// Each RPC has a fresh request_id. TryLock is one nonblocking attempt, not a
// transport-managed wait or retry. Only a confirmed BUSY permits a new attempt.
message LockRequest {
  LockScope scope = 1;
  string request_id = 2;
}
// ACQUIRED confirms current ownership, never an indefinitely valid lease.
// NOT_ACQUIRED from ReleaseLock fences a delayed TryLock with the same handle.
// LOST is terminal: that session must refuse further execution and writes.
message LockResult {
  enum Outcome {
    UNKNOWN = 0;
    ACQUIRED = 1;
    BUSY = 2;
    RELEASED = 3;
    NOT_ACQUIRED = 4;
    LOST = 5;
  }
  LockScope scope = 1;
  string request_id = 2;
  Outcome outcome = 3;
}
