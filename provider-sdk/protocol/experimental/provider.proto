  bool unique = 7;
  bool primary = 8;
  string definition = 9;
  bool key_parts_incomplete = 10;
  string condition = 11;
  string comment = 12;
  bool invisible = 13;
  optional bool nulls_distinct = 14;
  string method = 15;
  repeated string include_columns = 16;
