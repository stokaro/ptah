# The two secrets every manifest here reads, and the only two values that must
# not appear in a pod's command line.
#
# A pod specification is readable by anything that can read the namespace, and
# `kubectl get pod -o yaml` prints the container's argv in full. So the database
# URL, which carries a password, and the provider token reach Ptah through the
# environment: every Ptah flag also reads a PTAH_-prefixed variable, and the
# specification names where the provider credential lives rather than what it
# is.
#
# Replace the values. `stringData` is plain text on purpose so this file is
# readable as an example; a real one comes from your secret manager.
apiVersion: v1
kind: Secret
metadata:
  name: ptah-inference-database
type: Opaque
stringData:
  # Read by --db-url through PTAH_DB_URL.
  url: postgres://ptah:replace-me@postgres.default.svc:5432/app?sslmode=require
---
apiVersion: v1
kind: Secret
metadata:
  name: ptah-inference-provider
type: Opaque
stringData:
  # Read by the specification's `credential: env:PTAH_EMBED_TOKEN`, which is a
  # reference to where the token lives rather than the token itself. Ptah never
  # writes this value to a report, a state table, an OCI artifact, or a log.
  token: replace-me
