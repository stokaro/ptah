name: Documentation
description: A page is wrong, missing, out of date, or hard to follow.
labels: ["documentation"]
body:
  - type: markdown
    attributes:
      value: |
        Give this issue a short title in plain English that names the documentation problem.

  - type: textarea
    id: detail
    attributes:
      label: Problem with the documentation
      description: >-
        In a short paragraph, explain what is wrong, missing, or hard to follow
        and why it matters to a reader. Use familiar words. Then quote the
        relevant text or describe what you tried and what happened.
    validations:
      required: true

  - type: input
    id: page
    attributes:
      label: Which page
      description: The URL, or the path under `docs/`.
      placeholder: "https://docs.ptah.run/edge/versioned/checkpoints/"
    validations:
      required: true

  - type: dropdown
    id: kind
    attributes:
      label: What is wrong with it
      options:
        - It states something that is not true
        - It is out of date
        - It is missing something a reader needs
        - It is accurate but hard to follow
        - A link, an example, or a command does not work
    validations:
      required: true
