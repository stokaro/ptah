name: Ptah migration plan
description: Generate and comment Ptah schema migration plans on pull requests.
inputs:
  version:
    description: Ptah release tag to download, or latest.
    required: false
    default: latest
  binary-path:
    description: Existing Ptah binary path. When set, release download is skipped.
    required: false
    default: ""
  setup-go:
    description: Set up the Go toolchain before running Ptah.
    required: false
    default: "true"
  go-version:
    description: >-
      Go version passed to actions/setup-go. Empty by default so the toolchain
      is read from go-version-file instead; set it only to override.
    required: false
    default: ""
  go-version-file:
    description: >-
      Go module file the toolchain is read from, relative to the calling
      repository. Used when go-version is empty.
    required: false
    default: go.mod
  dir:
    description: >
      Root directory scanned for Go schema entities, repeatable one per line.
      Empty selects no Go source unless nothing else is selected, in which case
      it falls back to the current directory.
    required: false
    default: ""
  schema-file:
    description: >
      SQL, YAML, HCL, DBML, or oci:// desired-schema source, one per line.
      Repeatable, and combines with the other source selectors.
    required: false
    default: ""
  schema-cmd:
    description: >
      External program whose standard output is the desired schema. Run without
      a shell and split on whitespace.
    required: false
    default: ""
  schema-format:
    description: "Format of the schema-cmd output: sql, hcl, or yaml."
    required: false
    default: ""
  db-url:
    description: Target database URL used to read the current schema.
    required: true
  dialect:
    description: Dialect passed to migrations lint. Empty runs every lint rule.
    required: false
    default: ""
  migration-dir:
    description: Migration directory passed to migrations lint.
    required: false
    default: migrations
  schemas:
    description: Comma-separated database schemas to inspect.
    required: false
    default: ""
  comment:
    description: Post or update a sticky pull request comment.
    required: false
    default: "true"
  lint:
    description: Run ptah migrations lint after planning.
    required: false
    default: "true"
  lint-fail-on:
    description: "Lint failure threshold: error, any, or none."
    required: false
    default: "error"
  allow-destructive:
    description: Allow destructive migration plans.
    required: false
    default: "false"
  output-dir:
    description: Directory for generated action reports.
    required: false
    default: ""
  generate:
    description: Write the migration files the plan describes into migration-dir.
    required: false
    default: "false"
  generate-name:
    description: Name passed to ptah migrations generate. Empty lets Ptah name it.
    required: false
    default: ""
outputs:
  plan-path:
    description: Path to the text migration plan report.
    value: ${{ steps.run.outputs.plan-path }}
  safety-path:
    description: Path to the JSON safety report.
    value: ${{ steps.run.outputs.safety-path }}
  safety-error-path:
    description: Path to stderr captured from the safety command.
    value: ${{ steps.run.outputs.safety-error-path }}
  lint-path:
    description: Path to the JSON lint report, when lint is enabled.
    value: ${{ steps.run.outputs.lint-path }}
  lint-error-path:
    description: Path to stderr captured from the lint command.
    value: ${{ steps.run.outputs.lint-error-path }}
  destructive:
    description: "true when the safety report contains destructive statements."
    value: ${{ steps.run.outputs.destructive }}
  generate-exit-code:
    description: Exit code of ptah migrations generate, or 0 when generate is off.
    value: ${{ steps.run.outputs.generate-exit-code }}
  generated-list-path:
    description: Path to a file listing the migration files generate wrote, one per line.
    value: ${{ steps.run.outputs.generated-list-path }}
  generated-count:
    description: How many migration files generate wrote.
    value: ${{ steps.run.outputs.generated-count }}
runs:
  using: composite
  steps:
    # Go is set up only when a Go source is in play. A run whose desired schema
    # is a SQL file has no reason to install a toolchain, and installing one
    # anyway is how "the action is source-neutral" stays false in practice.
    - name: Set up Go
      if: >-
        inputs.setup-go == 'true' &&
        (inputs.dir != '' ||
         (inputs.schema-file == '' && inputs.schema-cmd == ''))
      uses: actions/setup-go@v7
      with:
        go-version: ${{ inputs.go-version }}
        go-version-file: ${{ inputs.go-version == '' && inputs.go-version-file || '' }}
        cache: false

    - name: Install Ptah
      id: install
      shell: bash
      env:
        PTAH_VERSION: ${{ inputs.version }}
        PTAH_BINARY_PATH: ${{ inputs.binary-path }}
        GITHUB_TOKEN: ${{ github.token }}
        GITHUB_ACTION_PATH: ${{ github.action_path }}
      run: "$GITHUB_ACTION_PATH/install.sh"

    - name: Run Ptah checks
      id: run
      shell: bash
      env:
        PTAH_BIN: ${{ steps.install.outputs.ptah-bin }}
        INPUT_DIR: ${{ inputs.dir }}
        INPUT_SCHEMA_FILE: ${{ inputs.schema-file }}
        INPUT_SCHEMA_CMD: ${{ inputs.schema-cmd }}
        INPUT_SCHEMA_FORMAT: ${{ inputs.schema-format }}
        INPUT_DB_URL: ${{ inputs.db-url }}
        INPUT_DIALECT: ${{ inputs.dialect }}
        INPUT_MIGRATION_DIR: ${{ inputs.migration-dir }}
        INPUT_SCHEMAS: ${{ inputs.schemas }}
        INPUT_LINT: ${{ inputs.lint }}
        INPUT_LINT_FAIL_ON: ${{ inputs.lint-fail-on }}
        INPUT_ALLOW_DESTRUCTIVE: ${{ inputs.allow-destructive }}
        INPUT_OUTPUT_DIR: ${{ inputs.output-dir }}
        INPUT_GENERATE: ${{ inputs.generate }}
        INPUT_GENERATE_NAME: ${{ inputs.generate-name }}
        GITHUB_ACTION_PATH: ${{ github.action_path }}
      run: "$GITHUB_ACTION_PATH/run.sh"

    - name: Comment on pull request
      if: inputs.comment == 'true'
      uses: actions/github-script@v9
      env:
        PTAH_PLAN_PATH: ${{ steps.run.outputs.plan-path }}
        PTAH_SAFETY_PATH: ${{ steps.run.outputs.safety-path }}
        PTAH_SAFETY_ERROR_PATH: ${{ steps.run.outputs.safety-error-path }}
        PTAH_LINT_PATH: ${{ steps.run.outputs.lint-path }}
        PTAH_LINT_ERROR_PATH: ${{ steps.run.outputs.lint-error-path }}
        PTAH_PLAN_EXIT_CODE: ${{ steps.run.outputs.plan-exit-code }}
        PTAH_SAFETY_EXIT_CODE: ${{ steps.run.outputs.safety-exit-code }}
        PTAH_LINT_EXIT_CODE: ${{ steps.run.outputs.lint-exit-code }}
        PTAH_DESTRUCTIVE: ${{ steps.run.outputs.destructive }}
        PTAH_GENERATED_LIST_PATH: ${{ steps.run.outputs.generated-list-path }}
        PTAH_ACTION_PATH: ${{ github.action_path }}
      with:
        script: |
          const run = require(`${process.env.PTAH_ACTION_PATH}/comment.js`);
          await run({ github, context, core });

    - name: Set destructive-change check run
      uses: actions/github-script@v9
      env:
        PTAH_SAFETY_PATH: ${{ steps.run.outputs.safety-path }}
        PTAH_SAFETY_ERROR_PATH: ${{ steps.run.outputs.safety-error-path }}
        PTAH_LINT_PATH: ${{ steps.run.outputs.lint-path }}
        PTAH_LINT_ERROR_PATH: ${{ steps.run.outputs.lint-error-path }}
        PTAH_PLAN_EXIT_CODE: ${{ steps.run.outputs.plan-exit-code }}
        PTAH_SAFETY_EXIT_CODE: ${{ steps.run.outputs.safety-exit-code }}
        PTAH_LINT_EXIT_CODE: ${{ steps.run.outputs.lint-exit-code }}
        PTAH_DESTRUCTIVE: ${{ steps.run.outputs.destructive }}
        PTAH_ACTION_PATH: ${{ github.action_path }}
      with:
        script: |
          const run = require(`${process.env.PTAH_ACTION_PATH}/check-run.js`);
          await run({ github, context, core });

    - name: Fail on Ptah errors
      shell: bash
      env:
        PLAN_EXIT_CODE: ${{ steps.run.outputs.plan-exit-code }}
        SAFETY_EXIT_CODE: ${{ steps.run.outputs.safety-exit-code }}
        LINT_EXIT_CODE: ${{ steps.run.outputs.lint-exit-code }}
      run: |
        if [[ "$PLAN_EXIT_CODE" != "0" ]]; then
          exit "$PLAN_EXIT_CODE"
        fi
        if [[ "$SAFETY_EXIT_CODE" != "0" ]]; then
          exit "$SAFETY_EXIT_CODE"
        fi
        if [[ "$LINT_EXIT_CODE" != "0" ]]; then
          exit "$LINT_EXIT_CODE"
        fi
