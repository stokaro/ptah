name: testkit

on:
  push:
    branches: [master]
  # testkit uses `replace go.5x5.cz/ptah => ..` and exercises root behavior, so
  # no root path subset can safely determine that a pull request is irrelevant.
  pull_request:

env:
  GOWORK: off

jobs:
  sqlite:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Test testkit SQLite helpers
        working-directory: testkit
        run: go test ./...

  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Test testkit container helpers
        run: >-
          go run ./internal/cmd/testcontour
          --dir ./testkit
          --tags integration
          --timeout 10m

  tidy:
    name: testkit module is tidy against the root
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # testkit is a separate module that reaches the root through
      # `replace go.5x5.cz/ptah => ..`, so a root dependency bump leaves its
      # go.mod and go.sum behind. Every other job in this file loads that
      # module and so every one of them fails when it happens, with "go:
      # updates to go.mod needed" -- and the lint jobs in another workflow fail
      # too, reporting the same load failure as "qtlint: ./... matched no
      # packages", which names neither the module nor the fix.
      #
      # This job names both, in one line, for the cost of a checkout. It is
      # deliberately not the sync workflow's job: that one repairs a bot's
      # branch and cannot run on a human's, while this one has to be true of
      # every pull request.
      - name: Check that go mod tidy would change nothing
        working-directory: testkit
        env:
          GOFLAGS: "-mod=mod"
        run: |
          set -euo pipefail
          go mod tidy
          if git diff --quiet -- go.mod go.sum; then
            echo "testkit module is tidy against the root."
            exit 0
          fi
          echo "::error file=testkit/go.mod::testkit is stale against the root module. Run 'cd testkit && go mod tidy' and commit the result."
          git --no-pager diff -- go.mod go.sum
          exit 1

  published-pin:
    name: Resolve the published root module without replace
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # testkit requires the root module AND replaces it with `..`, so every
      # other job here builds against the working tree and proves nothing about
      # the version in the require line. That version can name a release that
      # does not exist -- after the move to go.5x5.cz/ptah it named v0.1.2,
      # which was only ever published under the old path and can never resolve
      # under the new one. The replace hid that completely.
      #
      # This job drops the replace and builds against the module proxy, so the
      # require line has to name a release an external consumer can actually
      # fetch. It fails loudly the moment the pin becomes fiction again.
      - name: Build against the published module
        working-directory: testkit
        run: |
          set -euo pipefail
          grep -v '^replace go\.5x5\.cz/ptah => \.\.$' go.mod > go.mod.published
          mv go.mod.published go.mod
          # -mod=mod so the checked-in go.sum, which only covers the replaced
          # local module, may gain the published module's entry. Without it the
          # build fails on a missing go.sum line whatever the pin says, which
          # would make this job red for a reason unrelated to what it checks.
          GOFLAGS=-mod=mod go build ./...
