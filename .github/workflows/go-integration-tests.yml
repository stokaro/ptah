name: Integration Tests

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  integration-tests:
    name: integration-tests
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: ptah_test
          POSTGRES_USER: ptah_user
          POSTGRES_PASSWORD: ptah_password
        options: >-
          --health-cmd "pg_isready -U ptah_user -d ptah_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      mysql:
        image: mysql:9.7
        env:
          MYSQL_DATABASE: ptah_test
          MYSQL_USER: ptah_user
          MYSQL_PASSWORD: ptah_password
          MYSQL_ROOT_PASSWORD: root_password
        options: >-
          --health-cmd "mysqladmin ping -h localhost -u ptah_user -pptah_password"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --tmpfs /var/lib/mysql:rw,noexec,nosuid,size=1024m
        ports:
          - 3306:3306

      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_DATABASE: ptah_test
          MARIADB_USER: ptah_user
          MARIADB_PASSWORD: ptah_password
          MARIADB_ROOT_PASSWORD: root_password
        options: >-
          --health-cmd "mysqladmin ping -h localhost -u ptah_user -pptah_password"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --tmpfs /var/lib/mysql:rw,noexec,nosuid,size=1024m
        ports:
          - 3307:3306

      clickhouse:
        image: clickhouse/clickhouse-server:26.7
        env:
          CLICKHOUSE_DB: ptah_test
          CLICKHOUSE_USER: ptah_user
          CLICKHOUSE_PASSWORD: ptah_password
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
        options: >-
          --health-cmd "wget --no-verbose --tries=1 --spider http://localhost:8123/ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 8123:8123
          - 9000:9000

      clickhouse-legacy:
        # Pinned below 24.11 on purpose. CHECK GRANT catalog visibility arrived
        # in 24.11, and TestWriterDropDatabaseRealm_RejectsLegacyServerLive
        # proves the realm-drop guard fails closed without it. Bumping this tag
        # deletes that coverage silently, so renovate.json disables updates for
        # this pin.
        image: clickhouse/clickhouse-server:24.10
        env:
          CLICKHOUSE_DB: ptah_test
          CLICKHOUSE_USER: ptah_user
          CLICKHOUSE_PASSWORD: ptah_password
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
        options: >-
          --health-cmd "wget --no-verbose --tries=1 --spider http://localhost:8123/ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 8124:8123
          - 9001:9000

      sqlserver:
        image: mcr.microsoft.com/mssql/server:2025-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_PID: "Developer"
          MSSQL_SA_PASSWORD: "P@ssw0rd-ptah-2026"
        options: >-
          --health-cmd "sqlcmd=/opt/mssql-tools18/bin/sqlcmd; if [ ! -x $sqlcmd ]; then sqlcmd=/opt/mssql-tools/bin/sqlcmd; fi; $sqlcmd -S localhost -U sa -P \"$MSSQL_SA_PASSWORD\" -No -Q \"SELECT 1\""
          --health-interval 10s
          --health-timeout 5s
          --health-retries 18
        ports:
          - 1433:1433

      registry:
        image: registry:3
        ports:
          - 5000:5000

    steps:
      - uses: actions/checkout@v7
      
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.5'
          cache: true
          cache-dependency-path: go.sum
      
      - name: Install dependencies
        run: go mod download

      - name: Start distributed SQL databases
        run: |
          docker run --detach --name ptah-cockroachdb \
            --publish 26257:26257 \
            cockroachdb/cockroach:v26.2.4 \
            start-single-node --insecure --advertise-addr=localhost:26257

          docker run --detach --name ptah-yugabytedb \
            --publish 5433:5433 \
            yugabytedb/yugabyte:2026.1.0.0-b118 \
            bash -lc 'ip=$(hostname -i); ip=${ip%% *}; exec bin/yugabyted start --daemon=false --advertise_address=$ip --ui=false'

      - name: Wait for databases to be ready
        run: |
          echo "Waiting for PostgreSQL..."
          until pg_isready -h localhost -p 5432 -U ptah_user; do
            echo "PostgreSQL is unavailable - sleeping"
            sleep 2
          done
          echo "PostgreSQL is ready!"
          
          echo "Waiting for MySQL..."
          until mysqladmin ping -h 127.0.0.1 -P 3306 -u ptah_user -pptah_password --silent; do
            echo "MySQL is unavailable - sleeping"
            sleep 2
          done
          echo "MySQL is ready!"
          
          echo "Waiting for MariaDB..."
          until mysqladmin ping -h 127.0.0.1 -P 3307 -u ptah_user -pptah_password --silent; do
            echo "MariaDB is unavailable - sleeping"
            sleep 2
          done
          echo "MariaDB is ready!"

          echo "Waiting for ClickHouse..."
          until curl --silent --fail http://127.0.0.1:8123/ping; do
            echo "ClickHouse is unavailable - sleeping"
            sleep 2
          done
          echo "ClickHouse is ready!"

          echo "Waiting for legacy ClickHouse..."
          until curl --silent --fail http://127.0.0.1:8124/ping; do
            echo "Legacy ClickHouse is unavailable - sleeping"
            sleep 2
          done
          echo "Legacy ClickHouse is ready!"

          echo "Waiting for CockroachDB..."
          until docker exec ptah-cockroachdb /cockroach/cockroach sql --insecure --host=127.0.0.1:26257 --execute="SELECT 1"; do
            echo "CockroachDB is unavailable - sleeping"
            sleep 2
          done
          echo "CockroachDB is ready!"

          echo "Waiting for YugabyteDB..."
          until docker exec ptah-yugabytedb bash -lc 'ip=$(hostname -i); ip=${ip%% *}; bin/ysqlsh -h "$ip" -p 5433 -U yugabyte -d yugabyte -c "SELECT 1"'; do
            echo "YugabyteDB is unavailable - sleeping"
            sleep 5
          done
          echo "YugabyteDB is ready!"

          echo "Waiting for OCI registry..."
          until curl --silent --fail http://127.0.0.1:5000/v2/; do
            echo "OCI registry is unavailable - sleeping"
            sleep 2
          done
          echo "OCI registry is ready!"
      
      - name: Run executor integration tests with live databases
        env:
          POSTGRES_TEST_DSN: "postgres://ptah_user:ptah_password@localhost:5432/ptah_test?sslmode=disable"
          MYSQL_TEST_DSN: "ptah_user:ptah_password@tcp(127.0.0.1:3306)/ptah_test"
          MYSQL_CLEANUP_TEST_DSN: "root:root_password@tcp(127.0.0.1:3306)/ptah_test"
          MARIADB_TEST_DSN: "ptah_user:ptah_password@tcp(127.0.0.1:3307)/ptah_test"
          COCKROACHDB_TEST_DSN: "postgresql://root@localhost:26257/defaultdb?sslmode=disable"
          YUGABYTEDB_TEST_DSN: "postgresql://yugabyte@localhost:5433/yugabyte?sslmode=disable"
          COCKROACHDB_URL: "cockroachdb://root@localhost:26257/defaultdb?sslmode=disable"
          YUGABYTEDB_URL: "yugabytedb://yugabyte@localhost:5433/yugabyte?sslmode=disable"
          SQLSERVER_TEST_DSN: "sqlserver://sa:P%40ssw0rd-ptah-2026@localhost:1433?database=master&encrypt=disable"
          POSTGRES_TEST_URL: "postgres://ptah_user:ptah_password@localhost:5432/ptah_test?sslmode=disable"
          MYSQL_TEST_URL: "mysql://ptah_user:ptah_password@tcp(127.0.0.1:3306)/ptah_test"
          MYSQL_ADMIN_TEST_DSN: "root:root_password@tcp(127.0.0.1:3306)/mysql"
          MYSQL_ADMIN_TEST_URL: "mysql://root:root_password@tcp(127.0.0.1:3306)/mysql"
          PTAH_SQLSERVER_TEST_URL: "sqlserver://sa:P%40ssw0rd-ptah-2026@localhost:1433?database=master&encrypt=disable"
          POSTGRES_URL: "postgres://ptah_user:ptah_password@localhost:5432/ptah_test?sslmode=disable"
          MYSQL_URL: "mysql://ptah_user:ptah_password@tcp(127.0.0.1:3306)/ptah_test"
          MARIADB_URL: "mariadb://ptah_user:ptah_password@tcp(127.0.0.1:3307)/ptah_test"
          MARIADB_ADMIN_TEST_DSN: "root:root_password@tcp(127.0.0.1:3307)/mysql"
          MARIADB_ADMIN_TEST_URL: "mariadb://root:root_password@tcp(127.0.0.1:3307)/mysql"
          PTAH_CLICKHOUSE_REALM_TEST_URL: "clickhouse://ptah_user:ptah_password@localhost:9000/ptah_test"
          PTAH_CLICKHOUSE_LEGACY_REALM_TEST_URL: "clickhouse://ptah_user:ptah_password@localhost:9001/ptah_test"
          PTAH_SQLSERVER_REALM_TEST_URL: "sqlserver://sa:P%40ssw0rd-ptah-2026@localhost:1433?database=master&encrypt=disable"
          PTAH_OCI_TEST_REGISTRY: "127.0.0.1:5000"
        run: |
          go test -v -count=1 ./integration -tags=integration -timeout 15m
          go test -v -count=1 ./integration/gonative -tags=integration -timeout 15m
          go test -v -count=1 ./dbschema -run 'TestSQLServerLive(ReadSchema|DropAllTablesDropsForeignKeys|ComputedColumnZeroDiff|DropAllTablesRejectsExternalForeignKeys|IdentifierSemantics_)' -timeout 3m
          go test -v -count=1 ./migration/migrator -run 'TestSQLServerMigratorHonorsURLSchemaForMetadata|TestMigrationAdvisoryLock_SQLServer(DefaultTimeout|Timeout)Integration|TestAtlasRevisionMetadata_SQLServerIntegration|TestAtlasTxtarChecks_SQLServer(SequenceDoesNotAdvance)?Integration|TestDryRunRevisionState_SQLServerIntegration' -timeout 3m
          go test -v -count=1 ./migration/generator -run 'TestGenerateMigration_SQLServerIndexDirectionRoundTrip|TestShadowIdentifierSemanticsMatch_SQLServerLive' -timeout 5m

      # The reverse plan for views, materialized views and triggers is decided
      # by what PostgreSQL accepts, and rendering the rollback proves only that
      # a statement exists. This applies it. The test is behind the integration
      # build tag in ./migration/generator, which no other step in this file
      # compiles, so without this step the only live gate for the rollback would
      # run nowhere.
      - name: Run reverse view-like rollback round trip
        env:
          POSTGRES_URL: "postgres://ptah_user:ptah_password@localhost:5432/ptah_test?sslmode=disable"
        run: |
          go test -tags=integration ./migration/generator -list '^TestReverseViewLikeObjects_DownRoundTrip_Integration$' | grep -q '^TestReverseViewLikeObjects_DownRoundTrip_Integration$'
          go test -v -count=1 -tags=integration ./migration/generator -run '^TestReverseViewLikeObjects_DownRoundTrip_Integration$' -timeout 5m

      # The rollback of a migration that DROPS a table has to re-create it, and
      # the version this gate was added for rendered a perfectly good CREATE
      # TABLE and was then refused at `ALTER TABLE ... ADD PRIMARY KEY` because
      # the re-created table already carried one. Only a server can say that.
      # The -list line is the same guard the step above uses: a test that stopped
      # existing must fail here rather than be silently not run.
      - name: Run dropped-table rollback round trip
        env:
          POSTGRES_URL: "postgres://ptah_user:ptah_password@localhost:5432/ptah_test?sslmode=disable"
        run: |
          go test -tags=integration ./migration/generator -list '^TestReverseRecreatedTable_DropTableRollbackApplies_Integration$' | grep -q '^TestReverseRecreatedTable_DropTableRollbackApplies_Integration$'
          go test -v -count=1 -tags=integration ./migration/generator -run '^TestReverseRecreatedTable_DropTableRollbackApplies_Integration$' -timeout 5m

      - name: Run database-realm cleanup and replay tests
        env:
          POSTGRES_TEST_DSN: "postgres://ptah_user:ptah_password@localhost:5432/ptah_test?sslmode=disable"
          POSTGRES_URL: "postgres://ptah_user:ptah_password@localhost:5432/ptah_test?sslmode=disable"
          COCKROACHDB_URL: "cockroachdb://root@localhost:26257/defaultdb?sslmode=disable"
          YUGABYTEDB_URL: "yugabytedb://yugabyte@localhost:5433/yugabyte?sslmode=disable"
          MYSQL_TEST_URL: "mysql://ptah_user:ptah_password@tcp(127.0.0.1:3306)/ptah_test"
          MARIADB_TEST_URL: "mariadb://ptah_user:ptah_password@tcp(127.0.0.1:3307)/ptah_test"
          CLICKHOUSE_URL: "clickhouse://ptah_user:ptah_password@localhost:9000/ptah_test"
          PTAH_SQLSERVER_TEST_URL: "sqlserver://sa:P%40ssw0rd-ptah-2026@localhost:1433?database=master&encrypt=disable"
          MYSQL_ADMIN_TEST_DSN: "root:root_password@tcp(127.0.0.1:3306)/mysql"
          MYSQL_ADMIN_TEST_URL: "mysql://root:root_password@tcp(127.0.0.1:3306)/mysql"
          MARIADB_ADMIN_TEST_DSN: "root:root_password@tcp(127.0.0.1:3307)/mysql"
          MARIADB_ADMIN_TEST_URL: "mariadb://root:root_password@tcp(127.0.0.1:3307)/mysql"
          PTAH_CLICKHOUSE_REALM_TEST_URL: "clickhouse://ptah_user:ptah_password@localhost:9000/ptah_test"
          PTAH_CLICKHOUSE_LEGACY_REALM_TEST_URL: "clickhouse://ptah_user:ptah_password@localhost:9001/ptah_test"
          PTAH_SQLSERVER_REALM_TEST_URL: "sqlserver://sa:P%40ssw0rd-ptah-2026@localhost:1433?database=master&encrypt=disable"
        run: |
          go test -v -count=1 ./internal/dblock -run '^TestAdvisoryLock_PostgresFamilyLive$' -timeout 3m
          go test -v -count=1 ./internal/devlock -run '^Test(Acquire_CockroachDBSerializesSameRealmLive|SameRealm_(PostgresDriverURLOverridesLive|NetworkDatabasesLive))$' -timeout 3m
          go test -v -count=1 ./migration/generator -run '^TestVerifyRollbackFromShadow_FailurePathRejects(DriverOverrideAliasLive|LiveDialectMismatch)$' -timeout 3m
          go test -v -count=1 ./internal/dbschema/mysql -tags=integration -run '^TestWriterDropDatabaseRealm_Live(RejectsProtectedDatabase|RejectsExternalStoredProgram|RejectsMissingTriggerPrivilege)$' -timeout 3m
          go test -v -count=1 ./internal/dbschema/clickhouse -run '^TestWriterDropDatabaseRealm_(Live|RejectsExternalDependencyLive|RejectsLegacyServerLive)$' -timeout 3m
          go test -v -count=1 ./internal/dbschema/mssql -run '^TestWriterDropDatabaseRealm_(Live|RejectsDatabaseScopedArtifactLive|RejectsPreservedSchemaPermissionLive)$' -timeout 3m
          go test -v -count=1 ./internal/dbschema/postgres -tags=integration -run '^TestWriterDropDatabaseRealm_Live(PostgresFamilyCleansCrossSchemaGraph|PostgresCleansLargeObjects|PostgresRejectsPublication|RejectsProtectedDatabase)$' -timeout 5m
          go test -v -count=1 ./internal/schemaclean -tags=integration -run '^TestInspectNamesEveryObjectApplyDestroys_PostgresLive$' -timeout 5m
          go test -v -count=1 ./internal/migrationreplay -tags=integration -run '^TestWithReplayedSnapshot_(ClickHouse|SQLServer)Live$' -timeout 5m
          go test -v -count=1 ./integration -tags=integration -run '^TestAtlasMigrateDiff(MySQLFamilyDatabaseDesiredState|PostgresFamilyDevCleanup)E2E$' -timeout 12m

      # These two skip themselves without a live PostgreSQL, and a skip reads as
      # a pass, so the log is grepped for the PASS lines afterwards.
      - name: Run compatibility apply table-spelling tests
        env:
          POSTGRES_TEST_DSN: "postgres://ptah_user:ptah_password@localhost:5432/ptah_test?sslmode=disable"
        run: |
          go test -v -count=1 ./cmd/atlas -run '^TestSchemaApplyRLS(ReferenceToUndeclaredRelationRefused|DeclaredRelationAccepted)LivePostgres$' -timeout 5m > rls-spelling.log || { cat rls-spelling.log; exit 1; }
          cat rls-spelling.log
          grep -q -- '--- PASS: TestSchemaApplyRLSReferenceToUndeclaredRelationRefusedLivePostgres' rls-spelling.log
          grep -q -- '--- PASS: TestSchemaApplyRLSDeclaredRelationAcceptedLivePostgres' rls-spelling.log

      - name: Build integration test binary
        run: |
          go build -race -o ./integration-test ./cmd/integration-test

      - name: Test integration binary help
        run: |
          ./integration-test --help

      - name: Run basic smoke test
        env:
          POSTGRES_URL: "postgres://ptah_user:ptah_password@localhost:5432/ptah_test?sslmode=disable"
        run: |
          ./integration-test --scenarios=apply_incremental_migrations,check_current_version --databases=postgres --report=stdout,txt,json,html --output=./reports

      - name: Run migrator safety integration tests
        env:
          POSTGRES_TEST_DSN: "postgres://ptah_user:ptah_password@localhost:5432/ptah_test?sslmode=disable"
          MYSQL_TEST_URL: "mysql://ptah_user:ptah_password@tcp(127.0.0.1:3306)/ptah_test"
          MARIADB_TEST_URL: "mariadb://ptah_user:ptah_password@tcp(127.0.0.1:3307)/ptah_test"
          CLICKHOUSE_URL: "clickhouse://ptah_user:ptah_password@localhost:9000/ptah_test"
          COCKROACHDB_TEST_DSN: "postgresql://root@localhost:26257/defaultdb?sslmode=disable"
          YUGABYTEDB_TEST_DSN: "postgresql://yugabyte@localhost:5433/yugabyte?sslmode=disable"
        run: |
          go test -v -count=1 ./migration/migrator -run 'TestMigrateUp_PostgresLockTimeoutIntegration|TestOutOfOrderMigrationsPostgresIntegration|TestMigrationAdvisoryLock_PostgresConcurrentRunners|TestMigrationAdvisoryLock_PostgresTimeoutIntegration|TestMigrationAdvisoryLock_MySQLDefaultTimeoutIntegration|TestMigrationAdvisoryLock_MariaDBDefaultTimeoutIntegration|TestDirtyMigrationState_PostgresFailureRollsBackAndBlocksRetry|TestDirtyMigrationState_MySQLRepairReachesHead|TestDirtyMigrationState_MariaDBRepairReachesHead|TestMigrationChecksumMismatch_PostgresIntegration|TestBaseline_|TestAtlasRevisionMetadata_(Postgres|MySQL|MariaDB|CockroachDB|YugabyteDB|ClickHouseRejectsSet)Integration|TestAtlasDotMetadata_(Postgres|MySQL)Integration|TestAtlasTxtarChecks_((Postgres|MySQL|MariaDB)(SessionLockReleased|CommentSemantics|EscapeString|ExecutableCommentEscape|ShortNumericPrefixRejectsNonSelect)?|ClickHouse|CockroachDB|YugabyteDB)Integration|TestAtlasRevisionTable_(Postgres|CockroachDB|YugabyteDB)UsesTimestamptzIntegration|TestAtlasSetSerializable_PostgresConcurrentInsertIntegration|TestDryRunRevisionState_(Postgres|MySQL|MariaDB|CockroachDB|YugabyteDB|ClickHouse)Integration' -timeout 3m

      - name: Run MySQL-family rolled-back progress tests
        env:
          MYSQL_TEST_URL: "mysql://ptah_user:ptah_password@tcp(127.0.0.1:3306)/ptah_test"
          MYSQL_ADMIN_TEST_URL: "mysql://root:root_password@tcp(127.0.0.1:3306)/ptah_test"
          MARIADB_TEST_URL: "mariadb://ptah_user:ptah_password@tcp(127.0.0.1:3307)/ptah_test"
          MARIADB_ADMIN_TEST_URL: "mariadb://root:root_password@tcp(127.0.0.1:3307)/ptah_test"
        run: |
          go test ./migration/migrator -list '^TestRolledBackProgress_MySQLDDLThenDMLKeepsTheWholeDurablePrefix$' | grep -q '^TestRolledBackProgress_MySQLDDLThenDMLKeepsTheWholeDurablePrefix$'
          go test ./migration/migrator -list '^TestRolledBackProgress_MariaDBDDLThenDMLKeepsTheWholeDurablePrefix$' | grep -q '^TestRolledBackProgress_MariaDBDDLThenDMLKeepsTheWholeDurablePrefix$'
          go test ./migration/migrator -list '^TestRolledBackProgress_MySQLRejectsUnwitnessedExecutionBoundaries$' | grep -q '^TestRolledBackProgress_MySQLRejectsUnwitnessedExecutionBoundaries$'
          go test ./migration/migrator -list '^TestRolledBackProgress_MariaDBRejectsUnwitnessedExecutionBoundaries$' | grep -q '^TestRolledBackProgress_MariaDBRejectsUnwitnessedExecutionBoundaries$'
          go test ./migration/migrator -list '^TestRolledBackProgress_MySQLRejectsTransactionControl$' | grep -q '^TestRolledBackProgress_MySQLRejectsTransactionControl$'
          go test ./migration/migrator -list '^TestRolledBackProgress_MariaDBRejectsTransactionControl$' | grep -q '^TestRolledBackProgress_MariaDBRejectsTransactionControl$'
          go test ./migration/migrator -list '^TestRolledBackProgress_MySQLWithoutTriggerPrivilegeFailsClosed$' | grep -q '^TestRolledBackProgress_MySQLWithoutTriggerPrivilegeFailsClosed$'
          go test ./migration/migrator -list '^TestRolledBackProgress_MariaDBWithoutTriggerPrivilegeStillRejectsTriggeredRelation$' | grep -q '^TestRolledBackProgress_MariaDBWithoutTriggerPrivilegeStillRejectsTriggeredRelation$'
          go test ./migration/migrator -list '^TestRolledBackProgress_MySQLDefaultRoleTriggerPrivilegeIsAccepted$' | grep -q '^TestRolledBackProgress_MySQLDefaultRoleTriggerPrivilegeIsAccepted$'
          go test -v -count=1 ./migration/migrator -run '^TestRolledBackProgress_' -timeout 5m

      - name: Run no-transaction and shadow generator integration tests
        env:
          POSTGRES_TEST_DSN: "postgres://ptah_user:ptah_password@localhost:5432/ptah_test?sslmode=disable"
          POSTGRES_URL: "postgres://ptah_user:ptah_password@localhost:5432/ptah_test?sslmode=disable"
          CLICKHOUSE_URL: "clickhouse://ptah_user:ptah_password@localhost:9000/ptah_test"
        run: |
          go test ./migration/migrator -list '^TestNoTransactionDirective_PostgresEnumValueCanBeUsedInSameMigration$' | grep -q '^TestNoTransactionDirective_PostgresEnumValueCanBeUsedInSameMigration$'
          go test ./migration/migrator -list '^TestNoTransactionCheckpoint_ClickHouse(Ptah|Atlas)RevisionIsVisibleToObserver$' | grep -q '^TestNoTransactionCheckpoint_ClickHousePtahRevisionIsVisibleToObserver$'
          go test ./migration/migrator -list '^TestNoTransactionCheckpoint_ClickHouse(Ptah|Atlas)RevisionIsVisibleToObserver$' | grep -q '^TestNoTransactionCheckpoint_ClickHouseAtlasRevisionIsVisibleToObserver$'
          go test ./migration/migrator -list '^TestNoTransactionRepair_ClickHouseAtlasRevisionAfterManualReconciliation$' | grep -q '^TestNoTransactionRepair_ClickHouseAtlasRevisionAfterManualReconciliation$'
          go test ./migration/generator -list '^TestGenerateMigrationShadowVerificationWithRealDB$' | grep -q '^TestGenerateMigrationShadowVerificationWithRealDB$'
          go test ./migration/generator -list '^TestGenerateMigration_ConcurrentIndexApplyAndRollbackWithRealPostgres$' | grep -q '^TestGenerateMigration_ConcurrentIndexApplyAndRollbackWithRealPostgres$'
          go test -v -count=1 ./migration/migrator -run '^TestNoTransaction(Directive_PostgresEnumValueCanBeUsedInSameMigration|Checkpoint_ClickHouse(Ptah|Atlas)RevisionIsVisibleToObserver|Repair_ClickHouseAtlasRevisionAfterManualReconciliation)$' -timeout 3m
          go test -v -count=1 ./migration/generator -run '^TestGenerateMigration(ShadowVerificationWithRealDB|_ConcurrentIndexApplyAndRollbackWithRealPostgres)$' -timeout 5m
          go test ./cmd/migrateup -list '^TestMigrateUp_LintConfigSeverityOverrideControlsPostgresMigration$' | grep -q '^TestMigrateUp_LintConfigSeverityOverrideControlsPostgresMigration$'
          go test ./cmd/migrateup -list '^TestMigrateUp_LintConfigWarningStillBlocksPostgresDropTable$' | grep -q '^TestMigrateUp_LintConfigWarningStillBlocksPostgresDropTable$'
          go test -v -count=1 ./cmd/migrateup -run '^TestMigrateUp_LintConfig(SeverityOverrideControlsPostgresMigration|WarningStillBlocksPostgresDropTable)$' -timeout 3m

      - name: Run migrate-baseline integration tests
        env:
          POSTGRES_TEST_DSN: "postgres://ptah_user:ptah_password@localhost:5432/ptah_test?sslmode=disable"
        run: |
          go test -v -count=1 ./cmd/migratebaseline -run 'TestVerifyBaselineShadowPostgres|TestMigrateBaselineCommandPostgresWritesMetadataWithoutExecutingDDL' -timeout 3m

      - name: Run all databases comprehensive test
        env:
          POSTGRES_URL: "postgres://ptah_user:ptah_password@localhost:5432/ptah_test?sslmode=disable"
          MYSQL_URL: "mysql://ptah_user:ptah_password@tcp(127.0.0.1:3306)/ptah_test"
          MYSQL_CLEANUP_URL: "mysql://root:root_password@tcp(127.0.0.1:3306)/ptah_test"
          MARIADB_URL: "mariadb://ptah_user:ptah_password@tcp(127.0.0.1:3307)/ptah_test"
          MARIADB_CLEANUP_URL: "mariadb://root:root_password@tcp(127.0.0.1:3307)/ptah_test"
          CLICKHOUSE_URL: "clickhouse://ptah_user:ptah_password@localhost:9000/ptah_test"
          COCKROACHDB_URL: "cockroachdb://root@localhost:26257/defaultdb?sslmode=disable"
