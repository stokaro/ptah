name: Go Fuzz

on:
  push:
    branches:
      - master
  pull_request:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    name: fuzz
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Install dependencies
        run: go mod download

      - name: Verify fuzz targets
        run: |
          go test -list '^Fuzz' ./internal/lexer | grep '^FuzzLexer$'
          go test -list '^Fuzz' ./internal/parser | grep '^FuzzParseSQL$'

      - name: Select fuzz duration
        id: fuzz-duration
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "fuzztime=10m" >> "$GITHUB_OUTPUT"
          else
            echo "fuzztime=30s" >> "$GITHUB_OUTPUT"
          fi

      # Both targets run through scripts/run-fuzz.sh, which tells a finding
      # apart from the -fuzztime clock running out mid-execution. Its selftest
      # proves it still fails on a written corpus entry, a panic and a mixed
      # failure, so the wrapper cannot quietly turn red into green.
      - name: Check the fuzz wrapper
        run: scripts/run-fuzz-selftest.sh

      - name: Fuzz lexer
        run: scripts/run-fuzz.sh FuzzLexer ${{ steps.fuzz-duration.outputs.fuzztime }} ./internal/lexer

      - name: Fuzz parser
        run: scripts/run-fuzz.sh FuzzParseSQL ${{ steps.fuzz-duration.outputs.fuzztime }} ./internal/parser
