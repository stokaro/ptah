name: Go Fuzz

on:
  push:
    branches:
      - master
  pull_request:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: go-fuzz-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scope:
    name: scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.decide.outputs.code }}
      reason: ${{ steps.decide.outputs.reason }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Self-test the scope rule
        run: scripts/ci-diff-scope.sh --selftest

      - name: Decide whether this diff can affect Go validation
        id: decide
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "reason=not a pull request, so everything runs" >> "$GITHUB_OUTPUT"
            echo "ci-diff-scope: code=true (not a pull request)"
            exit 0
          fi
          scripts/ci-diff-scope.sh \
            "${{ github.event.pull_request.base.sha }}" \
            "${{ github.event.pull_request.head.sha }}"

      - name: Report the decision in the job summary
        run: |
          {
            printf '### Go validation scope\n\n'
            printf -- "- run Go validation: \`%s\`\n" "${{ steps.decide.outputs.code }}"
            printf -- '- because: %s\n' "${{ steps.decide.outputs.reason }}"
          } >> "$GITHUB_STEP_SUMMARY"

  fuzz:
    name: fuzz
    needs: scope
    if: github.event_name != 'pull_request' || needs.scope.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Install dependencies
        run: go mod download

      - name: Verify fuzz targets
        run: |
          go test -list '^Fuzz' ./internal/lexer | grep '^FuzzLexer$'
          go test -list '^Fuzz' ./internal/parser | grep '^FuzzParseSQL$'

      - name: Select fuzz duration
        id: fuzz-duration
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "fuzztime=10m" >> "$GITHUB_OUTPUT"
          else
            echo "fuzztime=30s" >> "$GITHUB_OUTPUT"
          fi

      # Both targets run through scripts/run-fuzz.sh, which tells a finding
      # apart from the -fuzztime clock running out mid-execution.
      #
      # What the selftest proves is the property the wrapper needs and not a
      # list of failures somebody thought of: a nonzero run is turned green only
      # when EVERY line of its transcript is one a bare deadline explains, so an
      # unrecognized shape stays red. It used to look for known-bad ones
      # instead, and `fatal error: concurrent map writes` beside the deadline
      # named no panic, no race, no source location and no second --- FAIL, so
      # it laundered into a green job (stokaro/ptah#2501).
      #
      # The rows: a written corpus entry, a panic, a mixed failure, a runtime
      # fatal, a deadlock and a killed process all stay red, and a deadline-only
      # transcript still passes both bare and among the progress lines a real
      # run prints -- the second control is what keeps "refuse everything" from
      # satisfying the rest.
      - name: Check the fuzz wrapper
        run: scripts/run-fuzz-selftest.sh

      - name: Fuzz lexer
        run: scripts/run-fuzz.sh FuzzLexer ${{ steps.fuzz-duration.outputs.fuzztime }} ./internal/lexer

      - name: Fuzz parser
        run: scripts/run-fuzz.sh FuzzParseSQL ${{ steps.fuzz-duration.outputs.fuzztime }} ./internal/parser

  fuzz-gate:
    name: Fuzz gate
    if: always() && github.event_name == 'pull_request'
    needs: [scope, fuzz]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Verify the aggregate result
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          CODE_SCOPE: ${{ needs.scope.outputs.code }}
          FUZZ_RESULT: ${{ needs.fuzz.result }}
        run: |
          scripts/check-ci-scope-gate.sh --selftest
          scripts/check-ci-scope-gate.sh \
            --scope-result "$SCOPE_RESULT" \
            --scope "$CODE_SCOPE" \
            --scoped "fuzz=$FUZZ_RESULT"
