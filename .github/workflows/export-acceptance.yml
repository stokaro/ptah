name: Export Acceptance

# Enforces the acceptance criteria for `ptah schema export --to openapi-v3` and
# `--to graphql` (issue #172): the generated OpenAPI must pass redocly lint and
# the generated GraphQL must parse (and build) with graphql-js.
#
# It also enforces the acceptance criteria for `--to protobuf` (issue #893): the
# generated .proto must pass `buf lint` with the STANDARD category, must already
# be a `buf format` fixed point, must compile with protoc and produce Go that
# builds, and must be byte-identical when regenerated. WIRE_JSON checks cover
# additive changes, reordering, reserved field removals, tombstones, and an
# intentionally incompatible type change.
#
# Go annotation to HCL export acceptance (issue #898) runs through the compiled
# binary, checks deterministic output, consumes the generated HCL through
# `schema render`, and verifies preview, destructive, and repeated cleanup
# behavior.
on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

jobs:
  export-acceptance:
    name: export-acceptance
    runs-on: ubuntu-latest
    env:
      # The tools are pinned on purpose. The membership of buf's STANDARD lint
      # category and the exact fixed point of `buf format` are version-sensitive,
      # and the renderer is written against these versions; floating them would
      # turn a new toolchain release into a red build on an unrelated PR.
      BUF_VERSION: v1.72.0
      PROTOC_VERSION: '35.1'
      PROTOC_GEN_GO_VERSION: v1.36.11
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.5'
          cache: true
          cache-dependency-path: go.sum

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install pinned Protobuf tooling
        run: bash scripts/install-protobuf-export-tools.sh "${RUNNER_TEMP}/protobuf-tools"

      - name: Build ptah
        run: go build -o bin/ptah ./cmd/ptah

      - name: OpenAPI and GraphQL acceptance
        run: bash scripts/check-api-export-acceptance.sh

      - name: Protobuf acceptance
        run: bash scripts/check-protobuf-export-acceptance.sh

      - name: Go annotation to HCL acceptance
        run: bash scripts/check-hcl-export-acceptance.sh
