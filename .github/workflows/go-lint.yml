name: Go Lint

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read
  pull-requests: read
  security-events: write

jobs:
  go-lint:
    name: ptah-go-lint
    runs-on: ubuntu-latest
    timeout-minutes: 25
    
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      
      - name: Install dependencies
        run: go mod download

      - name: Check documentation safety claims
        run: |
          ! grep -F "All operations are wrapped in transactions" README.md
          ! grep -F "All operations wrapped in transactions" README.md
          ! grep -F "locking prevents double-apply" README.md

      - name: Check repository-local path leaks
        run: scripts/check-repository-local-paths.sh

      - name: Check developer stack image pins
        run: |
          scripts/check-compose-image-pins.sh
          scripts/check-compose-image-pins-selftest.sh

      - name: Check workflow concurrency groups
        run: |
          scripts/check-workflow-concurrency.sh
          scripts/check-workflow-concurrency-selftest.sh

      - name: Check architecture boundaries
        run: |
          scripts/check-architecture-boundaries.sh
          scripts/check-architecture-boundaries-selftest.sh

      - name: Check documented lint rules
        run: scripts/check-lint-rules.sh

      - name: Check public Go API ledger
        run: scripts/check-public-api.sh

      - name: Check public Go API snapshot
        run: scripts/check-public-api-snapshot.sh

      - name: Check public Go API released baseline
        run: scripts/check-public-api-released.sh

      - name: Check annotation JSON Schema freshness
        run: |
          go run ./cmd/ptah schema annotations --out schemas/ptah-annotations.schema.json
          git diff --exit-code -- schemas/ptah-annotations.schema.json

      - name: qtlint
        run: make lint-qtlint

      # Both contours, every module. The module list is discovered rather than
      # written out here, so a module added tomorrow is covered by existing;
      # see scripts/list-go-modules.sh for the three answers this repository
      # used to give to that one question.
      - name: nolintguard
        run: make lint-nolintguard

      - name: Check every Go module is linted
        run: scripts/check-go-module-lint-coverage.sh

      - name: Check test style baseline
        run: scripts/check-test-style.sh

      - name: Validate lint SARIF output
        run: go test ./cmd/lint -run 'TestRunLint_SARIF' -count=1

      - name: Generate lint SARIF for code scanning
        run: go run ./cmd/ptah migrations lint --dir cmd/lint/testdata/clean --format sarif --fail-on none > ptah-lint.sarif

      - name: Upload lint SARIF to code scanning
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: github/codeql-action/upload-sarif@v4.37.7
        with:
          sarif_file: ptah-lint.sarif
          category: ptah-lint

      - name: Golint
        uses: golangci/golangci-lint-action@v9
        with:
          args: --timeout=30m
          version: v2.13.1

      # The action lints one directory per invocation, so a nested module needs
      # its own step. scripts/check-go-module-lint-coverage.sh fails when a
      # tracked module has none, which is what keeps this list from going stale
      # the way it already had: golangci-lint ran only from the repository root,
      # so testkit -- a published module -- and the gorm example were unlinted.
      - name: Golint (testkit)
        uses: golangci/golangci-lint-action@v9
        with:
          args: --timeout=30m
          version: v2.13.1
          working-directory: testkit

      - name: Golint (gorm example)
        uses: golangci/golangci-lint-action@v9
        with:
          args: --timeout=30m
          version: v2.13.1
          working-directory: examples/orm-loaders/gorm

  go-lint-windows:
    # The Ubuntu job's two contours differ by build tag, and a build tag cannot
    # reach a file the target operating system excludes: `go help
    # buildconstraint` puts that under GOOS. Every _windows_test.go file in the
    # repository is therefore outside both of them, analyzed by nothing, and
    # free to carry the violations this gate exists to refuse.
    #
    # Running the gate on a Windows runner is what reads them, and it reads
    # them the same way the Ubuntu job does rather than through a flag that
    # would have to be kept in step with it.
    name: ptah-go-lint-windows
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      # Before the checkout, because the checkout is what would rewrite them.
      # Git on Windows converts LF to CRLF on the way into the working tree by
      # default, and a formatter compares bytes: with the conversion left on,
      # gci reported every file in the repository as unformatted at 1:1,
      # including files this branch never touched.
      - name: Keep the line endings the repository stores
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Install dependencies
        run: go mod download

      # The same recipe the Ubuntu job runs, not a copy of its arguments: a
      # rule added to QTLINT_RULES has to reach every contour, and a second
      # spelling of the list is a second thing to keep in step.
      - name: qtlint
        run: make lint-qtlint

      # golangci-lint finds what qtlint cannot, go vet among them: govet is in
      # .golangci.yml, so a separate step would only run it twice. Four gosec
      # G115 findings were sitting in Windows-only source when this step was
      # added, every one an unchecked narrowing into a structure the Windows
      # API reads.
      - name: Golint
        uses: golangci/golangci-lint-action@v9
        with:
          args: --timeout=30m
          version: v2.13.1

      # The action lints one directory per invocation, so a nested module needs
      # its own step. scripts/check-go-module-lint-coverage.sh fails when a
      # tracked module has none, which is what keeps this list from going stale
      # the way it already had: golangci-lint ran only from the repository root,
      # so testkit -- a published module -- and the gorm example were unlinted.
      - name: Golint (testkit)
        uses: golangci/golangci-lint-action@v9
        with:
          args: --timeout=30m
          version: v2.13.1
          working-directory: testkit

      - name: Golint (gorm example)
        uses: golangci/golangci-lint-action@v9
        with:
          args: --timeout=30m
          version: v2.13.1
          working-directory: examples/orm-loaders/gorm

      # Windows-only source is not only unanalyzed without this job, it is
      # unrun: a _windows_test.go file exercises code no other runner compiles.
      #
      # Turning this on for the first time reported 1014 failures across more
      # than thirty packages, 1382 of them one root cause -- a Windows absolute
      # path inside a sqlite:// URL, refused because the drive letter's colon
      # reads as a port separator. That is fixed in this branch, so the step
      # gates rather than documents.
      #
      # -timeout is stated rather than left at Go's 10m default, and the number
      # comes from measurement rather than taste. On stokaro/ptah#1809 the same
      # commit failed twice and passed on the third attempt with no change:
      #
      #   step            fast runner   slow runner
      #   Set up Go            93s          125s
      #   qtlint               82s          112s
      #   Golint               79s          151s
      #   Unit tests          309s          696s (killed)
      #   - cmd/atlas         184s         >600s (killed)
      #
      # Every step is 1.4-1.9x slower on the slow runner, Set up Go and Golint
      # among them, which no branch content can influence. So 184s of a 600s
      # budget is not headroom: it is 31% on a good day, and most compat work
      # adds tests to cmd/atlas.
      #
      # 20m is ~2x the observed cliff. It moves the cliff rather than removing
      # it -- splitting cmd/atlas is the real fix (stokaro/ptah#1812) -- but the
      # job's own timeout-minutes above stays the real bound, so a genuine hang
      # is still caught, by the job rather than by a panic naming whichever test
      # happened to be running (stokaro/ptah#1749).
      - name: Unit tests
        run: go test ./... -count=1 -timeout=20m
