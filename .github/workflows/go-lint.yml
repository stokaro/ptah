name: Go Lint

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read
  pull-requests: read
  security-events: write

jobs:
  go-lint:
    name: ptah-go-lint
    runs-on: ubuntu-latest
    timeout-minutes: 25
    
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      
      - name: Install dependencies
        run: go mod download

      - name: Check documentation safety claims
        run: |
          ! grep -F "All operations are wrapped in transactions" README.md
          ! grep -F "All operations wrapped in transactions" README.md
          ! grep -F "locking prevents double-apply" README.md

      - name: Check repository-local path leaks
        run: scripts/check-repository-local-paths.sh

      - name: Check developer stack image pins
        run: |
          scripts/check-compose-image-pins.sh
          scripts/check-compose-image-pins-selftest.sh

      - name: Check workflow concurrency groups
        run: |
          scripts/check-workflow-concurrency.sh
          scripts/check-workflow-concurrency-selftest.sh

      - name: Check architecture boundaries
        run: |
          scripts/check-architecture-boundaries.sh
          scripts/check-architecture-boundaries-selftest.sh

      - name: Check the brand assets
        run: scripts/check-brand-assets.sh

      # The README's worked example, run for real. It lives in this workflow
      # rather than in docs.yml because both directions have to reach it: a
      # README edit, which docs.yml's `paths:` filter also sees, and a change to
      # what a command prints, which it does not. This workflow carries no
      # filter at all.
      - name: Check the README's worked example
        run: |
          scripts/check-readme-example.sh
          scripts/check-readme-example-selftest.sh

      - name: Check the ADR index
        run: scripts/check-adr-index.sh

      # The script published at https://stokaro.github.io/ptah/install.sh, run
      # against a fixture release under every POSIX shell on the runner. busybox
      # is installed because `| sh` is busybox ash on Alpine and nothing else
      # here compiles that path; without it the gate's shell floor is not met
      # and the step fails rather than quietly testing one shell.
      #
      # busybox's shell answers `command -v` from its own applets before reading
      # PATH, so four of the gate's cases -- the ones needing a tool to be
      # missing or shadowed -- cannot run under it and are reported as not run.
      # The gate refuses a run in which NO shell could make them, which is what
      # keeps that from reading as a pass.
      - name: Check the hosted install script
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends busybox-static
          scripts/check-install-script.sh
          scripts/check-install-script-selftest.sh

      # The PowerShell sibling, published at
      # https://stokaro.github.io/ptah/install.ps1. A Linux runner cannot
      # install with it -- it downloads a Windows .zip -- but `pwsh` is on this
      # image and the grammar can be judged anywhere, which is worth doing here
      # rather than nightly: the file is piped into `iex`, so a syntax error
      # reaches whoever runs the documented one-liner first.
      #
      # It has already happened once, from one em dash. Windows PowerShell 5.1
      # reads a .ps1 with no byte-order mark in the machine's ANSI code page,
      # where those three UTF-8 bytes end in a right double quotation mark, and
      # PowerShell accepts that character as a string delimiter -- so the string
      # it sat in closed early and the whole file stopped parsing.
      # docs/site/scripts/check-pages-root.mjs holds the ASCII rule that keeps
      # it out; this step holds the grammar that rule cannot see.
      #
      # ParseInput rather than [scriptblock]::Create, because it reports every
      # error in the file instead of throwing on the first one.
      - name: Check the hosted PowerShell installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $text = Get-Content -Raw docs/site/public/install.ps1
          $errors = $null
          $null = [System.Management.Automation.Language.Parser]::ParseInput($text, [ref]$null, [ref]$errors)
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Output $_.ToString() }
            throw "docs/site/public/install.ps1 has $($errors.Count) parse error(s)"
          }
          Write-Output "docs/site/public/install.ps1 parses under PowerShell $($PSVersionTable.PSVersion)"

      - name: Check the Renovate custom-manager patterns
        run: scripts/check-renovate-regex.sh

      - name: Check goreleaser artifact names
        run: scripts/check-goreleaser-artifact-names.sh

      # One step for every generated documentation block: the lint rules, the
      # agent-surface tables, the two command indexes, the strict-mode
      # classification and the whole flag page. Five steps stood here, each
      # starting its generator afresh; docsync renders them all in one process
      # because every generator is already a library (stokaro/ptah#2510).
      #
      # The capability and version-matrix blocks are checked by the same command
      # in capability-matrix.yml, where a change to the declaration that touches
      # no documentation still reaches a gate. That workflow's step and this one
      # run the same eleven targets, so either catches drift in any of them.
      - name: Check the generated documentation blocks
        run: scripts/check-docsync.sh

      - name: Check public Go API ledger
        run: scripts/check-public-api.sh

      - name: Check public Go API snapshot
        run: scripts/check-public-api-snapshot.sh

      - name: Check public Go API released baseline
        run: scripts/check-public-api-released.sh --require-baseline

      - name: Check public Go API docs sync
        run: scripts/check-public-api-docs-sync.sh

      - name: Check public Go API doc comments
        run: scripts/check-exported-docs.sh

      - name: Check annotation JSON Schema freshness
        run: |
          go run ./cmd/ptah schema annotations --out schemas/ptah-annotations.schema.json
          git diff --exit-code -- schemas/ptah-annotations.schema.json

      - name: qtlint
        run: make lint-qtlint

      # Both contours, every module. The module list is discovered rather than
      # written out here, so a module added tomorrow is covered by existing;
      # see scripts/list-go-modules.sh for the three answers this repository
      # used to give to that one question.
      - name: nolintguard
        run: make lint-nolintguard

      - name: Check every Go module is linted
        run: scripts/check-go-module-lint-coverage.sh

      - name: Check test style baseline
        run: scripts/check-test-style.sh

      # A gate stops gating quietly: it discovers zero inputs and reports the
      # same success it reports on a clean tree. This breaks each gate's own
      # rule in a throwaway worktree and requires the gate to notice, so a gate
      # that goes blind is caught here rather than by the next audit
      # (stokaro/ptah#1923).
      - name: Gate selftests
        run: scripts/check-gate-selftests.sh

      - name: Validate lint SARIF output
        run: go test ./cmd/lint -run 'TestRunLint_SARIF' -count=1

      - name: Generate lint SARIF for code scanning
        run: go run ./cmd/ptah migrations lint --dir cmd/lint/testdata/clean --format sarif --fail-on none > ptah-lint.sarif

      - name: Upload lint SARIF to code scanning
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: github/codeql-action/upload-sarif@v4.37.9
        with:
          sarif_file: ptah-lint.sarif
          category: ptah-lint

      - name: Golint
        uses: golangci/golangci-lint-action@v9
        with:
          args: --timeout=30m
          version: v2.13.2

      # The action lints one directory per invocation, so a nested module needs
      # its own step. scripts/check-go-module-lint-coverage.sh fails when a
      # tracked module has none, which is what keeps this list from going stale
      # the way it already had: golangci-lint ran only from the repository root,
      # so the gorm example was unlinted, as was the testkit module before it
      # moved to stokaro/ptah-testkit.
      - name: Golint (gorm example)
        uses: golangci/golangci-lint-action@v9
        with:
          args: --timeout=30m
          version: v2.13.2
          working-directory: examples/orm-loaders/gorm

  go-lint-windows:
    # The Ubuntu job's two contours differ by build tag, and a build tag cannot
    # reach a file the target operating system excludes: `go help
    # buildconstraint` puts that under GOOS. Every _windows_test.go file in the
    # repository is therefore outside both of them, analyzed by nothing, and
    # free to carry the violations this gate exists to refuse.
    #
    # Running the gate on a Windows runner is what reads them, and it reads
    # them the same way the Ubuntu job does rather than through a flag that
    # would have to be kept in step with it.
    name: ptah-go-lint-windows
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      # Before the checkout, because the checkout is what would rewrite them.
      # Git on Windows converts LF to CRLF on the way into the working tree by
      # default, and a formatter compares bytes: with the conversion left on,
      # gci reported every file in the repository as unformatted at 1:1,
      # including files this branch never touched.
      - name: Keep the line endings the repository stores
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Install dependencies
        run: go mod download

      # The same recipe the Ubuntu job runs, not a copy of its arguments: a
      # rule added to QTLINT_RULES has to reach every contour, and a second
      # spelling of the list is a second thing to keep in step.
      - name: qtlint
        run: make lint-qtlint

      # golangci-lint finds what qtlint cannot, go vet among them: govet is in
      # .golangci.yml, so a separate step would only run it twice. Four gosec
      # G115 findings were sitting in Windows-only source when this step was
      # added, every one an unchecked narrowing into a structure the Windows
      # API reads.
      - name: Golint
        uses: golangci/golangci-lint-action@v9
        with:
          args: --timeout=30m
          version: v2.13.2

      # The action lints one directory per invocation, so a nested module needs
      # its own step. scripts/check-go-module-lint-coverage.sh fails when a
      # tracked module has none, which is what keeps this list from going stale
      # the way it already had: golangci-lint ran only from the repository root,
      # so the gorm example was unlinted, as was the testkit module before it
      # moved to stokaro/ptah-testkit.
      - name: Golint (gorm example)
        uses: golangci/golangci-lint-action@v9
        with:
          args: --timeout=30m
          version: v2.13.2
          working-directory: examples/orm-loaders/gorm

      # Windows-only source is not only unanalyzed without this job, it is
      # unrun: a _windows_test.go file exercises code no other runner compiles.
      #
      # Turning this on for the first time reported 1014 failures across more
      # than thirty packages, 1382 of them one root cause -- a Windows absolute
      # path inside a sqlite:// URL, refused because the drive letter's colon
      # reads as a port separator. That is fixed in this branch, so the step
      # gates rather than documents.
      #
      # -timeout is stated rather than left at Go's 10m default, and the number
      # comes from measurement rather than taste. On stokaro/ptah#1809 the same
      # commit failed twice and passed on the third attempt with no change:
      #
      #   step            fast runner   slow runner
      #   Set up Go            93s          125s
      #   qtlint               82s          112s
      #   Golint               79s          151s
      #   Unit tests          309s          696s (killed)
      #   - cmd/atlas         184s         >600s (killed)
      #
      # Every step is 1.4-1.9x slower on the slow runner, Set up Go and Golint
      # among them, which no branch content can influence. So 184s of a 600s
      # budget is not headroom: it is 31% on a good day, and most compat work
      # adds tests to cmd/atlas.
      #
      # 20m is ~2x the observed cliff. It moves the cliff rather than removing
      # it, and the job's own timeout-minutes above stays the real bound, so a
      # genuine hang is still caught by the job rather than by a panic naming
      # whichever test happened to be running (stokaro/ptah#1749).
      #
      # The split named in that last paragraph has since landed: cmd/atlas's
      # 138 external test files moved into cmd/atlas/internal/migratetests and
      # cmd/atlas/internal/schematests, which took the largest package from
      # 21.2s to 15.7s locally -- the same ratio against the 184s above puts
      # the worst package at ~136s of the 600s default rather than 184s. The
      # timeout below is kept anyway: it is what makes the bound the job's
      # rather than Go's, and the number it protects against is the whole
      # step's, not one package's (stokaro/ptah#1812).
      #
      # The digest is part of this step rather than an `if: failure()` sibling
      # so it cannot fire for a failure somewhere else, and so the log needs no
      # path outside the workspace -- RUNNER_TEMP is a Windows path, and this
      # step is the one place in the file that runs under Git Bash.
      #
      # A package that runs out of time prints thousands of goroutine lines,
      # and the two facts worth reading are one line each: which package ran
      # out, and that the test the panic names had been running for a second
      # and is therefore not the cause. Both are already in the log; this puts
      # them where the job opens (stokaro/ptah#1812, stokaro/ptah#1749).
      #
      # Windows only, because that is the job measured against its budget:
      # cmd/atlas took 184s of Go's 600s default there before the split, and
      # every step on that runner is 1.4-1.9x slower than ordinary hardware.
      - name: Unit tests
        shell: bash
        run: |
          set -uo pipefail
          go test ./... -count=1 -timeout=20m 2>&1 | tee unit-tests.log
          status=${PIPESTATUS[0]}
          if [ "$status" -eq 0 ]; then
            rm -f unit-tests.log
            exit 0
          fi
          {
            echo "### Unit tests"
            echo
            echo '```text'
            # Every failing package, longest first. Failures print before the
            # passing ones rather than sorted among them: a package that failed
            # after five seconds still has to be named, and a shared list would
            # push it below whatever ran longest.
            grep -E '^FAIL[[:space:]]+go\.5x5\.cz/ptah' unit-tests.log | sort -rn -k3
            # The five slowest that passed, for the budget the failure is
            # measured against.
            grep -E '^ok[[:space:]]+go\.5x5\.cz/ptah' unit-tests.log | sort -rn -k3 | head -5
            # A timeout or a runtime abort, with the block that names what was
            # running when it fired.
            grep -A 6 -E '^(panic: test timed out|fatal error:)' unit-tests.log | head -40
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
          exit "$status"
