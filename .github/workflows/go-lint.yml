name: Go Lint

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read
  pull-requests: read
  security-events: write

concurrency:
  group: go-lint-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scope:
    name: Go lint scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.decide.outputs.code }}
      reason: ${{ steps.decide.outputs.reason }}
      readme: ${{ steps.decide.outputs.readme }}
      public_api: ${{ steps.decide.outputs.public_api }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Self-test the scope rule
        run: scripts/ci-diff-scope.sh --selftest

      - name: Decide whether this diff can affect Go lint
        id: decide
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            {
              echo "code=true"
              echo "readme=true"
              echo "public_api=true"
              echo "reason=not a pull request, so everything runs"
            } >> "$GITHUB_OUTPUT"
            echo "ci-diff-scope: code=true (not a pull request)"
            exit 0
          fi
          scripts/ci-diff-scope.sh \
            "${{ github.event.pull_request.base.sha }}" \
            "${{ github.event.pull_request.head.sha }}"

      - name: Report the decision in the job summary
        env:
          RUN_GO_LINT: ${{ steps.decide.outputs.code }}
          SCOPE_REASON: ${{ steps.decide.outputs.reason }}
        run: |
          {
            printf "### Go lint scope\n\n"
            printf -- "- run Go lint: \`%s\`\n" "$RUN_GO_LINT"
            printf -- "- because: %s\n" "$SCOPE_REASON"
          } >> "$GITHUB_STEP_SUMMARY"

  repository-policy:
    name: Repository policy
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # These checks are intentionally cheap and unconditional. They inspect
      # non-Go files, and a repository-local path can be introduced in any
      # tracked text file, including a documentation-only pull request.
      - name: Check documentation safety claims
        run: |
          for claim in \
            "All operations are wrapped in transactions" \
            "All operations wrapped in transactions" \
            "locking prevents double-apply"
          do
            if grep -Fq "$claim" README.md; then
              echo "forbidden documentation safety claim: $claim" >&2
              exit 1
            fi
          done

      - name: Check repository-local path leaks
        run: |
          set -euo pipefail
          scripts/check-repository-local-paths-selftest.sh
          scripts/check-repository-local-paths.sh

      - name: Check developer stack image pins
        run: |
          scripts/check-compose-image-pins.sh
          scripts/check-compose-image-pins-selftest.sh

      - name: Check workflow concurrency groups
        run: |
          scripts/check-workflow-concurrency.sh
          scripts/check-workflow-concurrency-selftest.sh

      - name: Check the brand assets
        run: |
          set -euo pipefail
          scripts/check-brand-assets-selftest.sh
          scripts/check-brand-assets.sh

      - name: Check the ADR index
        run: |
          set -euo pipefail
          scripts/check-adr-index-selftest.sh
          scripts/check-adr-index.sh

      # The script published at https://stokaro.github.io/ptah/install.sh is
      # repository policy, not Go lint. Exercise it against fixtures under the
      # POSIX shells the documented pipe-to-sh command can select.
      - name: Check the hosted install script
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends busybox-static
          scripts/check-install-script.sh
          scripts/check-install-script-selftest.sh

      # Parse the PowerShell sibling even on Linux. The grammar is portable,
      # and a syntax error in a pipe-to-iex installer must fail before publish.
      - name: Check the hosted PowerShell installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $text = Get-Content -Raw docs/site/public/install.ps1
          $errors = $null
          $null = [System.Management.Automation.Language.Parser]::ParseInput($text, [ref]$null, [ref]$errors)
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Output $_.ToString() }
            throw "docs/site/public/install.ps1 has $($errors.Count) parse error(s)"
          }
          Write-Output "docs/site/public/install.ps1 parses under PowerShell $($PSVersionTable.PSVersion)"

      - name: Check the Renovate custom-manager patterns
        run: scripts/check-renovate-regex.sh

      - name: Check goreleaser artifact names
        run: |
          set -euo pipefail
          scripts/check-goreleaser-artifact-names-selftest.sh
          scripts/check-goreleaser-artifact-names.sh

  readme-example:
    name: README example
    needs: scope
    if: >-
      github.event_name != 'pull_request' ||
      needs.scope.outputs.code == 'true' ||
      needs.scope.outputs.readme == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: Check the README's worked example
        run: |
          scripts/check-readme-example.sh
          scripts/check-readme-example-selftest.sh

  public-api:
    name: Public Go API
    needs: scope
    if: >-
      github.event_name != 'pull_request' ||
      needs.scope.outputs.code == 'true' ||
      needs.scope.outputs.public_api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: Install dependencies
        run: go mod download
      - name: Check public Go API ledger
        run: |
          set -euo pipefail
          scripts/check-public-api-selftest.sh
          scripts/check-public-api.sh
      - name: Check public Go API released baseline
        run: scripts/check-public-api-released.sh --require-baseline
      - name: Check public Go API docs sync
        run: |
          set -euo pipefail
          scripts/check-public-api-docs-sync-selftest.sh
          scripts/check-public-api-docs-sync.sh
      - name: Check public Go API doc comments
        run: scripts/check-exported-docs.sh

  go-lint:
    name: ptah-go-lint
    needs: scope
    if: github.event_name != 'pull_request' || needs.scope.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Install dependencies
        run: go mod download

      - name: Check architecture boundaries
        run: |
          scripts/check-architecture-boundaries.sh
          scripts/check-architecture-boundaries-selftest.sh

      - name: Check annotation JSON Schema freshness
        run: |
          go run ./cmd/ptah schema annotations --out schemas/ptah-annotations.schema.json
          git diff --exit-code -- schemas/ptah-annotations.schema.json

      - name: qtlint
        run: make lint-qtlint

      # Both contours, every module. The module list is discovered rather than
      # written out here, so a module added tomorrow is covered by existing;
      # see scripts/list-go-modules.sh for the three answers this repository
      # used to give to that one question.
      - name: nolintguard
        run: make lint-nolintguard

      - name: Check every Go module is linted
        run: |
          set -euo pipefail
          scripts/check-go-module-lint-coverage-selftest.sh
          scripts/check-go-module-lint-coverage.sh

      - name: Check test style baseline
        run: |
          set -euo pipefail
          scripts/check-test-style-selftest.sh
          scripts/check-test-style.sh

      # A gate stops gating quietly: it discovers zero inputs and reports the
      # same success it reports on a clean tree. This breaks each gate's own
      # rule in a throwaway worktree and requires the gate to notice, so a gate
      # that goes blind is caught here rather than by the next audit
      # (stokaro/ptah#1923).
      - name: Gate selftests
        run: scripts/check-gate-selftests.sh

      - name: Validate lint SARIF output
        run: go test ./cmd/lint -run 'TestRunLint_SARIF' -count=1

      - name: Generate lint SARIF for code scanning
        run: go run ./cmd/ptah migrations lint --dir cmd/lint/testdata/clean --format sarif --fail-on none > ptah-lint.sarif

      - name: Upload lint SARIF to code scanning
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: github/codeql-action/upload-sarif@v4.37.9
        with:
          sarif_file: ptah-lint.sarif
          category: ptah-lint

      - name: Golint
        uses: golangci/golangci-lint-action@v9
        with:
          args: --timeout=30m
          version: v2.13.2

      # The action lints one directory per invocation, so a nested module needs
      # its own step. scripts/check-go-module-lint-coverage.sh fails when a
      # tracked module has none, which is what keeps this list from going stale
      # the way it already had: golangci-lint ran only from the repository root,
      # so the gorm example was unlinted, as was the testkit module before it
      # moved to stokaro/ptah-testkit.
      - name: Golint (gorm example)
        uses: golangci/golangci-lint-action@v9
        with:
          args: --timeout=30m
          version: v2.13.2
          working-directory: examples/orm-loaders/gorm

      - name: Golint (documentation source fixture)
        uses: golangci/golangci-lint-action@v9
        with:
          args: --timeout=30m
          version: v2.13.2
          working-directory: docs/site/fixtures/source-equivalence

  go-lint-gate:
    name: Go lint gate
    if: always() && github.event_name == 'pull_request'
    needs:
      - scope
      - repository-policy
      - readme-example
      - public-api
      - go-lint
      - go-lint-windows
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Verify the aggregate result
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          CODE_SCOPE: ${{ needs.scope.outputs.code }}
          README_SCOPE: ${{ needs.scope.outputs.code == 'true' || needs.scope.outputs.readme == 'true' }}
          PUBLIC_API_SCOPE: ${{ needs.scope.outputs.code == 'true' || needs.scope.outputs.public_api == 'true' }}
          POLICY_RESULT: ${{ needs.repository-policy.result }}
          README_RESULT: ${{ needs.readme-example.result }}
          PUBLIC_API_RESULT: ${{ needs.public-api.result }}
          LINUX_RESULT: ${{ needs.go-lint.result }}
          WINDOWS_RESULT: ${{ needs.go-lint-windows.result }}
        run: |
          scripts/check-ci-scope-gate.sh --selftest
          scripts/check-ci-scope-gate.sh \
            --scope-result "$SCOPE_RESULT" \
            --scope "$CODE_SCOPE" \
            --required "repository-policy=$POLICY_RESULT" \
            --scoped "ptah-go-lint=$LINUX_RESULT" \
            --scoped "ptah-go-lint-windows=$WINDOWS_RESULT"
          scripts/check-ci-scope-gate.sh \
            --scope-result "$SCOPE_RESULT" \
            --scope "$README_SCOPE" \
            --scoped "README-example=$README_RESULT"
          scripts/check-ci-scope-gate.sh \
            --scope-result "$SCOPE_RESULT" \
            --scope "$PUBLIC_API_SCOPE" \
            --scoped "public-API=$PUBLIC_API_RESULT"

  go-lint-windows:
    # The Ubuntu job's two contours differ by build tag, and a build tag cannot
    # reach a file the target operating system excludes: `go help
    # buildconstraint` puts that under GOOS. Every _windows_test.go file in the
    # repository is therefore outside both of them, analyzed by nothing, and
    # free to carry the violations this gate exists to refuse.
    #
    # Running the gate on a Windows runner is what reads them, and it reads
    # them the same way the Ubuntu job does rather than through a flag that
    # would have to be kept in step with it.
    name: ptah-go-lint-windows
    needs: scope
    if: github.event_name != 'pull_request' || needs.scope.outputs.code == 'true'
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      # Before the checkout, because the checkout is what would rewrite them.
      # Git on Windows converts LF to CRLF on the way into the working tree by
      # default, and a formatter compares bytes: with the conversion left on,
      # gci reported every file in the repository as unformatted at 1:1,
      # including files this branch never touched.
      - name: Keep the line endings the repository stores
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Install dependencies
        run: go mod download

      # The same recipe the Ubuntu job runs, not a copy of its arguments: a
      # rule added to QTLINT_RULES has to reach every contour, and a second
      # spelling of the list is a second thing to keep in step.
      - name: qtlint
        run: make lint-qtlint

      # golangci-lint finds what qtlint cannot, go vet among them: govet is in
      # .golangci.yml, so a separate step would only run it twice. Four gosec
      # G115 findings were sitting in Windows-only source when this step was
      # added, every one an unchecked narrowing into a structure the Windows
      # API reads.
      - name: Golint
        uses: golangci/golangci-lint-action@v9
        with:
          args: --timeout=30m
          version: v2.13.2

      # The action lints one directory per invocation, so a nested module needs
      # its own step. scripts/check-go-module-lint-coverage.sh fails when a
      # tracked module has none, which is what keeps this list from going stale
      # the way it already had: golangci-lint ran only from the repository root,
      # so the gorm example was unlinted, as was the testkit module before it
      # moved to stokaro/ptah-testkit.
      - name: Golint (gorm example)
        uses: golangci/golangci-lint-action@v9
        with:
          args: --timeout=30m
          version: v2.13.2
          working-directory: examples/orm-loaders/gorm

      - name: Golint (documentation source fixture)
        uses: golangci/golangci-lint-action@v9
        with:
          args: --timeout=30m
          version: v2.13.2
          working-directory: docs/site/fixtures/source-equivalence
