name: Ptah Action Smoke

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ptah-action-smoke-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scope:
    name: scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.decide.outputs.code }}
      reason: ${{ steps.decide.outputs.reason }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Self-test the scope rule
        run: scripts/ci-diff-scope.sh --selftest

      - name: Decide whether this diff can affect Go validation
        id: decide
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "reason=not a pull request, so everything runs" >> "$GITHUB_OUTPUT"
            echo "ci-diff-scope: code=true (not a pull request)"
            exit 0
          fi
          scripts/ci-diff-scope.sh \
            "${{ github.event.pull_request.base.sha }}" \
            "${{ github.event.pull_request.head.sha }}"

      - name: Report the decision in the job summary
        run: |
          {
            printf '### Go validation scope\n\n'
            printf -- "- run Go validation: \`%s\`\n" "${{ steps.decide.outputs.code }}"
            printf -- '- because: %s\n' "${{ steps.decide.outputs.reason }}"
          } >> "$GITHUB_STEP_SUMMARY"

  smoke:
    needs: scope
    if: github.event_name != 'pull_request' || needs.scope.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Build Ptah
        run: go build -o "$RUNNER_TEMP/ptah" ./cmd/ptah

      - name: Create smoke schema source
        run: |
          mkdir -p "$RUNNER_TEMP/ptah-action-models"
          cat > "$RUNNER_TEMP/ptah-action-models/models.go" <<'GO'
          package models

          //ptah:schema:table name="users"
          type User struct {
              //ptah:schema:field name="id" type="INTEGER" primary="true"
              ID int

              //ptah:schema:field name="email" type="TEXT" not_null="true" unique="true"
              Email string
          }
          GO

      - name: Run local Ptah action
        uses: ./.github/actions/ptah
        with:
          binary-path: ${{ runner.temp }}/ptah
          setup-go: "false"
          dir: ${{ runner.temp }}/ptah-action-models
          db-url: sqlite:///${{ runner.temp }}/ptah-action.db
          dialect: sqlite
          migration-dir: internal/cli/lint/testdata/clean
          comment: "false"
          lint: "true"

      # A failing lint is the run whose report a reviewer acts on, and the clean
      # fixture above never produces one. The action fails the job on a lint
      # failure, so this step continues on error and the next one reads the
      # report the action wrote and the comment and check run are built from
      # (stokaro/ptah#3500).
      - name: Run local Ptah action over a directory lint fails
        id: failing-lint
        continue-on-error: true
        uses: ./.github/actions/ptah
        with:
          binary-path: ${{ runner.temp }}/ptah
          setup-go: "false"
          dir: ${{ runner.temp }}/ptah-action-models
          db-url: sqlite:///${{ runner.temp }}/ptah-action-failing-lint.db
          dialect: sqlite
          migration-dir: internal/cli/lint/testdata/bad
          output-dir: ${{ runner.temp }}/ptah-action-failing-lint
          comment: "false"
          lint: "true"

      - name: Read the failing lint report the action wrote
        env:
          OUTCOME: ${{ steps.failing-lint.outcome }}
          LINT_PATH: ${{ runner.temp }}/ptah-action-failing-lint/ptah-lint.json
        run: |
          test "$OUTCOME" = failure
          node - <<'NODE'
          const fs = require("fs");
          const report = JSON.parse(fs.readFileSync(process.env.LINT_PATH, "utf8"));
          if (report.failed !== true || !Array.isArray(report.findings) || report.findings.length === 0) {
            console.error(`the lint path holds no failing report: ${JSON.stringify(report).slice(0, 200)}`);
            process.exit(1);
          }
          console.log(`lint report: failed, ${report.findings.length} finding(s)`);
          NODE

      # The action's own setup-go step was unreachable from CI while every smoke
      # invocation passed setup-go: "false", so its Go version default rotted
      # with a green board. This second invocation leaves setup-go at its default
      # so the step actually runs and has to resolve a toolchain from the calling
      # repository's go.mod.
      #
      # What this proves: the step's inputs resolve and setup-go succeeds with an
      # empty go-version. What it does NOT prove: which toolchain ended up on
      # PATH — the job-level setup-go above already installed the same one, so an
      # assertion on `go env GOVERSION` here would pass either way and would be
      # decoration.
      - name: Run local Ptah action with its own Go setup
        uses: ./.github/actions/ptah
        with:
          binary-path: ${{ runner.temp }}/ptah
          dir: ${{ runner.temp }}/ptah-action-models
          db-url: sqlite:///${{ runner.temp }}/ptah-action-setup-go.db
          dialect: sqlite
          migration-dir: internal/cli/lint/testdata/clean
          comment: "false"
          lint: "true"

      # go-version-file defaults to go.mod at the caller's repository root, and
      # setup-go fails outright when it is not there. This repository always has
      # one, so the failure was only reachable downstream: the published copy of
      # the action lives in a repository with no go.mod, and its smoke had been
      # red since the input was introduced while this board stayed green.
      #
      # Naming a file that does not exist drives the same resolution, so the
      # case is now reachable from here.
      - name: Run local Ptah action with no Go version file to read
        uses: ./.github/actions/ptah
        with:
          binary-path: ${{ runner.temp }}/ptah
          go-version-file: this-file-does-not-exist/go.mod
          dir: ${{ runner.temp }}/ptah-action-models
          db-url: sqlite:///${{ runner.temp }}/ptah-action-no-go-mod.db
          dialect: sqlite
          migration-dir: internal/cli/lint/testdata/clean
          comment: "false"
          lint: "true"

  ptah-action-gate:
    name: Ptah Action gate
    if: always() && github.event_name == 'pull_request'
    needs: [scope, smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Verify the aggregate result
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          CODE_SCOPE: ${{ needs.scope.outputs.code }}
          SMOKE_RESULT: ${{ needs.smoke.result }}
        run: |
          scripts/check-ci-scope-gate.sh --selftest
          scripts/check-ci-scope-gate.sh \
            --scope-result "$SCOPE_RESULT" \
            --scope "$CODE_SCOPE" \
            --scoped "smoke=$SMOKE_RESULT"
