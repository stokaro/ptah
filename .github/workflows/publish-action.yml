name: Publish the GitHub Action

# stokaro/ptah-action is a published copy of .github/actions/ptah, not a place
# to edit. This mirrors the directory there so the two cannot drift, which is
# what stokaro/ptah#3024 records having happened twice in one day.
#
# Authentication is the ptah-automation GitHub App, which is already installed
# across the organisation. It needs Contents: Read and write, which it does not
# have by default -- metadata, issues and pull requests are not enough to push.

on:
  push:
    branches: [master]
    paths:
      - '.github/actions/ptah/**'
      - '.github/workflows/publish-action.yml'
  workflow_dispatch:
    inputs:
      tag:
        description: Moving major tag to point at the published commit, or empty to leave tags alone.
        required: false
        default: v1

permissions:
  contents: read

concurrency:
  group: publish-action
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # Two checkouts, an rsync and a tag move. The cap is here because the job
    # mints an app token, and `scripts/check-app-token-lifetime.sh` requires one
    # of every job that does.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # The gate runs on every pull request too. Running it again here is not
      # redundant: this is the last point at which a tree that cannot be
      # published is still ours to fix.
      - name: Refuse a tree that cannot be published
        run: scripts/check-action-publishable.sh

      # A GitHub App rather than a personal token. The credential is not tied
      # to whoever created it, so it survives that person's access changing,
      # and the token it mints expires in an hour rather than on a date
      # somebody picked. The name is PUBLISH_ rather than PTAH_ACTION_ because
      # the repository has two more jobs of this shape -- the Homebrew formula
      # and the site redeploy -- and one app with contents:write, narrowed per
      # run by `repositories:`, is the credential all three should share.
      - name: Mint a GitHub App token
        id: app-token
        if: vars.PUBLISH_APP_ID != ''
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.PUBLISH_APP_ID }}
          private-key: ${{ secrets.PUBLISH_APP_KEY }}
          repositories: ptah-action

      - name: Report whether publishing is configured
        id: configured
        env:
          TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          if [ -z "${TOKEN}" ]; then
            echo "configured=false" >>"$GITHUB_OUTPUT"
            {
              printf '## Action publish skipped\n\n'
              printf 'No App token was minted, so stokaro/ptah-action was not updated.\n'
              printf 'Set the PUBLISH_APP_ID variable and the PUBLISH_APP_KEY secret,\n'
              printf 'and give the app Contents: Read and write on stokaro/ptah-action.\n\n'
              printf 'The directory was still checked, so this run says the tree is publishable and not that it was published.\n'
            } >>"$GITHUB_STEP_SUMMARY"
          else
            echo "configured=true" >>"$GITHUB_OUTPUT"
          fi

      # A dispatch is somebody asking for a publish. Telling them it was
      # skipped in a summary nobody opens is how a missing credential survives.
      - name: A dispatch without a token is an error
        if: github.event_name == 'workflow_dispatch' && steps.configured.outputs.configured != 'true'
        run: |
          echo "PUBLISH_APP_ID and PUBLISH_APP_KEY are required to publish" >&2
          exit 1

      - name: Check out the published repository
        if: steps.configured.outputs.configured == 'true'
        uses: actions/checkout@v7
        with:
          repository: stokaro/ptah-action
          token: ${{ steps.app-token.outputs.token }}
          path: published
          fetch-depth: 0

      - name: Mirror the directory
        if: steps.configured.outputs.configured == 'true'
        id: mirror
        run: |
          set -euo pipefail
          # --delete so a file removed here is removed there. Without it the
          # published copy keeps shipping a script this repository dropped.
          #
          # The exclusions are the published repository's own files, not the
          # action's: its smoke workflow and its CONTRIBUTING. --delete would
          # take them, because they are absent from the source directory, and
          # the first publish would silently remove the CI that tests what it
          # just published.
          rsync -a --delete \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'CONTRIBUTING.md' \
            .github/actions/ptah/ published/
          cd published
          if git diff --quiet && git diff --cached --quiet; then
            echo "changed=false" >>"$GITHUB_OUTPUT"
            echo "published copy already matches"
            exit 0
          fi
          echo "changed=true" >>"$GITHUB_OUTPUT"
          git add -A
          git -c user.name='ptah-publish' \
              -c user.email='ptah-publish@users.noreply.github.com' \
              commit -m "Publish .github/actions/ptah from stokaro/ptah@${GITHUB_SHA}"
          git push origin HEAD:main

      # Consumers pin stokaro/ptah-action@v1. A publish that leaves the tag
      # behind ships nothing to them.
      - name: Move the major tag
        if: >-
          steps.configured.outputs.configured == 'true' &&
          steps.mirror.outputs.changed == 'true' &&
          (github.event_name != 'workflow_dispatch' || inputs.tag != '')
        env:
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || 'v1' }}
        run: |
          set -euo pipefail
          cd published
          git tag -f "$TAG"
          git push -f origin "refs/tags/$TAG"

      - name: Say what happened
        if: steps.configured.outputs.configured == 'true'
        run: |
          {
            printf '## Action publish\n\n'
            printf '| Field | Value |\n| --- | --- |\n'
            printf '| Source commit | `%s` |\n' "$GITHUB_SHA"
            printf '| Published | %s |\n' "${{ steps.mirror.outputs.changed }}"
          } >>"$GITHUB_STEP_SUMMARY"
