# Auto-syncs the separate testkit module after bot dependency bumps.
#
# Renovate and Dependabot update only the root go.mod/go.sum; testkit/ is a
# separate Go module (with `replace go.5x5.cz/ptah => ..`), so its
# go.sum goes stale on every root Go dependency bump and the testkit CI jobs
# fail with "go: updates to go.mod needed; to update it: go mod tidy".
# This workflow runs that tidy on the bot's PR branch and pushes the sync
# commit automatically.
#
# This job is a CONVENIENCE, not the guarantee. It repairs the bot's branch when
# it gets a chance to, and it cannot always get one: the branch it needs is
# deleted the moment the pull request merges, and nothing makes this job win
# that race. The guarantee lives in the `testkit module is tidy against the
# root` check in testkit.yml, which is required for merge -- a pull request
# whose bump leaves testkit stale cannot land whether or not this ran.
#
# Token resolution, best first:
#   1. A GitHub App installation token, minted per run when the
#      TESTKIT_SYNC_APP_ID repository variable and TESTKIT_SYNC_APP_KEY secret
#      are configured (app permissions: Contents read/write on this repo).
#      Pushes made with it retrigger CI.
#   2. The TESTKIT_SYNC_TOKEN fine-grained PAT secret, if present. Also
#      retriggers CI.
#   3. The default GITHUB_TOKEN. The sync still lands, but GitHub suppresses
#      workflow runs for its pushes, so the checks need a manual re-run.
#
# pull_request_target is used because Dependabot-triggered pull_request runs
# get a read-only GITHUB_TOKEN. The job is restricted to bot-authored branches
# of this repository and only ever runs `go mod tidy` in testkit/.
name: testkit-sync

on:
  pull_request_target:
    paths:
      - "go.mod"
      - "go.sum"

permissions:
  contents: write

jobs:
  sync:
    name: Sync testkit go.sum
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      (github.actor == 'renovate[bot]' || github.actor == 'dependabot[bot]' ||
       startsWith(github.event.pull_request.head.ref, 'renovate/') ||
       startsWith(github.event.pull_request.head.ref, 'dependabot/'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Mint a GitHub App token
        id: app-token
        if: vars.TESTKIT_SYNC_APP_ID != ''
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.TESTKIT_SYNC_APP_ID }}
          private-key: ${{ secrets.TESTKIT_SYNC_APP_KEY }}

      # The checkout below resolves a branch NAME, and the branch is deleted the
      # moment the pull request merges. This job has queued for minutes while a
      # bot pull request merged in under two, and the checkout then failed with
      # three retries of "The process '/usr/bin/git' failed with exit code 1" --
      # a message that names neither the branch nor the reason. Asking first
      # turns that into one sentence saying what happened.
      - name: Check that the head branch still exists
        id: head
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          if gh api "repos/${GITHUB_REPOSITORY}/branches/${HEAD_REF}" --silent 2>/dev/null; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "present=false" >> "$GITHUB_OUTPUT"
          echo "::notice::${HEAD_REF} no longer exists -- the pull request merged before this job started, so there is no branch left to sync. Nothing is broken by that: the required tidy check in testkit.yml is what keeps a stale testkit from merging."

      - name: Check out the pull request branch
        if: steps.head.outputs.present == 'true'
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ steps.app-token.outputs.token || secrets.TESTKIT_SYNC_TOKEN || github.token }}

      - name: Set up Go
        if: steps.head.outputs.present == 'true'
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            testkit/go.sum

      - name: Tidy the testkit module
        if: steps.head.outputs.present == 'true'
        working-directory: testkit
        env:
          GOWORK: "off"
          GOFLAGS: "-mod=mod"
        run: go mod tidy

      - name: Commit and push the sync when needed
        if: steps.head.outputs.present == 'true'
        run: |
          if git diff --quiet -- testkit/go.mod testkit/go.sum; then
            echo "testkit module already in sync; nothing to do."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add testkit/go.mod testkit/go.sum
          git commit -m "Sync testkit module go.sum with the root dependency bump"
          git push
