name: Release

on:
  push:
    tags:
      - "v*"
  pull_request:

permissions:
  contents: write
  packages: write
  id-token: write
  pull-requests: read

concurrency:
  group: release-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scope:
    name: scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      code: ${{ steps.decide.outputs.code }}
      reason: ${{ steps.decide.outputs.reason }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Self-test the scope rule
        run: scripts/ci-diff-scope.sh --selftest

      - name: Decide whether this diff can affect release validation
        id: decide
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "reason=not a pull request, so everything runs" >> "$GITHUB_OUTPUT"
            echo "ci-diff-scope: code=true (not a pull request)"
            exit 0
          fi
          scripts/ci-diff-scope.sh \
            "${{ github.event.pull_request.base.sha }}" \
            "${{ github.event.pull_request.head.sha }}"

      - name: Report the decision in the job summary
        run: |
          {
            printf '### Release validation scope\n\n'
            printf -- "- run release validation: \`%s\`\n" "${{ steps.decide.outputs.code }}"
            printf -- '- because: %s\n' "${{ steps.decide.outputs.reason }}"
          } >> "$GITHUB_STEP_SUMMARY"

  goreleaser-check:
    name: goreleaser-check
    needs: scope
    if: github.event_name == 'pull_request' && needs.scope.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Check GoReleaser config
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: v2.15.4
          args: check

      - uses: anchore/sbom-action/download-syft@v0.24.2

      - name: Build snapshot artifacts
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: v2.15.4
          args: release --snapshot --clean --skip=sign,docker

  release-check-gate:
    name: Release check gate
    if: always() && github.event_name == 'pull_request'
    needs: [scope, goreleaser-check]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Verify the aggregate result
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          CODE_SCOPE: ${{ needs.scope.outputs.code }}
          GORELEASER_RESULT: ${{ needs.goreleaser-check.result }}
        run: |
          scripts/check-ci-scope-gate.sh --selftest
          scripts/check-ci-scope-gate.sh \
            --scope-result "$SCOPE_RESULT" \
            --scope "$CODE_SCOPE" \
            --scoped "goreleaser-check=$GORELEASER_RESULT"

  release:
    name: release
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      # First, before the checkout and the eleven minutes of build behind it.
      # GoReleaser reaches the Homebrew formula only after the release assets
      # and the container images are already pushed, so a token discovered
      # missing there leaves a half-published release behind. It costs seconds
      # to learn it here instead.
      #
      # This is the other half of stokaro/ptah#2361. `skip_upload` in
      # .goreleaser.yaml no longer turns an absent token into a quietly
      # narrower release; this step is what turns it into a legible failure.
      - name: The Homebrew tap token must be present
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "${HOMEBREW_TAP_TOKEN}" ]; then
            echo "::error::HOMEBREW_TAP_TOKEN is empty or unset. The Homebrew formula would not reach stokaro/homebrew-ptah, and the release would otherwise finish green with one channel missing. Set the secret, then re-run this job." >&2
            exit 1
          fi
          echo "HOMEBREW_TAP_TOKEN is present"

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: sigstore/cosign-installer@v4.1.2

      - uses: anchore/sbom-action/download-syft@v0.24.2

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: v2.15.4
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
