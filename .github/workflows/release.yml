name: Release

on:
  push:
    tags:
      - "v*"
  pull_request:

permissions:
  contents: write
  packages: write
  id-token: write
  pull-requests: read

concurrency:
  group: release-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scope:
    name: scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      code: ${{ steps.decide.outputs.code }}
      reason: ${{ steps.decide.outputs.reason }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Self-test the scope rule
        run: scripts/ci-diff-scope.sh --selftest

      - name: Decide whether this diff can affect release validation
        id: decide
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "reason=not a pull request, so everything runs" >> "$GITHUB_OUTPUT"
            echo "ci-diff-scope: code=true (not a pull request)"
            exit 0
          fi
          scripts/ci-diff-scope.sh \
            "${{ github.event.pull_request.base.sha }}" \
            "${{ github.event.pull_request.head.sha }}"

      - name: Report the decision in the job summary
        run: |
          {
            printf '### Release validation scope\n\n'
            printf -- "- run release validation: \`%s\`\n" "${{ steps.decide.outputs.code }}"
            printf -- '- because: %s\n' "${{ steps.decide.outputs.reason }}"
          } >> "$GITHUB_STEP_SUMMARY"

  goreleaser-check:
    name: goreleaser-check
    needs: scope
    if: github.event_name == 'pull_request' && needs.scope.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Check GoReleaser config
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: v2.15.4
          args: check

      - uses: anchore/sbom-action/download-syft@v0.24.2

      - name: Build snapshot artifacts
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: v2.15.4
          args: release --snapshot --clean --skip=sign,docker

  release-check-gate:
    name: Release check gate
    if: always() && github.event_name == 'pull_request'
    needs: [scope, goreleaser-check]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Verify the aggregate result
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          CODE_SCOPE: ${{ needs.scope.outputs.code }}
          GORELEASER_RESULT: ${{ needs.goreleaser-check.result }}
        run: |
          scripts/check-ci-scope-gate.sh --selftest
          scripts/check-ci-scope-gate.sh \
            --scope-result "$SCOPE_RESULT" \
            --scope "$CODE_SCOPE" \
            --scoped "goreleaser-check=$GORELEASER_RESULT"

  release:
    name: release
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      # First, before the checkout and the eleven minutes of build behind it.
      # GoReleaser reaches the Homebrew formula only after the release assets
      # and the container images are already pushed, so a token discovered
      # missing there leaves a half-published release behind. It costs seconds
      # to learn it here instead.
      #
      # This is the other half of stokaro/ptah#2361. `skip_upload` in
      # .goreleaser.yaml no longer turns an absent token into a quietly
      # narrower release; these two steps are what turn it into a legible
      # failure.
      #
      # Minting here rather than beside GoReleaser is also what makes the
      # presence check a real check: a key that cannot mint fails in the same
      # seconds an absent one does. An installation token lives an hour and
      # this job is capped at 40 minutes, so it cannot outlive the run that
      # holds it. `scripts/check-app-token-lifetime.sh` holds that margin,
      # because raising the timeout would break the formula upload alone --
      # after the assets and the images are already pushed.
      - name: Mint a GitHub App token for the tap
        id: app-token
        if: vars.PUBLISH_APP_ID != ''
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.PUBLISH_APP_ID }}
          private-key: ${{ secrets.PUBLISH_APP_KEY }}
          owner: stokaro
          repositories: homebrew-ptah

      - name: The Homebrew tap token must be present
        id: tap-token
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          PAT: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          # App first. Both write the formula the same way, and the app one does
          # not expire on a date somebody picked.
          #
          # The second rung stays until a release has actually published through
          # the app. Nothing here is dispatchable -- this job runs on a tag push
          # alone -- so the app path cannot be proven the way the action publish
          # and the site redeploy were, and a credential that fails here fails
          # after the assets and the images are already out. The line below
          # names which one ran; when it has said "as the app" for a release,
          # the PAT rung and the HOMEBREW_TAP_TOKEN secret both go.
          if [ -n "${APP_TOKEN}" ]; then
            echo "::add-mask::${APP_TOKEN}"
            echo "value=${APP_TOKEN}" >>"${GITHUB_OUTPUT}"
            echo "the formula is written as the app"
          elif [ -n "${PAT}" ]; then
            echo "::add-mask::${PAT}"
            echo "value=${PAT}" >>"${GITHUB_OUTPUT}"
            echo "the formula is written as HOMEBREW_TAP_TOKEN"
          else
            echo "::error::no tap credential is configured. The Homebrew formula would not reach stokaro/homebrew-ptah, and the release would otherwise finish green with one channel missing. Set the PUBLISH_APP_ID variable with a PUBLISH_APP_KEY secret, giving the app contents:write on stokaro/homebrew-ptah, then re-run this job." >&2
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Docker Hub is a mirror of GHCR rather than a move, and both logins run
      # BEFORE GoReleaser pushes anything. That ordering is the cheap half of
      # "both registries or neither": the ordinary failure is a bad or expired
      # credential, and proving both here stops the run before either registry
      # has the tag (stokaro/ptah#2362).
      #
      # The account is a secret rather than `github.repository_owner`, because
      # the two are different things that happen to look alike. `stokaro` on
      # Docker Hub is an ORGANIZATION, and a `dckr_pat_` token belongs to a
      # person who is a member of it -- logging in as the organization answers
      # `unauthorized: incorrect username or password`, measured before this
      # line was written. The image namespace stays `stokaro/ptah`; only the
      # identity presenting the credential differs.
      - uses: docker/login-action@v4
        with:
          registry: docker.io
          username: ${{ secrets.DOCKER_HUB_USER }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - uses: sigstore/cosign-installer@v4.1.2

      - uses: anchore/sbom-action/download-syft@v0.24.2

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: v2.15.4
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The name is .goreleaser.yaml's; what it carries is now whichever
          # credential the step above resolved.
          HOMEBREW_TAP_TOKEN: ${{ steps.tap-token.outputs.value }}

      # The mirror, verified rather than assumed.
      #
      # "Both registries or neither" is a property of what a READER can pull,
      # so it is checked the way a reader would: anonymously, over the registry
      # API, resolving each tag to the digest of its manifest list. Equal
      # digests mean the same image, and an absent tag on one host is the state
      # this exists to refuse -- a reader following the install page cannot tell
      # which registry is behind, which is what made #2362 three faults instead
      # of one.
      #
      # Anonymous on purpose. The job holds a push credential for both hosts,
      # and a check that used it would pass for an image the public cannot
      # reach -- the exact fault this issue opened with.
      - name: Both registries carry this release
        run: scripts/check-release-image-mirror.sh "${GITHUB_REF_NAME#v}"
