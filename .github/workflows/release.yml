name: Release

on:
  push:
    tags:
      - "v*"
  pull_request:

# Read-only by default. Each job states what it needs, so a job added later
# without a block of its own gets no write access and no OIDC token.
permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scope:
    name: scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      code: ${{ steps.decide.outputs.code }}
      reason: ${{ steps.decide.outputs.reason }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Self-test the scope rule
        run: scripts/ci-diff-scope.sh --selftest

      - name: Decide whether this diff can affect release validation
        id: decide
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "reason=not a pull request, so everything runs" >> "$GITHUB_OUTPUT"
            echo "ci-diff-scope: code=true (not a pull request)"
            exit 0
          fi
          scripts/ci-diff-scope.sh \
            "${{ github.event.pull_request.base.sha }}" \
            "${{ github.event.pull_request.head.sha }}"

      - name: Report the decision in the job summary
        run: |
          {
            printf '### Release validation scope\n\n'
            printf -- "- run release validation: \`%s\`\n" "${{ steps.decide.outputs.code }}"
            printf -- '- because: %s\n' "${{ steps.decide.outputs.reason }}"
          } >> "$GITHUB_STEP_SUMMARY"

  goreleaser-check:
    name: goreleaser-check
    needs: scope
    if: github.event_name == 'pull_request' && needs.scope.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Check GoReleaser config
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: v2.20.2
          args: check

      - uses: anchore/sbom-action/download-syft@v0.24.3

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - name: Build snapshot artifacts
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: v2.20.2
          args: release --snapshot --clean --skip=sign

      - name: Run every shipped binary in both container architectures
        run: |
          version="$(jq -r .version dist/metadata.json)"
          for arch in amd64 arm64; do
            image="ghcr.io/stokaro/ptah:${version}-${arch}"
            docker run --rm --platform "linux/$arch" --entrypoint cat "$image" /usr/share/licenses/ptah/LICENSE | cmp LICENSE -
            docker run --rm --platform "linux/$arch" "$image" version
            docker run --rm --platform "linux/$arch" --entrypoint ptah-compat "$image" version
            docker run --rm --platform "linux/$arch" --entrypoint ptah-ls "$image" --version
          done

      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          package-manager-cache: false

      - name: Check npm packages from the snapshot archives
        run: |
          set -euo pipefail
          version="$(jq -r .version dist/metadata.json)"
          node npm/scripts/stage.mjs --version "$version" --assets dist --output dist/npm
          # The snapshot version is a prerelease, so this dry run takes the
          # path a prerelease tag takes, which npm refuses without a dist-tag.
          node npm/scripts/publish.mjs --staged dist/npm --dry-run
          root_tarball="$(npm pack dist/npm/ptah --pack-destination dist/npm --silent)"
          compat_tarball="$(npm pack dist/npm/ptah-compat --pack-destination dist/npm --silent)"
          platform_tarball="$(npm pack dist/npm/ptah-linux-x64 --pack-destination dist/npm --silent)"
          mkdir dist/npm-smoke
          cd dist/npm-smoke
          npm install --offline --ignore-scripts --no-save \
            "../npm/${root_tarball}" \
            "../npm/${compat_tarball}" \
            "../npm/${platform_tarball}"
          npx --no @stokaro/ptah version | grep -F "Version: ${version}"
          npx --no @stokaro/ptah-compat version | grep -F "Version: ${version}"
          npx --no atlas version | grep -F "Version: ${version}"
          npx --no --package=@stokaro/ptah ptah-ls --version | grep -F "Version: ${version}"

  release-check-gate:
    name: Release check gate
    if: ${{ !cancelled() && github.event_name == 'pull_request' }}
    needs: [scope, goreleaser-check]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Verify the aggregate result
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          CODE_SCOPE: ${{ needs.scope.outputs.code }}
          GORELEASER_RESULT: ${{ needs.goreleaser-check.result }}
        run: |
          scripts/check-ci-scope-gate.sh --selftest
          scripts/check-ci-scope-gate.sh \
            --scope-result "$SCOPE_RESULT" \
            --scope "$CODE_SCOPE" \
            --scoped "goreleaser-check=$GORELEASER_RESULT"

  release:
    name: release
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # `id-token: write` signs the checksum file and the SBOMs: GoReleaser's
    # `signs:` runs `cosign sign-blob` keylessly, and cosign exchanges the
    # job's OIDC token for a Fulcio certificate naming this workflow at the
    # tag. The image index is signed by sign-images below. The pull-request
    # jobs above build unsigned snapshots with read-only permissions of their
    # own.
    permissions:
      contents: write
      packages: write
      id-token: write
    # The one value sign-images needs from this job. A job output survives a
    # rerun of the failed jobs, so a signing job run again signs the digest
    # this job published rather than one a new build would produce.
    outputs:
      image-digest: ${{ steps.image.outputs.digest }}
    steps:
      # First, before the checkout and the eleven minutes of build behind it.
      # GoReleaser reaches the Homebrew formula only after the release assets
      # and the container images are already pushed, so a token discovered
      # missing there leaves a half-published release behind. It costs seconds
      # to learn it here instead.
      #
      # This is the other half of stokaro/ptah#2361. `skip_upload` in
      # .goreleaser.yaml no longer turns an absent token into a quietly
      # narrower release; these two steps are what turn it into a legible
      # failure.
      #
      # Minting here rather than beside GoReleaser is also what makes the
      # presence check a real check: a key that cannot mint fails in the same
      # seconds an absent one does. An installation token lives an hour and
      # this job is capped at 40 minutes, so it cannot outlive the run that
      # holds it. `scripts/check-app-token-lifetime.sh` holds that margin,
      # because raising the timeout would break the formula upload alone --
      # after the assets and the images are already pushed.
      - name: Mint a GitHub App token for the tap
        id: app-token
        if: vars.PUBLISH_APP_ID != ''
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.PUBLISH_APP_ID }}
          private-key: ${{ secrets.PUBLISH_APP_KEY }}
          owner: stokaro
          repositories: homebrew-ptah

      - name: The Homebrew tap token must be present
        id: tap-token
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          PAT: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          # App first. Both write the formula the same way, and the app one does
          # not expire on a date somebody picked.
          #
          # The second rung stays until a release has actually published through
          # the app. Nothing here is dispatchable -- this job runs on a tag push
          # alone -- so the app path cannot be proven the way the action publish
          # and the site redeploy were, and a credential that fails here fails
          # after the assets and the images are already out. The line below
          # names which one ran; when it has said "as the app" for a release,
          # the PAT rung and the HOMEBREW_TAP_TOKEN secret both go.
          if [ -n "${APP_TOKEN}" ]; then
            echo "::add-mask::${APP_TOKEN}"
            echo "value=${APP_TOKEN}" >>"${GITHUB_OUTPUT}"
            echo "the formula is written as the app"
          elif [ -n "${PAT}" ]; then
            echo "::add-mask::${PAT}"
            echo "value=${PAT}" >>"${GITHUB_OUTPUT}"
            echo "the formula is written as HOMEBREW_TAP_TOKEN"
          else
            echo "::error::no tap credential is configured. The Homebrew formula would not reach stokaro/homebrew-ptah, and the release would otherwise finish green with one channel missing. Set the PUBLISH_APP_ID variable with a PUBLISH_APP_KEY secret, giving the app contents:write on stokaro/homebrew-ptah, then re-run this job." >&2
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # sign-images refuses a tag its certificate identity cannot name, and a
      # run whose workflow is not the one that identity names. Asked here,
      # before anything is built, so such a tag fails with nothing published
      # rather than after the images and the GitHub release are public.
      - name: The tag is one the release can sign
        run: scripts/check-release-image-signatures.sh preflight "$GITHUB_REF_NAME"

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Docker Hub is a mirror of GHCR rather than a move, and both logins run
      # BEFORE GoReleaser pushes anything. That ordering is the cheap half of
      # "both registries or neither": the ordinary failure is a bad or expired
      # credential, and proving both here stops the run before either registry
      # has the tag (stokaro/ptah#2362).
      #
      # The account is a secret rather than `github.repository_owner`, because
      # the two are different things that happen to look alike. `stokaro` on
      # Docker Hub is an ORGANIZATION, and a `dckr_pat_` token belongs to a
      # person who is a member of it -- logging in as the organization answers
      # `unauthorized: incorrect username or password`, measured before this
      # line was written. The image namespace stays `stokaro/ptah`; only the
      # identity presenting the credential differs.
      - uses: docker/login-action@v4
        with:
          registry: docker.io
          username: ${{ secrets.DOCKER_HUB_USER }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - uses: sigstore/cosign-installer@v4.1.3

      - uses: anchore/sbom-action/download-syft@v0.24.3

      # GoReleaser writes the changelog from the tag `git describe` finds
      # before this one, whatever its name. provider-sdk/vX.Y.Z tags sit on
      # master as well, so the nearest tag is often an SDK tag: measured with
      # GoReleaser v2.19.0 and a local v0.16.0 on d22c5bfd8, the previous tag
      # was provider-sdk/v0.3.0 and the changelog held two of the 71 commits
      # since v0.15.0. The previous release is the nearest v* tag, named
      # explicitly.
      - name: Find the previous release tag
        id: previous-release
        run: |
          set -euo pipefail
          previous="$(git describe --tags --abbrev=0 --match 'v[0-9]*' "${GITHUB_REF_NAME}^")"
          echo "tag=${previous}" >>"${GITHUB_OUTPUT}"
          echo "the changelog runs from ${previous} to ${GITHUB_REF_NAME}"

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: v2.20.2
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ github.ref_name }}
          GORELEASER_PREVIOUS_TAG: ${{ steps.previous-release.outputs.tag }}
          # The name is .goreleaser.yaml's; what it carries is now whichever
          # credential the step above resolved.
          HOMEBREW_TAP_TOKEN: ${{ steps.tap-token.outputs.value }}

      # The digest buildx reported for the version tag's image index, as
      # GoReleaser recorded it in dist/artifacts.json. It is this job's output
      # and everything sign-images does is about it: the registries are held to
      # it, and it is what gets signed.
      - name: Find the image index this release pushed
        id: image
        run: |
          set -euo pipefail
          digest="$(scripts/check-release-image-signatures.sh digest "${GITHUB_REF_NAME#v}" dist/artifacts.json)"
          echo "digest=${digest}" >>"${GITHUB_OUTPUT}"
          echo "GoReleaser pushed ${digest} for ${GITHUB_REF_NAME#v}"

  # Signing is a job of its own so that it can be run again alone. "Re-run
  # failed jobs" on a release whose signing failed reruns this job with the
  # digest the release job published, under the same identity, and builds
  # nothing. A full rerun builds a new index instead; docs/release_process.md
  # step 7 says what that leaves behind. This job holds the OIDC token that
  # signs the image index and the push credentials that store the signatures,
  # and runs no build.
  sign-images:
    name: Sign the release images
    needs: release
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      PUSHED_DIGEST: ${{ needs.release.outputs.image-digest }}
    steps:
      - uses: actions/checkout@v7

      # A signature is pushed to the registry beside the image, so both
      # logins are push credentials. The account is a person in the
      # `stokaro` Docker Hub organization; see the release job.
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/login-action@v4
        with:
          registry: docker.io
          username: ${{ secrets.DOCKER_HUB_USER }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - uses: sigstore/cosign-installer@v4.1.3

      # The mirror, verified rather than assumed.
      #
      # "Both registries or neither" is a property of what a READER can pull,
      # so it is checked the way a reader would: anonymously, over the registry
      # API, resolving each tag to the digest of its image index. Equal
      # digests mean the same image, and an absent tag on one host is the state
      # this exists to refuse -- a reader following the install page cannot tell
      # which registry is behind, which is what made #2362 three faults instead
      # of one.
      #
      # Anonymous on purpose. The job holds a push credential for both hosts,
      # and a check that used it would pass for an image the public cannot
      # reach -- the exact fault this issue opened with.
      #
      # The version tag is also held to the digest the release job pushed, and
      # read again for up to a minute while a host is behind. Agreement alone
      # would accept two registries that both serve an image from another
      # run, and the next step would then sign a digest no reader resolves.
      - name: Both registries carry this release
        run: scripts/check-release-image-mirror.sh "${GITHUB_REF_NAME#v}" "$PUSHED_DIGEST"

      # Signed here rather than by GoReleaser's `docker_signs`, which runs
      # inside the publish phase before the step above: the signature then
      # covers the digest both registries were just proven to serve anonymously
      # for the version tag, not only the digest buildx reported. One signature
      # per registry, because a signature is stored beside the image it signs and
      # Docker Hub does not see one pushed to GHCR. By digest, never by tag
      # (stokaro/ptah#5977).
      - name: Sign the image index at both registries
        run: scripts/check-release-image-signatures.sh sign "$GITHUB_REF_NAME" "$PUSHED_DIGEST"

      # What this step refuses is a run that left either registry without a
      # signature. It reads each registry anonymously, as a reader does, and
      # runs the `cosign verify` the install page documents, pinned to this
      # workflow at this tag and to the GitHub Actions issuer, then requires the
      # verified claim to name the pushed digest. A registry that has not
      # served a new signature yet is read again for up to a minute.
      - name: Both registries serve a verifiable signature
        run: scripts/check-release-image-signatures.sh verify "$GITHUB_REF_NAME" "$PUSHED_DIGEST"

  # npm waits for the image signatures as well as the release. npm never
  # accepts a version number twice, even after an unpublish, so it is the one
  # channel a failed release cannot take back. While the signing job fails,
  # the release is either rerun or abandoned for the next version, and an
  # abandoned version must not have reached npm.
  npm-publish:
    name: Publish npm CLI packages
    needs: [release, sign-images]
    if: github.event_name == 'push' && vars.PTAH_NPM_PUBLISH == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - uses: sigstore/cosign-installer@v4.1.3

      - name: Download and verify release archives
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          mkdir -p "$RUNNER_TEMP/ptah-assets"
          gh release download "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" \
            -p checksums.txt -p checksums.txt.sigstore.json \
            -p "ptah_${version}_*.tar.gz" -p "ptah_${version}_*.zip" \
            --dir "$RUNNER_TEMP/ptah-assets"
          cosign verify-blob \
            --bundle "$RUNNER_TEMP/ptah-assets/checksums.txt.sigstore.json" \
            --certificate-identity "https://github.com/stokaro/ptah/.github/workflows/release.yml@refs/tags/$GITHUB_REF_NAME" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "$RUNNER_TEMP/ptah-assets/checksums.txt"
          node npm/scripts/stage.mjs --version "$version" \
            --assets "$RUNNER_TEMP/ptah-assets" --output "$RUNNER_TEMP/ptah-npm"

      - name: Publish platform packages and CLI packages
        run: node npm/scripts/publish.mjs --staged "$RUNNER_TEMP/ptah-npm"
