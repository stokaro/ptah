name: Atlas CE Oracle

on:
  push:
    branches:
      - master
  pull_request:
  schedule:
    - cron: '41 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  differential-and-corpus:
    name: differential and corpus
    runs-on: ubuntu-latest
    timeout-minutes: 40

    env:
      PTAH_ATLAS_FUZZ_N: '200'
      # The column-type conformance run needs a real PostgreSQL dev database.
      # The binary resolves a column type by materializing it there, so a run
      # without a server could not tell a type it does not model from a type the
      # engine does not have -- and those are the two verdicts that run exists to
      # keep apart.
      PTAH_ATLAS_ORACLE_POSTGRES_DEV_URL: 'postgres://postgres:pw@localhost:5432/dev?sslmode=disable&search_path=public'
      # A second dev database, REALM-scoped: no search_path, so the binary is
      # willing to materialize a document declaring more than one schema. The
      # one above is deliberately scoped to `public` and refuses such a document
      # with `cannot use HCL with more than 1 schema when dev-url is limited to
      # schema "public"`, which is a verdict about the dev URL rather than about
      # the document. It is a SEPARATE database because a realm-scoped read
      # requires a clean one: measured on PostgreSQL 17, a leftover schema makes
      # the next read fail with `sql/migrate: connected database is not clean:
      # found schema "other"`, so it must not share with the runs above.
      PTAH_ATLAS_ORACLE_POSTGRES_REALM_DEV_URL: 'postgres://postgres:pw@localhost:5432/realmdev?sslmode=disable'

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: pw
          POSTGRES_DB: dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - name: Configure oracle path
        run: echo "PTAH_ATLAS_ORACLE=$RUNNER_TEMP/ptah-atlas-ce/atlas" >> "$GITHUB_ENV"

      # The realm-scoped dev database the two-schema document needs. The service
      # creates only `dev`, and that one is scoped to a single schema on purpose.
      - name: Create the realm-scoped dev database
        run: >-
          PGPASSWORD=pw psql -h localhost -p 5432 -U postgres -d postgres
          -v ON_ERROR_STOP=1 -c 'CREATE DATABASE realmdev'

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Install Ptah dependencies
        run: GOWORK=off go mod download

      - name: Build pinned Atlas CE oracle
        run: scripts/build-atlas-ce-oracle.sh "$PTAH_ATLAS_ORACLE"

      - name: Verify migration-directory query contract
        run: >-
          go test -tags=integration
          ./integration/atlasoracle/migratedirquery
          -count=1

      - name: Verify Flyway revision identity contract
        run: >-
          go test -tags=integration
          ./integration/atlasoracle/flywayrevision
          -count=1

      - name: Regenerate Atlas CE corpus
        run: >-
          internal/atlasmigrateimport/testdata/ce-sums/regenerate.sh
          "$PTAH_ATLAS_ORACLE"

      - name: Verify corpus is current
        run: |
          corpus=internal/atlasmigrateimport/testdata/ce-sums
          git diff --exit-code -- "$corpus"
          git status --short --untracked-files=all -- "$corpus" > "$RUNNER_TEMP/atlas-corpus-status"
          cat "$RUNNER_TEMP/atlas-corpus-status"
          test ! -s "$RUNNER_TEMP/atlas-corpus-status"

      - name: Run migrate apply interoperability controls
        run: go test -tags integration ./integration/atlasoracle/migrateapply -count=1

  complete-integration:
    name: complete integration contour
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    # Reusable workflows may preserve or reduce caller permissions, but cannot
    # add scopes that the calling job did not grant.
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/go-integration-tests.yml
