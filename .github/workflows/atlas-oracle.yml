name: Atlas CE Oracle

on:
  push:
    branches:
      - master
  pull_request:
  schedule:
    - cron: '41 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  differential-and-corpus:
    name: differential and corpus
    runs-on: ubuntu-latest
    timeout-minutes: 40

    env:
      PTAH_ATLAS_FUZZ_N: '200'
      # The column-type conformance run needs a real PostgreSQL dev database.
      # The binary resolves a column type by materializing it there, so a run
      # without a server could not tell a type it does not model from a type the
      # engine does not have -- and those are the two verdicts that run exists to
      # keep apart.
      PTAH_ATLAS_ORACLE_POSTGRES_DEV_URL: 'postgres://postgres:pw@localhost:5432/dev?sslmode=disable&search_path=public'

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: pw
          POSTGRES_DB: dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - name: Configure oracle path
        run: echo "PTAH_ATLAS_ORACLE=$RUNNER_TEMP/ptah-atlas-ce/atlas" >> "$GITHUB_ENV"

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Install Ptah dependencies
        run: GOWORK=off go mod download

      - name: Build pinned Atlas CE oracle
        run: scripts/build-atlas-ce-oracle.sh "$PTAH_ATLAS_ORACLE"

      - name: Verify differential test selection
        run: |
          GOWORK=off go test -list '^TestSumFileNamesDifferentialFuzz' \
            ./internal/atlasmigrateimport > "$RUNNER_TEMP/atlas-differential-tests"
          cat "$RUNNER_TEMP/atlas-differential-tests"
          grep -Fx 'TestSumFileNamesDifferentialFuzz' "$RUNNER_TEMP/atlas-differential-tests"
          grep -Fx 'TestSumFileNamesDifferentialFuzzExplicitLayout' "$RUNNER_TEMP/atlas-differential-tests"
          grep -Fx 'TestSumFileNamesDifferentialFuzzRealisticFlyway' "$RUNNER_TEMP/atlas-differential-tests"
          grep -Fx 'TestSumFileNamesDifferentialFuzzOtherFormats' "$RUNNER_TEMP/atlas-differential-tests"
          test "$(grep -c '^TestSumFileNamesDifferentialFuzz' "$RUNNER_TEMP/atlas-differential-tests")" -eq 4

      - name: Run differential oracle tests
        run: >-
          GOWORK=off go test -count=1
          -run '^TestSumFileNamesDifferentialFuzz(RealisticFlyway|OtherFormats)?$'
          ./internal/atlasmigrateimport

      # The schema-HCL unknown-name policy (stokaro/ptah#1016) is the only other
      # thing in this repo whose contract IS the community binary's behavior. It
      # is listed before it is run so an empty selection fails the job instead of
      # reporting a green run that measured nothing.
      - name: Verify schema-HCL conformance selection
        run: |
          GOWORK=off go test -list '^TestOracle' \
            ./internal/atlashcl > "$RUNNER_TEMP/atlas-schema-hcl-tests"
          cat "$RUNNER_TEMP/atlas-schema-hcl-tests"
          grep -Fx 'TestOracleAcceptsAndDropsUnknownSchemaHCLNames' "$RUNNER_TEMP/atlas-schema-hcl-tests"
          grep -Fx 'TestOracleRefusesUnevaluableDroppedBodies' "$RUNNER_TEMP/atlas-schema-hcl-tests"
          grep -Fx 'TestOracleAcceptsReferencesPtahRefuses' "$RUNNER_TEMP/atlas-schema-hcl-tests"
          grep -Fx 'TestOraclePartitionIsDialectSplit' "$RUNNER_TEMP/atlas-schema-hcl-tests"
          test "$(grep -c '^TestOracle' "$RUNNER_TEMP/atlas-schema-hcl-tests")" -eq 4

      - name: Run schema-HCL conformance tests
        run: |
          GOWORK=off go test -count=1 -v -run '^TestOracle' ./internal/atlashcl \
            > "$RUNNER_TEMP/atlas-schema-hcl-run" 2>&1 || {
              cat "$RUNNER_TEMP/atlas-schema-hcl-run"
              exit 1
            }
          cat "$RUNNER_TEMP/atlas-schema-hcl-run"
          # A missing oracle skips these silently. That is the exact failure
          # mode this job exists to prevent, so a skip fails the job.
          ! grep -q 'SKIPPED' "$RUNNER_TEMP/atlas-schema-hcl-run"

      # The atlas.hcl file() sandbox (stokaro/ptah#1042) is a deliberate
      # divergence, so the community side of it has to stay measured: if a later
      # build starts refusing these reads, the divergence is over and this run
      # is what says so. Listed before it is run, for the same reason as above.
      - name: Verify atlas.hcl file() conformance selection
        run: |
          GOWORK=off go test -list '^TestOracle' \
            ./config/projectconfig > "$RUNNER_TEMP/atlas-file-sandbox-tests"
          cat "$RUNNER_TEMP/atlas-file-sandbox-tests"
          grep -Fx 'TestOracleReadsFilesOutsideTheAtlasHCLDirectory' "$RUNNER_TEMP/atlas-file-sandbox-tests"
          grep -Fx 'TestOracleEvaluatesTheFileCallItIsGiven' "$RUNNER_TEMP/atlas-file-sandbox-tests"
          grep -Fx 'TestOraclePlacesOutsideFileContentsWhereTheCallerCanSeeThem' "$RUNNER_TEMP/atlas-file-sandbox-tests"
          test "$(grep -c '^TestOracle' "$RUNNER_TEMP/atlas-file-sandbox-tests")" -eq 3

      - name: Run atlas.hcl file() conformance tests
        run: |
          GOWORK=off go test -count=1 -v -run '^TestOracle' ./config/projectconfig \
            > "$RUNNER_TEMP/atlas-file-sandbox-run" 2>&1 || {
              cat "$RUNNER_TEMP/atlas-file-sandbox-run"
              exit 1
            }
          cat "$RUNNER_TEMP/atlas-file-sandbox-run"
          # A missing oracle skips these silently. That is the exact failure
          # mode this job exists to prevent, so a skip fails the job.
          ! grep -q 'SKIPPED' "$RUNNER_TEMP/atlas-file-sandbox-run"

      # The set of column types the HCL schema models is the third contract in
      # this repository whose authority is the community binary rather than any
      # document (stokaro/ptah#1138). A wrong row emits HCL that binary refuses
      # to read, so the set is re-measured here instead of being trusted. The
      # set of top-level BLOCK types it refuses is the same kind of contract
      # (stokaro/ptah#1251): ptah-compat omits those blocks by default, and a
      # list nothing re-measures would go on withholding a construct that binary
      # started modeling. The spelling of a table REFERENCE is another
      # (stokaro/ptah#1260): `table.<schema>.<name>` costs the whole document,
      # so the rendered output is put to that binary here rather than trusted.
      # The last one is the WHOLE inspected document (stokaro/ptah#1234): a
      # permission body that does not evaluate and a `schema.<name>` reference
      # nothing declares are properties of the file rather than of any one
      # attribute, so neither is visible to the runs above.
      # All of them live in internal/atlashclrender and are listed before they
      # are run, for the same reason as above.
      - name: Verify HCL render conformance selection
        run: |
          GOWORK=off go test -list '^TestOracle' \
            ./internal/atlashclrender > "$RUNNER_TEMP/atlas-column-type-tests"
          cat "$RUNNER_TEMP/atlas-column-type-tests"
          grep -Fx 'TestOracleModeledColumnTypesMatchTheBinary' "$RUNNER_TEMP/atlas-column-type-tests"
          grep -Fx 'TestOracleAcceptsTheWrapItFallsBackTo' "$RUNNER_TEMP/atlas-column-type-tests"
          grep -Fx 'TestOracleAtlasRefusedBlockTypesMatchTheBinary' "$RUNNER_TEMP/atlas-column-type-tests"
          grep -Fx 'TestOracleToleratesTheBlockTypesPtahStillRenders' "$RUNNER_TEMP/atlas-column-type-tests"
          grep -Fx 'TestOracleReadsTheReferenceSpellingPtahRenders' "$RUNNER_TEMP/atlas-column-type-tests"
          grep -Fx 'TestOracleReadsTheInspectedDocumentPtahRenders' "$RUNNER_TEMP/atlas-column-type-tests"
          test "$(grep -c '^TestOracle' "$RUNNER_TEMP/atlas-column-type-tests")" -eq 6

      - name: Run HCL render conformance tests
        run: |
          GOWORK=off go test -count=1 -v -run '^TestOracle' ./internal/atlashclrender \
            > "$RUNNER_TEMP/atlas-column-type-run" 2>&1 || {
              cat "$RUNNER_TEMP/atlas-column-type-run"
              exit 1
            }
          cat "$RUNNER_TEMP/atlas-column-type-run"
          # A missing oracle skips these silently, and so does a missing dev
          # database URL -- which would leave every PostgreSQL row unmeasured
          # while the job stayed green. Both are fatal here.
          ! grep -q 'SKIPPED' "$RUNNER_TEMP/atlas-column-type-run"
          # A selection that matched no subtest is the other way to stay green
          # while measuring nothing: the refused list is the whole subject here,
          # so its rows are named rather than counted in bulk.
          grep -Fq 'TestOracleAtlasRefusedBlockTypesMatchTheBinary/postgres/base' "$RUNNER_TEMP/atlas-column-type-run"
          grep -Fq 'TestOracleAtlasRefusedBlockTypesMatchTheBinary/postgres/refused/extension' "$RUNNER_TEMP/atlas-column-type-run"
          grep -Fq 'TestOracleAtlasRefusedBlockTypesMatchTheBinary/postgres/refused/policy' "$RUNNER_TEMP/atlas-column-type-run"
          grep -Fq 'TestOracleAtlasRefusedBlockTypesMatchTheBinary/postgres/refused/sequence' "$RUNNER_TEMP/atlas-column-type-run"
          grep -Fq 'TestOracleToleratesTheBlockTypesPtahStillRenders/postgres/tolerated/wibble' "$RUNNER_TEMP/atlas-column-type-run"
          grep -Fq 'TestOracleToleratesTheBlockTypesPtahStillRenders/sqlite/tolerated/sequence' "$RUNNER_TEMP/atlas-column-type-run"
          # Same reason for the reference spelling (stokaro/ptah#1260): its two
          # rows are a pair, and only the pair is a measurement. `rendered`
          # alone would pass on a build that had stopped shortening anything,
          # and `qualified` alone says nothing about what Ptah writes today.
          grep -Fq 'TestOracleReadsTheReferenceSpellingPtahRenders/postgres/rendered' "$RUNNER_TEMP/atlas-column-type-run"
          grep -Fq 'TestOracleReadsTheReferenceSpellingPtahRenders/postgres/qualified' "$RUNNER_TEMP/atlas-column-type-run"
          grep -Fq 'TestOracleReadsTheReferenceSpellingPtahRenders/sqlite/rendered' "$RUNNER_TEMP/atlas-column-type-run"
          grep -Fq 'TestOracleReadsTheReferenceSpellingPtahRenders/sqlite/qualified' "$RUNNER_TEMP/atlas-column-type-run"
          # The array rows are a pair for the same reason (stokaro/ptah#1138).
          # The wrapped row alone would pass on a build that had stopped
          # refusing anything, and the quoted row alone says nothing about the
          # spelling Ptah writes today. Both are named so a selection that
          # silently stopped matching them cannot leave the job green.
          grep -Fq 'TestOracleAcceptsTheWrapItFallsBackTo/postgres_wraps_a_sized_array_whose_element_name_is_modeled' "$RUNNER_TEMP/atlas-column-type-run"
          grep -Fq 'TestOracleAcceptsTheWrapItFallsBackTo/postgres_refuses_that_same_array_quoted' "$RUNNER_TEMP/atlas-column-type-run"
          grep -Fq 'TestOracleAcceptsTheWrapItFallsBackTo/postgres_refuses_an_array_written_bare' "$RUNNER_TEMP/atlas-column-type-run"

          # And for the whole-document run (stokaro/ptah#1234). Each `rendered`
          # row is only a measurement next to the mutation that makes the same
          # document unreadable, so both halves of each pair are named. The
          # grant-only document is the one no prediction reaches: it is what an
          # EMPTY database inspects to, with no table anywhere to declare a
          # schema from.
          grep -Fq 'TestOracleReadsTheInspectedDocumentPtahRenders/postgres/a_table_with_grants/rendered' "$RUNNER_TEMP/atlas-column-type-run"
          grep -Fq 'TestOracleReadsTheInspectedDocumentPtahRenders/postgres/a_table_with_grants/unreadable/PUBLIC_written_bare' "$RUNNER_TEMP/atlas-column-type-run"
          grep -Fq 'TestOracleReadsTheInspectedDocumentPtahRenders/postgres/a_table_whose_roles_were_excluded/rendered' "$RUNNER_TEMP/atlas-column-type-run"
          grep -Fq 'TestOracleReadsTheInspectedDocumentPtahRenders/postgres/a_table_whose_roles_were_excluded/unreadable/a_grantee_reference_with_no_role_block_anywhere' "$RUNNER_TEMP/atlas-column-type-run"
          grep -Fq 'TestOracleReadsTheInspectedDocumentPtahRenders/postgres/nothing_but_the_grant_every_database_has/rendered' "$RUNNER_TEMP/atlas-column-type-run"
          grep -Fq 'TestOracleReadsTheInspectedDocumentPtahRenders/postgres/nothing_but_the_grant_every_database_has/unreadable/a_schema_reference_with_no_block' "$RUNNER_TEMP/atlas-column-type-run"
          grep -Fq 'TestOracleReadsTheInspectedDocumentPtahRenders/sqlite/nothing_but_the_grant_every_database_has/rendered' "$RUNNER_TEMP/atlas-column-type-run"

      - name: Regenerate Atlas CE corpus
        run: >-
          internal/atlasmigrateimport/testdata/ce-sums/regenerate.sh
          "$PTAH_ATLAS_ORACLE"

      - name: Verify corpus is current
        run: |
          corpus=internal/atlasmigrateimport/testdata/ce-sums
          git diff --exit-code -- "$corpus"
          git status --short --untracked-files=all -- "$corpus" > "$RUNNER_TEMP/atlas-corpus-status"
          cat "$RUNNER_TEMP/atlas-corpus-status"
          test ! -s "$RUNNER_TEMP/atlas-corpus-status"
