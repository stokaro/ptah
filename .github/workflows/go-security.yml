name: Go Security

on:
  push:
    branches:
      - master
  pull_request:
  schedule:
    - cron: '43 3 * * *'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

concurrency:
  group: go-security-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scope:
    name: scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.decide.outputs.code }}
      reason: ${{ steps.decide.outputs.reason }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Self-test the scope rule
        run: scripts/ci-diff-scope.sh --selftest

      - name: Decide whether this diff can affect Go validation
        id: decide
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "reason=not a pull request, so everything runs" >> "$GITHUB_OUTPUT"
            echo "ci-diff-scope: code=true (not a pull request)"
            exit 0
          fi
          scripts/ci-diff-scope.sh \
            "${{ github.event.pull_request.base.sha }}" \
            "${{ github.event.pull_request.head.sha }}"

      - name: Report the decision in the job summary
        run: |
          {
            printf '### Go validation scope\n\n'
            printf -- "- run Go validation: \`%s\`\n" "${{ steps.decide.outputs.code }}"
            printf -- '- because: %s\n' "${{ steps.decide.outputs.reason }}"
          } >> "$GITHUB_STEP_SUMMARY"

  govulncheck:
    name: govulncheck
    needs: scope
    if: github.event_name != 'pull_request' || needs.scope.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Install dependencies
        run: go mod download

      - name: Run govulncheck
        run: go tool govulncheck ./...

  gosec:
    name: gosec
    needs: scope
    if: github.event_name != 'pull_request' || needs.scope.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Install dependencies
        run: go mod download

      - name: Run gosec
        uses: golangci/golangci-lint-action@v9
        with:
          args: --enable-only=gosec --output.sarif.path=gosec.sarif --timeout=30m
          version: v2.13.2

      - name: Upload gosec SARIF
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@v4.37.9
        with:
          sarif_file: gosec.sarif
          category: gosec

  coverage:
    name: coverage
    needs: scope
    if: github.event_name != 'pull_request' || needs.scope.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Install dependencies
        run: go mod download

      - name: Check coverage
        run: scripts/check-coverage.sh

  security-gate:
    name: Security gate
    if: always() && github.event_name == 'pull_request'
    needs: [scope, govulncheck, gosec, coverage]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Verify the aggregate result
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          CODE_SCOPE: ${{ needs.scope.outputs.code }}
          GOVULNCHECK_RESULT: ${{ needs.govulncheck.result }}
          GOSEC_RESULT: ${{ needs.gosec.result }}
          COVERAGE_RESULT: ${{ needs.coverage.result }}
        run: |
          scripts/check-ci-scope-gate.sh --selftest
          scripts/check-ci-scope-gate.sh \
            --scope-result "$SCOPE_RESULT" \
            --scope "$CODE_SCOPE" \
            --scoped "govulncheck=$GOVULNCHECK_RESULT" \
            --scoped "gosec=$GOSEC_RESULT" \
            --scoped "coverage=$COVERAGE_RESULT"
