name: Go Unit Tests

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  unit-tests:
    name: unit-tests
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v7
      
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      
      - name: Install dependencies
        run: go mod download

      - name: Run unit tests
        run: |
          # Run unit tests excluding integration tests
          # These tests don't require database connections
          go test -v -race ./... -timeout 10m

  windows-publication:
    name: windows-publication
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Install dependencies
        run: go mod download

      - name: Run Windows rooted publication primitive tests
        run: go test -v -count=1 ./internal/fsdurable ./internal/pathguard -timeout 5m

      - name: Run Windows publication consumer tests
        run: go test -v -count=1 ./internal/migratesum ./internal/devlock -timeout 5m

      - name: Run Windows Go annotation publication tests
        run: go test -v -count=1 ./internal/goannotationcleanup ./internal/goannotationexport -timeout 5m

      - name: Run Windows migration publication tests
        run: go test -v -count=1 ./internal/atlasmigrate -run '^(TestPublishArtifactsLocked_|TestGenerateDiff_PreparedContentsArePublishedWithMatchingChecksum)' -timeout 5m

      - name: Run Windows migration generator tests
        run: go test -v -count=1 ./migration/generator -run '^TestMigrationPlanWriteFiles_' -timeout 5m

      - name: Run Windows database identity and schema plan safety tests
        run: go test -v -count=1 ./internal/atlasurl ./internal/atlasschema ./cmd/atlas -run '^(TestSameDatabaseEndpoint_|TestMayAddressSameDatabase_|TestSimulateOnDev_|TestSchemaPlanValidate)' -timeout 5m
