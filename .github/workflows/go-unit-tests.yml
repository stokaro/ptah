name: Go Unit Tests

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: go-unit-tests-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scope:
    name: scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.decide.outputs.code }}
      reason: ${{ steps.decide.outputs.reason }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Self-test the scope rule
        run: scripts/ci-diff-scope.sh --selftest

      - name: Decide whether this diff can affect Go validation
        id: decide
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "reason=not a pull request, so everything runs" >> "$GITHUB_OUTPUT"
            echo "ci-diff-scope: code=true (not a pull request)"
            exit 0
          fi
          scripts/ci-diff-scope.sh \
            "${{ github.event.pull_request.base.sha }}" \
            "${{ github.event.pull_request.head.sha }}"

      - name: Report the decision in the job summary
        run: |
          {
            printf '### Go validation scope\n\n'
            printf -- "- run Go validation: \`%s\`\n" "${{ steps.decide.outputs.code }}"
            printf -- '- because: %s\n' "${{ steps.decide.outputs.reason }}"
          } >> "$GITHUB_STEP_SUMMARY"

  unit-tests:
    name: unit-tests
    needs: scope
    if: github.event_name != 'pull_request' || needs.scope.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    
    steps:
      - uses: actions/checkout@v7
      
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      
      - name: Install dependencies
        run: go mod download

      - name: Run unit tests
        run: |
          # Run unit tests excluding integration tests
          # These tests don't require database connections
          go test -v -race ./... -timeout 10m

  windows-publication:
    name: windows-publication
    needs: scope
    if: github.event_name != 'pull_request' || needs.scope.outputs.code == 'true'
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Install dependencies
        run: go mod download

      - name: Run Windows rooted publication primitive tests
        run: go test -v -count=1 ./internal/fsdurable ./internal/pathguard -timeout 5m

      - name: Run Windows publication consumer tests
        run: go test -v -count=1 ./internal/migratesum ./internal/devlock -timeout 5m

      - name: Run Windows Go annotation publication tests
        run: go test -v -count=1 ./internal/goannotationcleanup ./internal/goannotationexport -timeout 5m

      - name: Run Windows migration publication tests
        run: go test -v -count=1 ./internal/atlasmigrate -run '^(TestPublishArtifactsLocked_|TestGenerateDiff_PreparedContentsArePublishedWithMatchingChecksum)' -timeout 5m

      - name: Run Windows migration generator tests
        run: go test -v -count=1 ./migration/generator -run '^TestMigrationPlanWriteFiles_' -timeout 5m

      - name: Run Windows database identity and schema plan safety tests
        # ./cmd/atlas/internal/schematests rather than ./cmd/atlas: the
        # TestSchemaPlanValidate tests moved there when cmd/atlas's test files
        # were split by verb (stokaro/ptah#1812). A package list that named only
        # the old home would still pass -- `go test` reports ok for a package
        # whose -run matches nothing -- while running none of them.
        run: go test -v -count=1 ./internal/atlasurl ./internal/atlasschema ./cmd/atlas/internal/schematests -run '^(TestSameDatabaseEndpoint_|TestMayAddressSameDatabase_|TestSimulateOnDev_|TestSchemaPlanValidate)' -timeout 5m

  windows-unit-tests:
    name: windows-unit-tests
    needs: scope
    if: github.event_name != 'pull_request' || needs.scope.outputs.code == 'true'
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      # Git on Windows otherwise converts the repository's LF line endings to
      # CRLF during checkout. Set this before checkout so tests see stored bytes.
      - name: Keep the line endings the repository stores
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Install dependencies
        run: go mod download

      # A package timeout can print thousands of goroutine lines. Keep the raw
      # log in the job and put the actionable package, timing, timeout, and
      # runtime-abort evidence in the summary (stokaro/ptah#2365).
      - name: Run Windows unit tests
        shell: bash
        run: |
          set -uo pipefail
          go test ./... -count=1 -timeout=20m 2>&1 | tee unit-tests.log
          status=${PIPESTATUS[0]}
          if [ "$status" -eq 0 ]; then
            rm -f unit-tests.log
            exit 0
          fi
          {
            echo "### Unit tests"
            echo
            echo '```text'
            # Every failing package, longest first.
            grep -E '^FAIL[[:space:]]+ptah\.run' unit-tests.log | sort -rn -k3
            # The five slowest passing packages show the timeout's context.
            grep -E '^ok[[:space:]]+ptah\.run' unit-tests.log | sort -rn -k3 | head -5
            grep -A 6 -E '^panic: test timed out' unit-tests.log | head -40
            # Windows runtime aborts may use `Exception 0x` rather than a Go
            # panic header, so retain both signatures and enough allocation
            # context to diagnose the fault.
            grep -A 80 -E '^(fatal error:|Exception 0x)' unit-tests.log | head -120
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
          exit "$status"

  unit-test-gate:
    name: Unit test gate
    if: always() && github.event_name == 'pull_request'
    needs: [scope, unit-tests, windows-publication, windows-unit-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Verify the aggregate result
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          CODE_SCOPE: ${{ needs.scope.outputs.code }}
          UNIT_RESULT: ${{ needs.unit-tests.result }}
          WINDOWS_PUBLICATION_RESULT: ${{ needs.windows-publication.result }}
          WINDOWS_UNIT_RESULT: ${{ needs.windows-unit-tests.result }}
        run: |
          scripts/check-ci-scope-gate.sh --selftest
          scripts/check-ci-scope-gate.sh \
            --scope-result "$SCOPE_RESULT" \
            --scope "$CODE_SCOPE" \
            --scoped "unit-tests=$UNIT_RESULT" \
            --scoped "windows-publication=$WINDOWS_PUBLICATION_RESULT" \
            --scoped "windows-unit-tests=$WINDOWS_UNIT_RESULT"
