name: Docs

on:
  push:
    branches: [master]
    tags:
      - 'v*'
  pull_request:

permissions:
  contents: read

env:
  MAX_DOC_TAG_VERSIONS: ${{ vars.MAX_DOC_TAG_VERSIONS || 10 }}

jobs:
  changes:
    name: Detect docs changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      site: ${{ steps.filter.outputs.site }}
      style: ${{ steps.filter.outputs.style }}
      generated: ${{ steps.filter.outputs.generated }}
      examples: ${{ steps.filter.outputs.examples }}
      inference: ${{ steps.filter.outputs.inference }}
      quickstart: ${{ steps.filter.outputs.quickstart }}
    steps:
      - uses: actions/checkout@v7
      - id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            site:
              - 'docs/site/**'
              - '.github/workflows/docs.yml'
            style:
              - 'docs/**'
              - 'examples/**'
              - 'integration/**'
              - 'README.md'
              - '**/README.md'
              - 'AGENTS.md'
              - '.github/workflows/docs.yml'
            generated:
              - 'cmd/**'
              - 'core/**'
              - 'dbschema/**'
              - 'internal/capabilityprobe/**'
              - 'internal/cmdref/**'
              - 'internal/featureinventory/**'
              - 'migration/**'
              - 'docs/feature-inventory.json'
              - 'docs/site/src/content/docs/databases/support-matrix.md'
              - 'docs/site/src/content/docs/reference/native-commands.md'
              - 'docs/site/src/content/docs/reference/command-flags.md'
              - 'docs/site/src/content/docs/reference/lint-rules.md'
              - 'scripts/check-docsync.sh'
              - 'scripts/check-feature-inventory.sh'
              - '.github/workflows/docs.yml'
            examples:
              - 'cmd/**'
              - 'core/**'
              - 'migration/**'
              - 'examples/**'
              - 'scripts/check-examples.sh'
              - 'go.mod'
              - 'go.sum'
              - '.github/workflows/docs.yml'
            inference:
              - 'cmd/inference/**'
              - 'internal/inference*/**'
              - 'docs/site/fixtures/inference-quick-start/**'
              - 'docs/site/scripts/check-inference-quick-start.sh'
              - 'docs/site/src/content/docs/inference/**'
              - 'go.mod'
              - 'go.sum'
              - '.github/workflows/docs.yml'
            quickstart:
              - 'cmd/**'
              - 'core/**'
              - 'dbschema/**'
              - 'internal/quickstart/**'
              - 'migration/**'
              - 'docs/site/src/content/docs/start/**'
              - 'scripts/check-quickstart.sh'
              - 'go.mod'
              - 'go.sum'
              - '.github/workflows/docs.yml'
              - '.github/workflows/quickstart-acceptance.yml'

  style:
    name: Documentation style
    needs: changes
    # The site build only runs for docs/site changes, but the style guide also
    # governs the repository docs, examples, integration docs, package READMEs,
    # and AGENTS.md. Those layers get their own job so a change to one of them
    # cannot merge unchecked.
    if: >-
      ( github.event_name == 'pull_request' && needs.changes.outputs.style == 'true' ) ||
      ( github.event_name == 'push' && github.ref == 'refs/heads/master' &&
        needs.changes.outputs.style == 'true' )
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      # check-style.mjs has no npm dependencies, so this needs no install step.
      # check-limitations.mjs has none either, and it governs a page under
      # docs/site, so it runs here rather than in the site build: the fast job
      # is the one that sees every documentation change.
      #
      # check-terminology.mjs runs here for the same reason and one more: its
      # corpus reaches README.md and docs/*.md, which the site build never sees.
      # It covers the PROSE half of the terminology registry. The other half is
      # the native command tree's help text, which cmd/internal/terminologyguard
      # reads in `go test ./...` -- a Go-only change does not trigger this
      # workflow at all, so putting that half here would have left it ungated.
      - name: Check documentation style
        run: |
          set -euo pipefail
          node docs/site/scripts/check-style.mjs --selftest
          node docs/site/scripts/check-style.mjs
          node docs/site/scripts/check-terminology.mjs --selftest
          node docs/site/scripts/check-terminology.mjs
          node docs/site/scripts/check-limitations.mjs --selftest
          node docs/site/scripts/check-limitations.mjs
          node docs/site/scripts/check-implementation-chronology.mjs --selftest
          node docs/site/scripts/check-implementation-chronology.mjs
          node docs/site/scripts/build-content-inventory.mjs --selftest
          node docs/site/scripts/build-content-inventory.mjs
          node docs/site/scripts/check-editorial-shape.mjs --selftest
          node docs/site/scripts/check-editorial-shape.mjs
          node docs/site/scripts/check-examples.mjs --selftest
          node docs/site/scripts/check-examples.mjs
          node docs/site/scripts/check-visual-assets.mjs --selftest
          node docs/site/scripts/check-visual-assets.mjs
          node docs/site/scripts/check-support-matrix.mjs --selftest
          node docs/site/scripts/check-support-matrix.mjs
          node docs/site/scripts/check-documentation-gate.mjs --selftest
          node docs/site/scripts/check-build-info.mjs --selftest
          node docs/site/scripts/write-build-info.mjs --selftest
          node docs/site/scripts/check-public-docs.mjs --selftest
          node docs/site/scripts/check-matrix-verdict-prose.mjs --selftest
          node docs/site/scripts/check-matrix-verdict-prose.mjs
          node docs/site/scripts/check-matrix-citations.mjs --selftest
          node docs/site/scripts/check-matrix-citations.mjs
          node docs/site/scripts/check-matrix-flag-names.mjs --selftest
          node docs/site/scripts/check-matrix-flag-names.mjs
          node docs/site/scripts/build-feature-matrix.mjs --check
          # The Pages root is assembled by the build job below, which only runs
          # for docs/site changes. This gate reads the workflow and the
          # documentation as well as the scripts, so it belongs in the job that
          # sees every documentation change: retiring the publish step is an
          # edit to this file, and dropping the documented command is an edit to
          # a page.
          node docs/site/scripts/publish-root-assets.mjs --selftest
          node docs/site/scripts/check-pages-root.mjs --selftest
          node docs/site/scripts/check-pages-root.mjs

  build:
    name: Build versioned site
    needs: changes
    if: >-
      ( github.event_name == 'pull_request' && needs.changes.outputs.site == 'true' ) ||
      ( github.event_name == 'push' &&
        ( startsWith(github.ref, 'refs/tags/v') ||
          (github.ref == 'refs/heads/master' && needs.changes.outputs.site == 'true') ) )
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: docs/site/package-lock.json

      - name: Self-test the version generator
        run: node docs/site/scripts/gen-versions.mjs --selftest

      # The route ledger's primary invariant runs with the other site checks
      # below and needs no history. This is the secondary one, and it is here
      # because this job is the only one checked out with fetch-depth: 0.
      #
      # check-route-retirement.mjs iterates the ledger, so a route DELETED from
      # the ledger is a route it never visits: a retirement plus a hand-edited
      # ledger leaves every documentation gate green. Comparing with the merge
      # base is what sees that, and it is deliberately not allowed to skip --
      # a base that will not resolve exits 2 rather than reporting a pass.
      - name: The route ledger must not lose an entry
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/master'
        env:
          PULL_REQUEST_BASE: ${{ github.event_name == 'pull_request' && github.base_ref || '' }}
        run: |
          set -euo pipefail
          # A pull request compares against the branch it targets; a push to
          # master against the commit before it.
          if [ -n "$PULL_REQUEST_BASE" ]; then
            base="origin/${PULL_REQUEST_BASE}"
          else
            base='HEAD^'
          fi
          node docs/site/scripts/check-route-retirement.mjs --against "$base"

      - name: Build edge from the current tree
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/master'
        env:
          DOCS_VERSION: edge
          ASTRO_TELEMETRY_DISABLED: "1"
        run: |
          set -euo pipefail
          cd docs/site
          npm ci
          npm run check:links:selftest
          npm run check:links
          npm run check:docroutes:selftest
          npm run check:redirects:selftest
          npm run check:redirects
          npm run check:route-retirement:selftest
          npm run check:route-retirement
          npm run check:core-doc-links:selftest
          npm run check:core-doc-links
          npm run check:page-health:selftest
          npm run check:page-health
          npm run check:content-inventory:selftest
          npm run check:content-inventory
          npm run check:editorial-shape:selftest
          npm run check:editorial-shape
          npm run check:support-matrix:selftest
          npm run check:support-matrix
          npm run check:exit-codes:selftest
          npm run check:exit-codes
          npm run check:style:selftest
          npm run check:style
          npx playwright install --with-deps chromium
          npm run check:responsive:selftest
          npm run check:glossary:selftest
          npm run check:accessibility:selftest
          npm run check:visual-snapshots:selftest
          npm run check:navigation:selftest
          npm run check:search-ranking:selftest
          npm run build
          # Need the built site, so they run after the build rather than with
          # the other checks.
          npm run check:responsive
          npm run check:glossary
          npm run check:accessibility
          npm run check:visual-snapshots -- --output "$RUNNER_TEMP/ptah-docs-visual-snapshots"
          npm run check:navigation
          npm run check:search-ranking
          npm run check:build-info
          mkdir -p "$GITHUB_WORKSPACE/_site/edge"
          cp -r dist/. "$GITHUB_WORKSPACE/_site/edge/"
          node scripts/write-build-info.mjs \
            --output "$GITHUB_WORKSPACE/_site/edge/build-info.json" \
            --version edge \
            --source-commit "$(git rev-parse HEAD)"

      - name: Upload desktop and mobile review snapshots
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v7
        with:
          name: ptah-docs-visual-snapshots
          path: ${{ runner.temp }}/ptah-docs-visual-snapshots

      - name: Build edge from master
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          DOCS_VERSION: edge
          ASTRO_TELEMETRY_DISABLED: "1"
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"
          git worktree add --force "$workdir" origin/master
          (
            cd "$workdir/docs/site"
            DOCS_VERSION=edge ASTRO_TELEMETRY_DISABLED=1 npm ci
            DOCS_VERSION=edge ASTRO_TELEMETRY_DISABLED=1 npm run check:links:selftest
            DOCS_VERSION=edge ASTRO_TELEMETRY_DISABLED=1 npm run check:links
            if [ -f scripts/check-redirects.mjs ]; then
              DOCS_VERSION=edge ASTRO_TELEMETRY_DISABLED=1 npm run check:redirects:selftest
              DOCS_VERSION=edge ASTRO_TELEMETRY_DISABLED=1 npm run check:redirects
            fi
            if [ -f scripts/check-route-retirement.mjs ]; then
              DOCS_VERSION=edge ASTRO_TELEMETRY_DISABLED=1 npm run check:docroutes:selftest
              DOCS_VERSION=edge ASTRO_TELEMETRY_DISABLED=1 npm run check:route-retirement:selftest
              DOCS_VERSION=edge ASTRO_TELEMETRY_DISABLED=1 npm run check:route-retirement
            fi
            DOCS_VERSION=edge ASTRO_TELEMETRY_DISABLED=1 npm run check:core-doc-links
            DOCS_VERSION=edge ASTRO_TELEMETRY_DISABLED=1 npm run check:page-health:selftest
            DOCS_VERSION=edge ASTRO_TELEMETRY_DISABLED=1 npm run check:page-health
            DOCS_VERSION=edge ASTRO_TELEMETRY_DISABLED=1 npm run check:exit-codes:selftest
            DOCS_VERSION=edge ASTRO_TELEMETRY_DISABLED=1 npm run check:exit-codes
            DOCS_VERSION=edge ASTRO_TELEMETRY_DISABLED=1 npm run check:style:selftest
            DOCS_VERSION=edge ASTRO_TELEMETRY_DISABLED=1 npm run check:style
            DOCS_VERSION=edge ASTRO_TELEMETRY_DISABLED=1 npm run build
          )
          mkdir -p "$GITHUB_WORKSPACE/_site/edge"
          cp -r "$workdir/docs/site/dist/." "$GITHUB_WORKSPACE/_site/edge/"
          git worktree remove --force "$workdir" || true
          node docs/site/scripts/write-build-info.mjs \
            --output "$GITHUB_WORKSPACE/_site/edge/build-info.json" \
            --version edge \
            --source-commit "$(git rev-parse origin/master)"

      - name: Build each released tag
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          for tag in $(git tag -l 'v*' | grep -E '^v[0-9]+\.[0-9]+(\.[0-9]+)?$' | sort -V | tail -n "${MAX_DOC_TAG_VERSIONS:-10}" || true); do
            echo "::group::Building $tag"
            workdir="$(mktemp -d)"
            git worktree add --force "$workdir" "refs/tags/$tag"
            if [ -f "$workdir/docs/site/package.json" ]; then
              if (
                cd "$workdir/docs/site"
                DOCS_VERSION="$tag" ASTRO_TELEMETRY_DISABLED=1 npm ci
                if [ -f scripts/check-links.mjs ]; then
                  DOCS_VERSION="$tag" ASTRO_TELEMETRY_DISABLED=1 npm run check:links:selftest
                  DOCS_VERSION="$tag" ASTRO_TELEMETRY_DISABLED=1 npm run check:links
                else
                  echo "::warning::$tag has no docs link checker; skipping link validation"
                fi
                if [ -f scripts/check-redirects.mjs ]; then
                  DOCS_VERSION="$tag" ASTRO_TELEMETRY_DISABLED=1 npm run check:redirects
                fi
                if [ -f scripts/check-exit-codes.mjs ]; then
                  DOCS_VERSION="$tag" ASTRO_TELEMETRY_DISABLED=1 npm run check:exit-codes
                fi
                if [ -f scripts/check-core-doc-links.mjs ]; then
                  DOCS_VERSION="$tag" ASTRO_TELEMETRY_DISABLED=1 npm run check:core-doc-links
                fi
                if [ -f scripts/check-page-health.mjs ]; then
                  DOCS_VERSION="$tag" ASTRO_TELEMETRY_DISABLED=1 npm run check:page-health
                fi
                DOCS_VERSION="$tag" ASTRO_TELEMETRY_DISABLED=1 npm run build
              ); then
                mkdir -p "$GITHUB_WORKSPACE/_site/$tag"
                cp -r "$workdir/docs/site/dist/." "$GITHUB_WORKSPACE/_site/$tag/"
                node "$GITHUB_WORKSPACE/docs/site/scripts/write-build-info.mjs" \
                  --output "$GITHUB_WORKSPACE/_site/$tag/build-info.json" \
                  --version "$tag" \
                  --source-commit "$(git rev-list -n 1 "$tag")"
              else
                echo "::warning::$tag failed to build; skipping this historical version"
              fi
            else
              echo "::warning::$tag has no docs/site; skipping"
            fi
            git worktree remove --force "$workdir" || true
            echo "::endgroup::"
          done

      - name: Generate root version index and redirect
        if: github.event_name == 'push'
        run: node docs/site/scripts/gen-versions.mjs "$GITHUB_WORKSPACE/_site"

      # The install scripts answer at the Pages root rather than inside a
      # version directory, because the documented command carries no version.
      # `_site` is assembled from scratch on every deploying run and uploaded
      # whole, so a root file exists after a deploy only because that deploy
      # wrote it. This step is what writes them, and it carries the same `push`
      # condition as the version index beside it so a tag deploy publishes them
      # too.
      - name: Publish the install scripts at the site root
        if: github.event_name == 'push'
        run: node docs/site/scripts/publish-root-assets.mjs "$GITHUB_WORKSPACE/_site"

      # Read back what was assembled rather than what the tree holds. Every
      # step above can be right while the directory about to be uploaded is
      # missing a file the documentation publishes, and that 404 is silent: the
      # command keeps being printed and stops working.
      - name: The assembled Pages root carries every published file
        if: github.event_name == 'push'
        run: node docs/site/scripts/check-pages-root.mjs --site "$GITHUB_WORKSPACE/_site"

      - name: Upload Pages artifact
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  inference-quick-start:
    name: Inference quick-start acceptance
    needs: changes
    if: >-
      ( github.event_name == 'pull_request' && needs.changes.outputs.inference == 'true' ) ||
      ( github.event_name == 'push' && github.ref == 'refs/heads/master' &&
        needs.changes.outputs.inference == 'true' )
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Execute the disposable inference tutorial
        env:
          PTAH_DOCKER_CONTEXT: default
        run: docs/site/scripts/check-inference-quick-start.sh

  generated-documentation:
    name: Generated documentation
    needs: changes
    if: >-
      ( github.event_name == 'pull_request' && needs.changes.outputs.generated == 'true' ) ||
      ( github.event_name == 'push' && github.ref == 'refs/heads/master' &&
        needs.changes.outputs.generated == 'true' )
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Verify generated documentation
        run: |
          set -euo pipefail
          scripts/check-docsync.sh
          scripts/check-feature-inventory.sh
          go test ./internal/cmdref -count=1

  example-acceptance:
    name: Example acceptance
    needs: changes
    if: >-
      ( github.event_name == 'pull_request' && needs.changes.outputs.examples == 'true' ) ||
      ( github.event_name == 'push' && github.ref == 'refs/heads/master' &&
        needs.changes.outputs.examples == 'true' )
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Execute supported examples
        run: scripts/check-examples.sh

  quickstart-acceptance:
    needs: changes
    if: >-
      github.event_name == 'pull_request' && needs.changes.outputs.quickstart == 'true'
    uses: ./.github/workflows/quickstart-acceptance.yml

  documentation-gate:
    name: Documentation gate
    if: always() && github.event_name == 'pull_request'
    needs:
      - changes
      - style
      - build
      - generated-documentation
      - example-acceptance
      - inference-quick-start
      - quickstart-acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Verify the aggregate result
        env:
          SITE_CHANGED: ${{ needs.changes.outputs.site }}
          STYLE_CHANGED: ${{ needs.changes.outputs.style }}
          GENERATED_CHANGED: ${{ needs.changes.outputs.generated }}
          EXAMPLES_CHANGED: ${{ needs.changes.outputs.examples }}
          INFERENCE_CHANGED: ${{ needs.changes.outputs.inference }}
          QUICKSTART_CHANGED: ${{ needs.changes.outputs.quickstart }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          SITE_RESULT: ${{ needs.build.result }}
          STYLE_RESULT: ${{ needs.style.result }}
          GENERATED_RESULT: ${{ needs.generated-documentation.result }}
          EXAMPLES_RESULT: ${{ needs.example-acceptance.result }}
          INFERENCE_RESULT: ${{ needs.inference-quick-start.result }}
          QUICKSTART_RESULT: ${{ needs.quickstart-acceptance.result }}
        run: |
          node docs/site/scripts/check-documentation-gate.mjs --selftest
          node docs/site/scripts/check-documentation-gate.mjs

  deploy:
    name: Deploy to GitHub Pages
    needs: [changes, build]
    if: >-
      github.event_name == 'push' &&
        ( startsWith(github.ref, 'refs/tags/v') ||
        (github.ref == 'refs/heads/master' && needs.changes.outputs.site == 'true') )
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: docs-pages-deploy
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5

  public-edge-smoke:
    name: Public edge smoke
    needs: deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: docs/site/package-lock.json
      - name: Install the public smoke-test browser
        working-directory: docs/site
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Verify the deployed edge site
        working-directory: docs/site
        run: >-
          node scripts/check-public-docs.mjs
          --base-url https://stokaro.github.io/ptah/edge/
          --expected-commit "${{ github.sha }}"
