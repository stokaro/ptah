name: Docs

on:
  push:
    branches: [master]
    tags:
      - 'v*'
  pull_request:
    paths:
      # The style check governs every documentation layer, so the workflow has
      # to see changes to all of them. Only the site build is gated on
      # docs/site/** below.
      - 'docs/**'
      - 'examples/**'
      - 'integration/**'
      - 'README.md'
      - '**/README.md'
      - 'AGENTS.md'
      - '.github/workflows/docs.yml'

permissions:
  contents: read

concurrency:
  group: docs-pages
  cancel-in-progress: false

env:
  MAX_DOC_TAG_VERSIONS: ${{ vars.MAX_DOC_TAG_VERSIONS || 10 }}

jobs:
  changes:
    name: Detect docs changes
    runs-on: ubuntu-latest
    outputs:
      docs: ${{ steps.filter.outputs.docs }}
      style: ${{ steps.filter.outputs.style }}
    steps:
      - uses: actions/checkout@v7
      - id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            docs:
              - 'docs/site/**'
              - '.github/workflows/docs.yml'
            style:
              - 'docs/**'
              - 'examples/**'
              - 'integration/**'
              - 'README.md'
              - '**/README.md'
              - 'AGENTS.md'
              - '.github/workflows/docs.yml'

  style:
    name: Documentation style
    needs: changes
    # The site build only runs for docs/site changes, but the style guide also
    # governs the repository docs, examples, integration docs, package READMEs,
    # and AGENTS.md. Those layers get their own job so a change to one of them
    # cannot merge unchecked.
    if: >-
      github.event_name == 'pull_request' ||
      ( github.event_name == 'push' && github.ref == 'refs/heads/master' &&
        needs.changes.outputs.style == 'true' )
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      # check-style.mjs has no npm dependencies, so this needs no install step.
      - name: Check documentation style
        run: |
          set -euo pipefail
          node docs/site/scripts/check-style.mjs --selftest
          node docs/site/scripts/check-style.mjs
          node docs/site/scripts/build-feature-matrix.mjs --check

  build:
    name: Build versioned site
    needs: changes
    if: >-
      github.event_name == 'pull_request' ||
      ( github.event_name == 'push' &&
        ( startsWith(github.ref, 'refs/tags/v') ||
          (github.ref == 'refs/heads/master' && needs.changes.outputs.docs == 'true') ) )
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: docs/site/package-lock.json

      - name: Self-test the version generator
        run: node docs/site/scripts/gen-versions.mjs --selftest

      - name: Build edge from the current tree
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/master'
        env:
          DOCS_VERSION: edge
          ASTRO_TELEMETRY_DISABLED: "1"
        run: |
          set -euo pipefail
          cd docs/site
          npm ci
          npm run check:links:selftest
          npm run check:links
          npm run check:redirects:selftest
          npm run check:redirects
          npm run check:core-doc-links
          npm run check:page-health
          npm run check:exit-codes:selftest
          npm run check:exit-codes
          npm run check:style:selftest
          npm run check:style
          npx playwright install --with-deps chromium
          npm run check:responsive:selftest
          npm run build
          # Needs the built site, so it runs after the build rather than with
          # the other checks.
          npm run check:responsive
          mkdir -p "$GITHUB_WORKSPACE/_site/edge"
          cp -r dist/. "$GITHUB_WORKSPACE/_site/edge/"

      - name: Build edge from master
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          DOCS_VERSION: edge
          ASTRO_TELEMETRY_DISABLED: "1"
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"
          git worktree add --force "$workdir" origin/master
          (
            cd "$workdir/docs/site"
            DOCS_VERSION=edge ASTRO_TELEMETRY_DISABLED=1 npm ci
            DOCS_VERSION=edge ASTRO_TELEMETRY_DISABLED=1 npm run check:links:selftest
            DOCS_VERSION=edge ASTRO_TELEMETRY_DISABLED=1 npm run check:links
            if [ -f scripts/check-redirects.mjs ]; then
              DOCS_VERSION=edge ASTRO_TELEMETRY_DISABLED=1 npm run check:redirects:selftest
              DOCS_VERSION=edge ASTRO_TELEMETRY_DISABLED=1 npm run check:redirects
            fi
            DOCS_VERSION=edge ASTRO_TELEMETRY_DISABLED=1 npm run check:core-doc-links
            DOCS_VERSION=edge ASTRO_TELEMETRY_DISABLED=1 npm run check:page-health
            DOCS_VERSION=edge ASTRO_TELEMETRY_DISABLED=1 npm run check:exit-codes:selftest
            DOCS_VERSION=edge ASTRO_TELEMETRY_DISABLED=1 npm run check:exit-codes
            DOCS_VERSION=edge ASTRO_TELEMETRY_DISABLED=1 npm run check:style:selftest
            DOCS_VERSION=edge ASTRO_TELEMETRY_DISABLED=1 npm run check:style
            DOCS_VERSION=edge ASTRO_TELEMETRY_DISABLED=1 npm run build
          )
          mkdir -p "$GITHUB_WORKSPACE/_site/edge"
          cp -r "$workdir/docs/site/dist/." "$GITHUB_WORKSPACE/_site/edge/"
          git worktree remove --force "$workdir" || true

      - name: Build each released tag
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          for tag in $(git tag -l 'v*' | grep -E '^v[0-9]+\.[0-9]+(\.[0-9]+)?$' | sort -V | tail -n "${MAX_DOC_TAG_VERSIONS:-10}" || true); do
            echo "::group::Building $tag"
            workdir="$(mktemp -d)"
            git worktree add --force "$workdir" "refs/tags/$tag"
            if [ -f "$workdir/docs/site/package.json" ]; then
              if (
                cd "$workdir/docs/site"
                DOCS_VERSION="$tag" ASTRO_TELEMETRY_DISABLED=1 npm ci
                if [ -f scripts/check-links.mjs ]; then
                  DOCS_VERSION="$tag" ASTRO_TELEMETRY_DISABLED=1 npm run check:links:selftest
                  DOCS_VERSION="$tag" ASTRO_TELEMETRY_DISABLED=1 npm run check:links
                else
                  echo "::warning::$tag has no docs link checker; skipping link validation"
                fi
                if [ -f scripts/check-redirects.mjs ]; then
                  DOCS_VERSION="$tag" ASTRO_TELEMETRY_DISABLED=1 npm run check:redirects
                fi
                if [ -f scripts/check-exit-codes.mjs ]; then
                  DOCS_VERSION="$tag" ASTRO_TELEMETRY_DISABLED=1 npm run check:exit-codes
                fi
                if [ -f scripts/check-core-doc-links.mjs ]; then
                  DOCS_VERSION="$tag" ASTRO_TELEMETRY_DISABLED=1 npm run check:core-doc-links
                fi
                if [ -f scripts/check-page-health.mjs ]; then
                  DOCS_VERSION="$tag" ASTRO_TELEMETRY_DISABLED=1 npm run check:page-health
                fi
                DOCS_VERSION="$tag" ASTRO_TELEMETRY_DISABLED=1 npm run build
              ); then
                mkdir -p "$GITHUB_WORKSPACE/_site/$tag"
                cp -r "$workdir/docs/site/dist/." "$GITHUB_WORKSPACE/_site/$tag/"
              else
                echo "::warning::$tag failed to build; skipping this historical version"
              fi
            else
              echo "::warning::$tag has no docs/site; skipping"
            fi
            git worktree remove --force "$workdir" || true
            echo "::endgroup::"
          done

      - name: Generate root version index and redirect
        if: github.event_name == 'push'
        run: node docs/site/scripts/gen-versions.mjs "$GITHUB_WORKSPACE/_site"

      - name: Upload Pages artifact
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: [changes, build]
    if: >-
      github.event_name == 'push' &&
      ( startsWith(github.ref, 'refs/tags/v') ||
        (github.ref == 'refs/heads/master' && needs.changes.outputs.docs == 'true') )
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
