name: Capability Matrix

# Tier 2 of stokaro/ptah#1341: one capability probe per (dialect, release
# line).
#
# There is deliberately NO `paths:` filter on this workflow. Measured on this
# repository while investigating why the container-bump pull requests show
# fewer checks than a human one: `release.yml` and `ptah-action-smoke.yml`
# filter on `cmd/**`, `internal/**`, `go.mod` and friends, so a pull request
# that touches only a workflow file or docker-compose.yaml matches none of
# them and those jobs never run. An absent check reads exactly like a passing
# one, and the pull requests this tier exists to unblock are precisely the ones
# that change only a container tag.
#
# The unit a filter is evaluated against is the pull request's whole diff, not
# its last commit: a `pull_request` event compares base and head, so a branch
# that adds one commit touching only a workflow file still matches a filter
# some earlier commit satisfied. The exclusion therefore bites exactly the
# pull requests this tier exists to unblock, whose ENTIRE diff is a container
# tag and matches `cmd/**`, `internal/**` and `go.mod` nowhere.
#
# The PROBE FAN-OUT is opt-in; the three cheap jobs beside it are not.
#
# It is one job per (dialect, release line) with a container each, and it was
# the larger half of every pull request's checks -- 26 probe jobs beside 26 of
# everything else. Measured on 2026-08-24, runs created at 18:54 had still not
# been scheduled at 22:00 while newer ones on other branches ran and finished,
# and at one point 97 of the 100 most recent runs were queued with none in
# progress. A one-line fix waited hours behind a conformance sweep nobody asked
# for on that change (stokaro/ptah#2185).
#
#	cells, preset coverage, documented matrix   every pull request and push
#	probe *, tier 2 report                      schedule, dispatch, or a
#	                                            comment on the pull request
#
# `documented matrix` in particular STAYS on every pull request, for the reason
# given in its own job below: it lives here rather than in docs.yml precisely
# because a change that adds a release line or a capability key touches no file
# under `docs/`.
#
# The fan-out is gated by a DECISION rather than by a path filter, for the
# reason above: the `cells` job always runs, always says which cells it selected
# and why, so a pull request that ran no probes says so in its own step summary
# instead of quietly showing fewer checks than the one beside it.
on:
  push:
    branches:
      - master
  pull_request:
    # `labeled` is what makes a requested fan-out a check OF THE PULL REQUEST.
    #
    # The request used to arrive as a workflow_dispatch against the head branch.
    # Its checks did attach to the head commit -- measured on stokaro/ptah#2297,
    # 38 check-run names on the commit -- but a pull request's status rollup
    # ignores a dispatch suite entirely: `gh pr checks` listed 32 of them and
    # none of the six `probe postgres-*`. Worse, where a name existed on both
    # sides the pull request's own SKIPPED `tier 2 report` was what the rollup
    # reported while two FAILURES from the dispatch, both newer, sat on the same
    # commit unseen. A red matrix could not block a merge and did not: #2297 was
    # merged with `probe postgres-18` failing.
    types: [opened, synchronize, reopened, labeled]
  # 03:20 UTC, clear of the tier 3 nightly at 02:40 and the fuzz job at 02:17.
  # Tier 3 probes each cell before running its suite, so this is not the only
  # nightly coverage -- it is the one that reports the probe verdicts on their
  # own, which is what a capability question is read from.
  schedule:
    - cron: '20 3 * * *'
  workflow_dispatch:
    inputs:
      cells:
        description: 'Cells to probe: all, none, or a comma-separated list of cell ids or dialect prefixes (postgres, mysql-8-4).'
        required: false
        default: all

permissions:
  contents: read
  # Reading the pull request's comments is how a requested fan-out learns which
  # cells to probe; nothing here writes.
  pull-requests: read

concurrency:
  group: capability-matrix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cells:
    name: cells
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      cells: ${{ steps.emit.outputs.cells }}
      count: ${{ steps.emit.outputs.count }}
      selected: ${{ steps.select.outputs.selected }}
      reason: ${{ steps.select.outputs.reason }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Build the matrix driver
        run: go build -o "${RUNNER_TEMP}/capmatrix" ./internal/cmd/capmatrix

      - name: Emit the matrix
        id: emit
        run: |
          set -euo pipefail
          # The release lines live in internal/capabilityprobe/cells.go and
          # nowhere else. This workflow carries no list of versions: it asks the
          # declaration what exists, so adding a line is a data change.
          "${RUNNER_TEMP}/capmatrix" matrix >"${RUNNER_TEMP}/matrix.json"
          count="$(jq '.cells | length' "${RUNNER_TEMP}/matrix.json")"
          if [ "${count}" -eq 0 ]; then
            echo "the matrix produced zero runnable cells; a fan-out with no jobs must not report success" >&2
            exit 1
          fi
          # Only the ids cross the job boundary. Measured on run 1 of this
          # workflow: passing the whole cell objects made the runner answer
          # "Skip output 'cells' since it may contain secret" — the throwaway
          # container credentials in each URL are enough — and the strategy
          # then fanned out over an empty list, producing zero jobs. The
          # reporting job caught it as seventeen MISSING cells. Everything that
          # carries a credential is now asked for by id inside the job that
          # needs it.
          {
            echo "cells=$("${RUNNER_TEMP}/capmatrix" matrix --ids)"
            echo "count=${count}"
          } >>"${GITHUB_OUTPUT}"
          {
            echo "## Capability matrix"
            echo
            echo "Declared release lines: $(jq '.declared' "${RUNNER_TEMP}/matrix.json")."
            echo "Cells this tier runs: ${count}."
            echo
            jq -r '.skipped[] | "- `\(.id)` is declared and not run: \(.skip)"' "${RUNNER_TEMP}/matrix.json"
          } >>"${GITHUB_STEP_SUMMARY}"

      # What this pull request asked for, read from its own comments.
      #
      # The request arrives as a comment and a comment starts no
      # `pull_request` event, so capability-matrix-request.yml labels the pull
      # request and the label is what starts this run. The cells come from the
      # comment, because a label cannot carry an argument list and
      # `/capability-matrix postgres` has to keep meaning what it says.
      #
      # The author check is the same one the request workflow applies, and it
      # is applied AGAIN here rather than trusted: a label can be added by
      # anyone who can label, and this job runs the repository's own probe
      # containers. Only a comment by someone with write access selects cells;
      # a label with no such comment behind it probes nothing and says so.
      - name: Read the request from the pull request's comments
        id: request
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # WHY THIS DOES NOT READ author_association FIRST.
          #
          # It used to, and the value it reads here is not the value GitHub put
          # in the webhook payload. `author_association` over the REST API is
          # answered relative to what the READING token can see, and this token
          # is the workflow's own GITHUB_TOKEN: it cannot see a private
          # organization membership, so an owner who is a private member of the
          # organization reads back as an outsider and their request is
          # discarded. Measured on stokaro/ptah#2316: the request comment came
          # from a MEMBER -- `orgs/stokaro/public_members` is empty, so the
          # membership is private -- the same jq filter run with a personal
          # token returned the comment, and the run selected zero cells and went
          # green having probed nothing.
          #
          # So trust comes from the BOT rather than from the commenter. The
          # request workflow checks the requester against the webhook payload's
          # association, which is authoritative, and then writes the cells it
          # verified into its acknowledgement as the marker below. A bot's own
          # identity is something this token can always see.
          #
          # The associations are still read, and printed, so the next person
          # reading a run that probed nothing sees what this token was told
          # rather than having to infer it.
          gh api "repos/${REPO}/issues/${PR}/comments" --paginate \
            --jq '[.[] | select(.user.type == "Bot")
                       | select(.user.login == "github-actions[bot]")
                       | select(.body | contains("<!-- capability-matrix-cells:"))]
                  | last | .body // ""' >"${RUNNER_TEMP}/verified.txt"
          # Greedy up to the closing marker, then trimmed: a request naming several
          # cells is written `postgres, mysql`, and a pattern that stopped at the
          # first space would carry `postgres,` and silently probe half of it.
          verified="$(sed -n 's/.*<!-- capability-matrix-cells:\(.*\)-->.*/\1/p' "${RUNNER_TEMP}/verified.txt" | tail -n 1)"
          verified="$(printf '%s' "${verified}" | sed 's/^[[:space:]]*//; s/[[:space:]]*$//')"

          # What the token sees for the human requests, recorded either way.
          gh api "repos/${REPO}/issues/${PR}/comments" --paginate \
            --jq '[.[] | select(.body | startswith("/capability-matrix"))
                       | "\(.user.login): \(.author_association)"]
                  | join(", ")' >"${RUNNER_TEMP}/seen.txt"
          seen="$(tr '\n' ' ' <"${RUNNER_TEMP}/seen.txt")"
          {
            echo
            echo "### The request on this pull request"
            echo
            echo "Verified by the request workflow: \`${verified:-none}\`."
            echo "Requests this token can see, and the association it is told:" \
              "${seen:-none}."
          } >>"${GITHUB_STEP_SUMMARY}"

          if [ -n "${verified}" ]; then
            {
              echo "cells=${verified}"
              echo "reason=requested on this pull request and verified by the request workflow: ${verified}"
            } >>"${GITHUB_OUTPUT}"
            exit 0
          fi

          # The fallback still works wherever the association IS visible: a
          # public member, an outside collaborator, or a request made by
          # labelling the pull request by hand without commenting.
          gh api "repos/${REPO}/issues/${PR}/comments" --paginate \
            --jq '[.[] | select(.body | startswith("/capability-matrix"))
                       | select(.author_association == "OWNER"
                             or .author_association == "MEMBER"
                             or .author_association == "COLLABORATOR")]
                  | last | .body // ""' >"${RUNNER_TEMP}/request.txt"
          body="$(cat "${RUNNER_TEMP}/request.txt")"
          if [ -z "${body}" ] || [ "${body}" = "null" ]; then
            {
              echo "cells=none"
              echo "reason=no \`/capability-matrix\` comment this token can attribute to a user with write access (associations seen: ${seen:-none})"
            } >>"${GITHUB_OUTPUT}"
            exit 0
          fi
          first="$(printf '%s' "${body}" | head -n 1)"
          cells="${first#/capability-matrix}"
          cells="$(printf '%s' "${cells}" | sed 's/^[[:space:]]*//; s/[[:space:]]*$//')"
          cells="${cells:-all}"
          {
            echo "cells=${cells}"
            echo "reason=requested on this pull request: ${cells}"
          } >>"${GITHUB_OUTPUT}"

      # The selector decides whether this run probes 26 cells or none, and the
      # step below is the only caller. Its selftest was in the tree and reached
      # by nothing -- no workflow and no Makefile target ran it -- which is how
      # the inline copy of the rule drifted from the script for three nights
      # without anything going red. It runs here, in the job that depends on the
      # answer, so a change to the rule is proven before it is used.
      - name: Prove the cell selector
        run: scripts/select-capability-cells-selftest.sh

      # Which of those cells this RUN probes, and why.
      #
      # Separate from the emit step above on purpose. That step's "zero runnable
      # cells is an error" guard is about the DECLARATION -- a matrix that
      # produced nothing must not report success -- and selecting none here is a
      # policy, not a broken declaration. Folding the two would make an opted-out
      # pull request indistinguishable from a matrix that fell over.
      #
      # The reason is written to the step summary in every case, including the
      # empty one. A run that probed nothing has to say so where somebody
      # reading the pull request will see it; the failure mode this whole file
      # warns about is an absent check reading like a passing one.
      - name: Select the cells to probe
        id: select
        env:
          EVENT: ${{ github.event_name }}
          REQUESTED: ${{ github.event.inputs.cells }}
          # The ids the step above published, rather than a second reading of
          # matrix.json. Both spell the same list today -- measured, 26 ids
          # either way -- and asking twice is how they would stop doing so
          # without anything going red.
          ALL: ${{ steps.emit.outputs.cells }}
          PR_REQUEST: ${{ steps.request.outputs.cells }}
          PR_REASON: ${{ steps.request.outputs.reason }}
          ACTION: ${{ github.event.action }}
          LABEL_NAME: ${{ github.event.label.name }}
        run: |
          set -euo pipefail

          # The selection rule lives in scripts/select-capability-cells.sh, and
          # this step calls it rather than restating it. It was restated once,
          # and the copy drifted: the script exempted the `all` sentinel from
          # the typo check and the copy did not, so every scheduled run failed
          # with "requested cells matched nothing: all" while the script's own
          # selftest passed on the same case. A selftest that cannot reach what
          # CI runs proves nothing about it (stokaro/ptah#2185).
          #
          # A pull request request is read in the step above and passed in here,
          # because reading it needs the API and the script takes no network.
          request="${REQUESTED:-}"
          case "${EVENT}" in
            pull_request|pull_request_target)
              request="${PR_REQUEST:-none}"
              ;;
          esac

          output="$(scripts/select-capability-cells.sh "${EVENT}" "${request}" "${ALL}")"
          selected="$(printf '%s\n' "${output}" | sed -n 's/^selected=//p')"
          reason="$(printf '%s\n' "${output}" | sed -n 's/^reason=//p')"

          # The pull request path carries its own sentence, which names the
          # comment that asked. The script cannot know it.
          case "${EVENT}" in
            pull_request|pull_request_target)
              reason="${PR_REASON:-${reason}}"
              ;;
          esac

          count="$(jq 'length' <<<"${selected}")"
          {
            echo "selected=${selected}"
            echo "reason=${reason}"
          } >>"${GITHUB_OUTPUT}"
          {
            echo
            echo "### Probes this run"
            echo
            echo "Cells probed: ${count}. ${reason}"
          } >>"${GITHUB_STEP_SUMMARY}"

          # A run the LABEL started that then probes nothing is the defect this
          # whole file exists to remove, wearing the one disguise it has left: a
          # green check. Somebody asked for the fan-out, the label went on, the
          # run appeared beside the pull request, and it reported success having
          # measured no database at all.
          #
          # Selecting nothing stays a policy everywhere else -- an ordinary pull
          # request probes nothing and says so -- but not here, because here
          # something asked.
          if [ "${ACTION}" = "labeled" ] && [ "${LABEL_NAME}" = "capability-matrix" ] && [ "${count}" -eq 0 ]; then
            echo "the ${LABEL_NAME} label started this run and no request could be read from the pull request" >&2
            echo "reason: ${reason}" >&2
            echo "a requested fan-out that probes nothing must not report success" >&2
            exit 1
          fi

  presets:
    name: preset coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      # A declared release line with no capability preset is a line whose
      # capabilities are a stand-in chosen by saturation. This job is separate
      # from `cells` on purpose: `cells` feeds the fan-out, and a fan-out that
      # failed here would skip every probe, turning a preset gap into a tier
      # that measured nothing.
      - name: Check every declared line names a preset
        run: go run ./internal/cmd/capmatrix presets

  documentation:
    name: documented matrix
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      # This runs here rather than in docs.yml because docs.yml filters on
      # `docs/**`: a pull request that adds a release line to
      # internal/capabilityprobe/cells.go and forgets the documentation matches
      # no filter there, and the drift check would never run on the change that
      # caused the drift.
      # Same reasoning covers the capability tables: a pull request that
      # registers a capability key or a preset touches no file under docs/, so
      # a gate living behind the docs.yml path filter would not run on the
      # change that caused the drift (stokaro/ptah#916). Both are targets of the
      # one command now, so this step checks every generated block rather than
      # the two this job used to name.
      - name: Check the generated documentation blocks
        run: scripts/check-docsync.sh

  probe:
    name: probe ${{ matrix.cell }}
    needs: cells
    # The fan-out this tier exists for, and the reason the tier is opt-in. See
    # the header: one job per cell with a container each, and it outnumbered
    # everything else on every pull request.
    if: needs.cells.outputs.selected != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CELL_ID: ${{ matrix.cell }}
    strategy:
      fail-fast: false
      matrix:
        cell: ${{ fromJSON(needs.cells.outputs.selected) }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Build the matrix driver
        run: go build -o "${RUNNER_TEMP}/capmatrix" ./internal/cmd/capmatrix

      # continue-on-error is deliberate. A cell whose container cannot start —
      # measured on run 2, where `yugabytedb/yugabyte:2025.2.0.0-b0` answered
      # "manifest unknown" — must still reach the reporting job as a named
      # result. Failing the step here skips the probe and the upload, and the
      # cell arrives as MISSING, which says the job did not report rather than
      # what actually happened to it. The probe below fails on the unreachable
      # server instead, with the error in the cell's result.
      - name: Start the server for this cell
        continue-on-error: true
        run: |
          set -euo pipefail
          # One flat argument list, printed by the driver, so this step cannot
          # assemble flags, image and container command in the wrong order.
          "${RUNNER_TEMP}/capmatrix" docker-args --cell "${CELL_ID}" >"${RUNNER_TEMP}/docker-args"
          mapfile -t args <"${RUNNER_TEMP}/docker-args"
          docker run --detach --name capability-probe-server "${args[@]}"

      - name: Probe the cell
        id: probe
        run: |
          # `set +e` is load-bearing: GitHub runs a `run:` block as `bash -e`,
          # so without it the step would die on the probe's non-zero exit and
          # the code below would never be recorded. And no pipe: the probe's
          # exit code IS the measurement, and `probe | tee` would hand $? the
          # status of tee. Output goes to a file and is printed afterwards.
          set +e
          set -uo pipefail
          mkdir -p results
          "${RUNNER_TEMP}/capmatrix" probe \
            --cell "${CELL_ID}" \
            --tier 2 \
            --wait 4m \
            --result "results/${CELL_ID}.json" >"results/${CELL_ID}.log" 2>&1
          code=$?
          cat "results/${CELL_ID}.log"
          echo "code=${code}" >>"${GITHUB_OUTPUT}"

      - name: Server log
        if: always()
        run: docker logs capability-probe-server 2>&1 | tail -n 50 || true

      - name: Upload the cell result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: capability-cell-${{ matrix.cell }}
          path: results/
          if-no-files-found: error
          retention-days: 7

      - name: Report this cell's verdict
        env:
          CODE: ${{ steps.probe.outputs.code }}
        run: |
          set -euo pipefail
          if [ "${CODE}" != "0" ]; then
            echo "cell ${CELL_ID} failed: the capability probe exited ${CODE}" >&2
            exit 1
          fi

  report:
    name: tier 2 report
    needs: [cells, probe]
    # `always()` so a probe that failed still reaches the aggregation -- that is
    # the whole point of the report. The second half is new: with no cells
    # selected there is nothing to aggregate, and the report would otherwise run
    # against an empty results directory and call every declared cell MISSING,
    # turning an opt-out into a red check (stokaro/ptah#2185).
    if: always() && needs.cells.outputs.selected != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      # The download must not decide the verdict. When no cell uploaded
      # anything, the report has to run anyway and say that every declared cell
      # is missing, which is a failure; a download step that failed the job
      # first would report an infrastructure error where the truth is that the
      # tier measured nothing.
      - name: Collect the cell results
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: capability-cell-*
          path: results
          merge-multiple: true

      - name: Build the matrix driver
        run: go build -o "${RUNNER_TEMP}/capmatrix" ./internal/cmd/capmatrix

      - name: Aggregate the tier
        env:
          # The ids the cells job selected, as a comma-separated list. jq -r on
          # a JSON array of strings is what turns one into the other without a
          # shell loop.
          EXPECTED: ${{ join(fromJSON(needs.cells.outputs.selected), ',') }}
        run: |
          set +e
          set -uo pipefail
          mkdir -p results
          # --expected narrows what "missing" means to what THIS run asked for.
          # Without it a partial request -- `/capability-matrix postgres` --
          # leaves every other declared cell without a result, and the report
          # calls each of them MISSING and fails a run that did exactly what it
          # was asked to do. The census itself is unchanged: it still iterates
          # expected cells rather than received ones (stokaro/ptah#2185).
          "${RUNNER_TEMP}/capmatrix" report --tier 2 --results results \
            --expected "${EXPECTED}" >"${RUNNER_TEMP}/tier2.md" 2>&1
          code=$?
          cat "${RUNNER_TEMP}/tier2.md"
          cat "${RUNNER_TEMP}/tier2.md" >>"${GITHUB_STEP_SUMMARY}"
          exit "${code}"
