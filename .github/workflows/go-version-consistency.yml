name: Go Version Consistency

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

jobs:
  # The job id and name are unchanged on purpose: they are what branch
  # protection refers to. Only the check underneath them was replaced.
  check-go-version:
    name: Check Go Version Consistency
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # No setup-go step here on purpose. The check is pure shell -- git grep,
      # awk and grep -- so it runs offline and needs no toolchain to verify how
      # the toolchain is declared.
      - name: Check the Go toolchain has a single source
        run: scripts/check-go-toolchain-single-source.sh
        shell: bash
