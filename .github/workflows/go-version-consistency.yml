name: Go Version Consistency

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

jobs:
  check-go-version:
    name: Check Go Version Consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Self-test the version guard
        run: scripts/check-go-version-consistency.sh --selftest

      - name: Check canonical Go version pins
        run: scripts/check-go-version-consistency.sh
